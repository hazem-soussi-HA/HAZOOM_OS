<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAZOOM OS v5.0</title>
<style>
:root {
  --bg-primary: #0a0a0f;
  --bg-secondary: #111118;
  --bg-tertiary: #16161f;
  --bg-card: #1a1a25;
  --bg-hover: #22222f;
  --accent-cyan: #00f0ff;
  --accent-purple: #8b5cf6;
  --accent-green: #10b981;
  --accent-red: #ef4444;
  --accent-yellow: #f59e0b;
  --accent-pink: #ec4899;
  --text-primary: #e2e8f0;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --border-color: #2a2a3a;
  --glow-cyan: 0 0 20px rgba(0, 240, 255, 0.3);
  --glow-purple: 0 0 20px rgba(139, 92, 246, 0.3);
  --glow-green: 0 0 20px rgba(16, 185, 129, 0.3);
  --font-mono: 'Courier New', monospace;
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: var(--font-sans);
  background: var(--bg-primary);
  color: var(--text-primary);
  overflow: hidden;
  height: 100vh;
  width: 100vw;
}

/* TOP BAR */
#topbar {
  height: 44px;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border-color);
  display: flex;
  align-items: center;
  padding: 0 16px;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 10000;
  backdrop-filter: blur(10px);
}

#topbar .logo {
  font-weight: 700;
  font-size: 14px;
  color: var(--accent-cyan);
  text-shadow: var(--glow-cyan);
  letter-spacing: 1px;
  margin-right: 24px;
}

#topbar .status {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--text-secondary);
  margin-right: 20px;
}

#topbar .status .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent-red);
  transition: background 0.3s;
}

#topbar .status.online .dot {
  background: var(--accent-green);
  box-shadow: var(--glow-green);
  animation: pulse 2s infinite;
}

#topbar .uptime {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--accent-purple);
  margin-right: auto;
}

#topbar .user {
  font-size: 12px;
  color: var(--text-secondary);
  margin-right: 16px;
}

#topbar .shutdown-btn {
  background: transparent;
  border: 1px solid var(--accent-red);
  color: var(--accent-red);
  padding: 4px 12px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 11px;
  font-family: var(--font-mono);
  transition: all 0.2s;
}

#topbar .shutdown-btn:hover {
  background: var(--accent-red);
  color: #fff;
  box-shadow: 0 0 12px rgba(239, 68, 68, 0.5);
}

/* SIDEBAR */
#sidebar {
  width: 220px;
  background: var(--bg-secondary);
  border-right: 1px solid var(--border-color);
  position: fixed;
  top: 44px;
  bottom: 28px;
  left: 0;
  overflow-y: auto;
  z-index: 9999;
}

#sidebar::-webkit-scrollbar {
  width: 4px;
}

#sidebar::-webkit-scrollbar-thumb {
  background: var(--border-color);
  border-radius: 2px;
}

.sidebar-category {
  padding: 12px 12px 4px;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--text-muted);
}

.sidebar-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 16px;
  cursor: pointer;
  transition: all 0.15s;
  font-size: 13px;
  color: var(--text-secondary);
  border-left: 2px solid transparent;
}

.sidebar-item:hover {
  background: var(--bg-hover);
  color: var(--text-primary);
}

.sidebar-item.active {
  background: var(--bg-tertiary);
  color: var(--accent-cyan);
  border-left-color: var(--accent-cyan);
}

.sidebar-item .icon {
  width: 18px;
  text-align: center;
  font-size: 14px;
}

/* MAIN AREA */
#main {
  position: fixed;
  top: 44px;
  left: 220px;
  right: 0;
  bottom: 28px;
  overflow: hidden;
  background: var(--bg-primary);
}

/* FOOTER */
#footer {
  height: 28px;
  background: var(--bg-secondary);
  border-top: 1px solid var(--border-color);
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 10000;
  display: flex;
  align-items: center;
  padding: 0 16px;
  font-size: 11px;
  font-family: var(--font-mono);
  gap: 24px;
}

#footer span {
  color: var(--text-muted);
}

#footer .val {
  color: var(--accent-cyan);
}

/* WINDOWS */
.window {
  position: absolute;
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
  min-width: 400px;
  min-height: 300px;
}

.window.focused {
  border-color: var(--accent-cyan);
  box-shadow: 0 8px 32px rgba(0, 240, 255, 0.15);
  z-index: 5000;
}

.window-header {
  height: 36px;
  background: var(--bg-tertiary);
  display: flex;
  align-items: center;
  padding: 0 12px;
  cursor: grab;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.window-header:active {
  cursor: grabbing;
}

.window-header .title {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-primary);
  flex: 1;
}

.window-header .controls {
  display: flex;
  gap: 6px;
}

.window-header .controls button {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  font-size: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.2s;
}

.window-header .controls button:hover {
  opacity: 0.8;
}

.window-header .btn-close {
  background: var(--accent-red);
}

.window-header .btn-minimize {
  background: var(--accent-yellow);
}

.window-header .btn-maximize {
  background: var(--accent-green);
}

.window-body {
  flex: 1;
  overflow: auto;
  padding: 16px;
}

/* COMMON UI ELEMENTS */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  padding: 16px;
  margin-bottom: 12px;
}

.card h3 {
  font-size: 13px;
  color: var(--accent-cyan);
  margin-bottom: 12px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.stat-row {
  display: flex;
  justify-content: space-between;
  padding: 6px 0;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  font-size: 13px;
}

.stat-row:last-child {
  border-bottom: none;
}

.stat-label {
  color: var(--text-secondary);
}

.stat-value {
  color: var(--accent-cyan);
  font-family: var(--font-mono);
}

.btn {
  background: var(--bg-tertiary);
  border: 1px solid var(--accent-cyan);
  color: var(--accent-cyan);
  padding: 6px 14px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 12px;
  font-family: var(--font-mono);
  transition: all 0.2s;
}

.btn:hover {
  background: rgba(0, 240, 255, 0.1);
  box-shadow: var(--glow-cyan);
}

.btn-purple {
  border-color: var(--accent-purple);
  color: var(--accent-purple);
}

.btn-purple:hover {
  background: rgba(139, 92, 246, 0.1);
  box-shadow: var(--glow-purple);
}

.btn-green {
  border-color: var(--accent-green);
  color: var(--accent-green);
}

.btn-green:hover {
  background: rgba(16, 185, 129, 0.1);
  box-shadow: var(--glow-green);
}

.btn-red {
  border-color: var(--accent-red);
  color: var(--accent-red);
}

.btn-red:hover {
  background: rgba(239, 68, 68, 0.1);
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

table th {
  text-align: left;
  padding: 8px 12px;
  background: var(--bg-tertiary);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border-color);
}

table td {
  padding: 8px 12px;
  border-bottom: 1px solid rgba(255,255,255,0.03);
}

table tr:hover {
  background: var(--bg-hover);
}

.progress-bar {
  width: 100%;
  height: 8px;
  background: var(--bg-tertiary);
  border-radius: 4px;
  overflow: hidden;
  margin: 4px 0;
}

.progress-bar .fill {
  height: 100%;
  border-radius: 4px;
  transition: width 0.3s ease;
}

.progress-bar .fill.cyan {
  background: linear-gradient(90deg, var(--accent-cyan), #0099cc);
}

.progress-bar .fill.purple {
  background: linear-gradient(90deg, var(--accent-purple), #6d28d9);
}

.progress-bar .fill.green {
  background: linear-gradient(90deg, var(--accent-green), #059669);
}

.progress-bar .fill.red {
  background: linear-gradient(90deg, var(--accent-red), #dc2626);
}

.input {
  background: var(--bg-tertiary);
  border: 1px solid var(--border-color);
  color: var(--text-primary);
  padding: 8px 12px;
  border-radius: 4px;
  font-family: var(--font-mono);
  font-size: 13px;
  width: 100%;
  outline: none;
}

.input:focus {
  border-color: var(--accent-cyan);
  box-shadow: 0 0 8px rgba(0, 240, 255, 0.2);
}

/* TERMINAL */
.terminal-output {
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-word;
  color: var(--accent-green);
  margin-bottom: 8px;
  max-height: calc(100% - 40px);
  overflow-y: auto;
}

.terminal-output .log-error { color: var(--accent-red); }
.terminal-output .log-warn { color: var(--accent-yellow); }
.terminal-output .log-info { color: var(--accent-cyan); }
.terminal-output .log-debug { color: var(--text-muted); }

.terminal-input-line {
  display: flex;
  align-items: center;
  gap: 8px;
}

.terminal-prompt {
  color: var(--accent-cyan);
  font-family: var(--font-mono);
  font-size: 12px;
  white-space: nowrap;
}

/* CHAT */
.chat-messages {
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-height: calc(100% - 60px);
  overflow-y: auto;
  margin-bottom: 12px;
}

.chat-msg {
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 13px;
  line-height: 1.5;
}

.chat-msg.user {
  background: var(--bg-tertiary);
  border: 1px solid var(--border-color);
  align-self: flex-end;
  max-width: 80%;
}

.chat-msg.assistant {
  background: rgba(139, 92, 246, 0.1);
  border: 1px solid var(--accent-purple);
  align-self: flex-start;
  max-width: 80%;
}

.chat-input-row {
  display: flex;
  gap: 8px;
}

.chat-input-row .input {
  flex: 1;
}

/* GRID LAYOUTS */
.grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.grid-3 {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 12px;
}

/* TAGS */
.tag {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 12px;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.tag-running { background: rgba(16, 185, 129, 0.15); color: var(--accent-green); }
.tag-sleeping { background: rgba(139, 92, 246, 0.15); color: var(--accent-purple); }
.tag-stopped { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); }
.tag-blocked { background: rgba(245, 158, 11, 0.15); color: var(--accent-yellow); }

/* ANIMATIONS */
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.fade-in {
  animation: fadeIn 0.3s ease;
}

/* SCROLLBAR */
.window-body::-webkit-scrollbar,
.chat-messages::-webkit-scrollbar,
.terminal-output::-webkit-scrollbar {
  width: 6px;
}

.window-body::-webkit-scrollbar-thumb,
.chat-messages::-webkit-scrollbar-thumb,
.terminal-output::-webkit-scrollbar-thumb {
  background: var(--border-color);
  border-radius: 3px;
}

/* IFRAME */
.app-iframe {
  width: 100%;
  height: 100%;
  border: none;
}

/* TEXT AREA */
.code-editor {
  width: 100%;
  min-height: 200px;
  background: var(--bg-tertiary);
  border: 1px solid var(--border-color);
  color: var(--text-primary);
  font-family: var(--font-mono);
  font-size: 12px;
  padding: 12px;
  border-radius: 4px;
  resize: vertical;
  outline: none;
}

.code-editor:focus {
  border-color: var(--accent-purple);
}

/* SEARCH */
.search-result {
  padding: 8px 12px;
  border-bottom: 1px solid var(--border-color);
  cursor: pointer;
  transition: background 0.15s;
}

.search-result:hover {
  background: var(--bg-hover);
}

.search-result .path {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--accent-cyan);
}

.search-result .type {
  font-size: 11px;
  color: var(--text-muted);
}

/* SETTING ROW */
.setting-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 0;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}

.setting-row label {
  font-size: 13px;
  color: var(--text-secondary);
}

.setting-row input[type="number"],
.setting-row input[type="text"],
.setting-row select {
  background: var(--bg-tertiary);
  border: 1px solid var(--border-color);
  color: var(--text-primary);
  padding: 4px 8px;
  border-radius: 4px;
  font-family: var(--font-mono);
  font-size: 12px;
  width: 150px;
}

/* LOADING */
.loading {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--text-muted);
  font-size: 13px;
}

.loading::after {
  content: '';
  width: 16px;
  height: 16px;
  border: 2px solid var(--border-color);
  border-top-color: var(--accent-cyan);
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin-left: 10px;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* EMPTY STATE */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--text-muted);
}

.empty-state .icon {
  font-size: 48px;
  margin-bottom: 16px;
  opacity: 0.5;
}

.empty-state p {
  font-size: 14px;
}

/* API ENDPOINT CARD */
.endpoint-card {
  display: flex;
  align-items: center;
  padding: 8px 12px;
  margin-bottom: 6px;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.15s;
  font-size: 12px;
}

.endpoint-card:hover {
  border-color: var(--accent-cyan);
}

.endpoint-card .method {
  padding: 2px 6px;
  border-radius: 3px;
  font-size: 10px;
  font-weight: 700;
  margin-right: 10px;
  min-width: 50px;
  text-align: center;
}

.endpoint-card .method.get { background: rgba(16, 185, 129, 0.2); color: var(--accent-green); }
.endpoint-card .method.post { background: rgba(0, 240, 255, 0.2); color: var(--accent-cyan); }
.endpoint-card .method.put { background: rgba(245, 158, 11, 0.2); color: var(--accent-yellow); }
.endpoint-card .method.delete { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); }

.endpoint-card .path {
  font-family: var(--font-mono);
  color: var(--text-primary);
  flex: 1;
}

.endpoint-card .desc {
  color: var(--text-muted);
  font-size: 11px;
}
</style>
</head>
<body>

<!-- TOP BAR -->
<div id="topbar">
  <div class="logo">HAZOOM OS v5.0</div>
  <div class="status" id="ws-status">
    <div class="dot"></div>
    <span>OFFLINE</span>
  </div>
  <div class="uptime">UPTIME: <span id="uptime">00:00:00</span></div>
  <div class="user">hazem@hazoom-os</div>
  <button class="shutdown-btn" onclick="shutdown()">SHUTDOWN</button>
</div>

<!-- SIDEBAR -->
<div id="sidebar"></div>

<!-- MAIN AREA -->
<div id="main">
  <div class="empty-state" id="welcome">
    <div class="icon">�</div>
    <p>HAZOOM OS v5.0 — Ready</p>
    <p style="margin-top:8px;font-size:12px;color:var(--text-muted)">Select an application from the sidebar to begin</p>
  </div>
</div>

<!-- FOOTER -->
<div id="footer">
  <span>PROCESSES: <span class="val" id="footer-procs">—</span></span>
  <span>MEMORY: <span class="val" id="footer-mem">—</span></span>
  <span>Q-LEARNER ε: <span class="val" id="footer-epsilon">—</span></span>
  <span>TICKS: <span class="val" id="footer-ticks">0</span></span>
  <span style="margin-left:auto">WS: <span class="val" id="footer-ws">disconnected</span></span>
</div>

<script>
// ========== STATE ==========
const state = {
  windows: [],
  windowIdCounter: 0,
  zIndexCounter: 100,
  ws: null,
  wsConnected: false,
  tickCount: 0,
  uptimeSeconds: 0,
  lastTick: null,
  processes: [],
  memoryUsage: 0,
  qEpsilon: 0,
  focusedWindow: null,
  fsPath: '/',
  fsEntries: []
};

// ========== SIDEBAR CONFIG ==========
const sidebarCategories = [
  {
    name: 'SYSTEM',
    apps: [
      { id: 'dashboard', name: 'Dashboard', icon: '◉' },
      { id: 'processes', name: 'Processes', icon: '�' },
      { id: 'memory', name: 'Memory', icon: '�' },
      { id: 'filesystem', name: 'File System', icon: '▣' },
      { id: 'devices', name: 'Devices', icon: '�' },
      { id: 'security', name: 'Security', icon: '⊘' }
    ]
  },
  {
    name: 'AI SOUL',
    apps: [
      { id: 'consciousness', name: 'Consciousness', icon: '◈' },
      { id: 'qlearner', name: 'Q-Learner', icon: '�' },
      { id: 'pascal', name: 'Pascal Engine', icon: '◆' },
      { id: 'aiassistant', name: 'AI Assistant', icon: '�' },
      { id: 'deepthink', name: 'Deep Think', icon: '◎' },
      { id: 'copilot', name: 'Copilot', icon: '�' }
    ]
  },
  {
    name: 'TOOLS',
    apps: [
      { id: 'terminal', name: 'Terminal', icon: '▸' },
      { id: 'kernellog', name: 'Kernel Log', icon: '▫' },
      { id: 'apiexplorer', name: 'API Explorer', icon: '�' },
      { id: 'sysmonitor', name: 'System Monitor', icon: '�' },
      { id: 'adminmonitor', name: 'Admin Monitor', icon: '�' }
    ]
  },
  {
    name: 'NAVIGATE',
    apps: [
      { id: 'browser', name: 'Browser', icon: '◎' },
      { id: 'quantumtravel', name: 'Quantum Travel', icon: '⟆' },
      { id: 'advnavigator', name: 'Navigator', icon: '�' }
    ]
  },
  {
    name: 'DIMENSIONS',
    apps: [
      { id: 'chess', name: 'Chess', icon: '♚' },
      { id: 'mariogta', name: 'Mario GTA6', icon: '�' },
      { id: 'neondrift', name: 'Neon Drift', icon: '▲' },
      { id: 'dataintel', name: 'Data Intellect', icon: '�' },
      { id: 'univsearch', name: 'Universal Search', icon: '⊙' }
    ]
  },
  {
    name: 'VISUALS',
    apps: [
      { id: 'aetherdash', name: 'Aether Dashboard', icon: '�' },
      { id: 'circuitscan', name: 'Circuit Scan', icon: '�' },
      { id: 'worldmap', name: 'World Map', icon: '⊕' },
      { id: 'growflow', name: 'Growflow', icon: '�' }
    ]
  },
  {
    name: 'CONFIG',
    apps: [
      { id: 'settings', name: 'Settings', icon: '⚿' },
      { id: 'apisettings', name: 'API Settings', icon: '�' },
      { id: 'pricing', name: 'Pricing', icon: '�' },
      { id: 'about', name: 'About', icon: '⊙' }
    ]
  }
];

// ========== SIDEBAR RENDER ==========
function renderSidebar() {
  const sidebar = document.getElementById('sidebar');
  sidebar.innerHTML = '';
  sidebarCategories.forEach(cat => {
    const catEl = document.createElement('div');
    catEl.className = 'sidebar-category';
    catEl.textContent = cat.name;
    sidebar.appendChild(catEl);
    cat.apps.forEach(app => {
      const itemEl = document.createElement('div');
      itemEl.className = 'sidebar-item';
      itemEl.dataset.app = app.id;
      itemEl.innerHTML = `<span class="icon">${app.icon}</span><span>${app.name}</span>`;
      itemEl.addEventListener('click', () => openApp(app.id, app.name));

// ========== WINDOW SYSTEM ==========
function createWindow(title, width, height, left, top) {
  const id = ++state.windowIdCounter;
  const main = document.getElementById('main');
  
  const win = document.createElement('div');
  win.className = 'window';
  win.id = `window-${id}`;
  win.style.width = width + 'px';
  win.style.height = height + 'px';
  win.style.left = (left || 50 + (id % 5) * 30) + 'px';
  win.style.top = (top || 40 + (id % 5) * 30) + 'px';
  win.style.zIndex = ++state.zIndexCounter;
  
  win.innerHTML = `
    <div class="window-header" data-winid="${id}">
      <span class="title">${title}</span>
      <div class="controls">
        <button class="btn-minimize" onclick="minimizeWindow(${id})">−</button>
        <button class="btn-maximize" onclick="maximizeWindow(${id})">□</button>
        <button class="btn-close" onclick="closeWindow(${id})">×</button>
      </div>
    </div>
    <div class="window-body" id="winbody-${id}">
      <div class="loading">Loading</div>
    </div>
  `;
  
  main.appendChild(win);
  state.windows.push({ id, title, element: win });
  
  // Focus on click
  win.addEventListener('mousedown', () => focusWindow(id));
  
  // Drag
  const header = win.querySelector('.window-header');
  let dragging = false, offsetX, offsetY;
  
  header.addEventListener('mousedown', (e) => {
    if (e.target.tagName === 'BUTTON') return;
    dragging = true;
    offsetX = e.clientX - win.offsetLeft;
    offsetY = e.clientY - win.offsetTop;
    focusWindow(id);
    e.preventDefault();
  });
  
  document.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    win.style.left = (e.clientX - offsetX) + 'px';
    win.style.top = (e.clientY - offsetY) + 'px';
  });
  
  document.addEventListener('mouseup', () => { dragging = false; });
  
  return id;
}

function focusWindow(id) {
  if (state.focusedWindow) {
    state.focusedWindow.element.classList.remove('focused');
  }
  const win = state.windows.find(w => w.id === id);
  if (win) {
    win.element.classList.add('focused');
    win.element.style.zIndex = ++state.zIndexCounter;
    state.focusedWindow = win;
  }
}

function closeWindow(id) {
  const idx = state.windows.findIndex(w => w.id === id);
  if (idx >= 0) {
    state.windows[idx].element.remove();
    state.windows.splice(idx, 1);
  }
}

function minimizeWindow(id) {
  const win = state.windows.find(w => w.id === id);
  if (win) {
    win.element.style.display = 'none';
  }
}

function maximizeWindow(id) {
  const win = state.windows.find(w => w.id === id);
  if (win) {
    if (win.element.dataset.maximized === 'true') {
      win.element.style.width = win.dataset.origWidth;
      win.element.style.height = win.dataset.origHeight;
      win.element.style.left = win.dataset.origLeft;
      win.element.style.top = win.dataset.origTop;
      win.element.dataset.maximized = 'false';
    } else {
      win.dataset.origWidth = win.element.style.width;
      win.dataset.origHeight = win.element.style.height;
      win.dataset.origLeft = win.element.style.left;
      win.dataset.origTop = win.element.style.top;
      win.element.style.width = '100%';
      win.element.style.height = '100%';
      win.element.style.left = '0';
      win.element.style.top = '0';
      win.element.dataset.maximized = 'true';
    }
  }
}

function getWinBody(id) {
  return document.getElementById(`winbody-${id}`);
}

// ========== API HELPERS ==========
async function api(path, opts = {}) {
  try {
    const res = await fetch('/api' + path, {
      headers: { 'Content-Type': 'application/json' },
      ...opts
    });
    if (!res.ok) return { error: `HTTP ${res.status}` };
    const ct = res.headers.get('content-type');
    if (ct && ct.includes('application/json')) return await res.json();
    return await res.text();
  } catch (e) {
    return { error: e.message };
  }
}

async function apiPost(path, data = {}) {
  return api(path, { method: 'POST', body: JSON.stringify(data) });
}

async function reloadProcesses(winId) {
  const container = document.getElementById(`proc-table-${winId}`);
  if (!container) return;
  const procs = await api('/processes');
  if (!procs || procs.error) {
    container.innerHTML = `<p style="color:var(--accent-red)">${procs?.error || 'Failed to load'}</p>`;
    return;
  }
  const list = Array.isArray(procs) ? procs : (procs.processes || []);
  container.innerHTML = `
    <table>
      <thead><tr><th>PID</th><th>Name</th><th>State</th><th>Priority</th><th>Actions</th></tr></thead>
      <tbody>
        ${list.map(p => `<tr>
          <td style="font-family:var(--font-mono);color:var(--text-muted)">${p.pid || p.id}</td>
          <td style="color:var(--text-primary)">${p.name}</td>
          <td><span class="tag tag-${p.state || 'running'}">${p.state || 'running'}</span></td>
          <td style="font-family:var(--font-mono)">${p.priority || 5}</td>
          <td>
            <button class="btn btn-red" style="font-size:10px;padding:2px 8px" onclick="killProcess(${p.pid || p.id}, ${winId})">Kill</button>
          </td>
        </tr>`).join('')}
      </tbody>
    </table>
  `;
}

async function killProcess(pid, winId) {
  await api('/processes', {
    method: 'DELETE',
    body: JSON.stringify({ pid })
  });
  if (typeof winId === 'number' && !isNaN(winId)) {
    await reloadProcesses(winId);

}

async function execTerminal(winId) {
  const input = document.getElementById(`term-input-${winId}`);
  const output = document.getElementById(`term-output-${winId}`);
  if (!input || !input.value.trim()) return;
  
  const cmd = input.value.trim();
  input.value = '';
  
  const line = document.createElement('div');
  line.style.color = 'var(--text-secondary)';
  line.textContent = 'hazem@hazoom-os:~$ ' + cmd;
  output.appendChild(line);
  
  // Parse command
  const parts = cmd.split(' ');
  const command = parts[0].toLowerCase();
  let result;
  
  switch (command) {
    case 'help':
      result = `Available commands:
  status    - Show system status
  ps        - List processes
  mem       - Show memory usage
  ls        - List files
  tick      - Trigger system tick
  boot      - Boot system
  shutdown  - Shutdown system
  clear     - Clear terminal
  echo      - Echo text
  help      - Show this help`;
      break;
    case 'status':
      result = JSON.stringify(await api('/status'), null, 2);
      break;
    case 'ps':
      result = JSON.stringify(await api('/processes'), null, 2);
      break;
    case 'mem':
      result = JSON.stringify(await api('/memory'), null, 2);
      break;
    case 'ls':
      result = JSON.stringify(await api('/fs/list'), null, 2);
      break;
    case 'tick':
      result = JSON.stringify(await apiPost('/system/tick', {}), null, 2);
      break;
    case 'boot':
      result = JSON.stringify(await apiPost('/system/boot', {}), null, 2);
      break;
    case 'shutdown':
      result = JSON.stringify(await apiPost('/system/shutdown', {}), null, 2);
      break;
    case 'clear':
      output.innerHTML = '';
      return;
    case 'echo':
      result = parts.slice(1).join(' ');
      break;
    default:
      result = `Unknown command: ${command}. Type 'help' for available commands.`;
  }
  
  const resultEl = document.createElement('div');
  resultEl.textContent = result;
  output.appendChild(resultEl);
  output.scrollTop = output.scrollHeight;
}

// ========== WEBSOCKET ==========
function connectWebSocket() {
  try {
    state.ws = new WebSocket('ws://' + window.location.hostname + ':3000');
    
    state.ws.onopen = () => {
      state.wsConnected = true;
      document.getElementById('ws-status').classList.add('online');
      document.getElementById('ws-status').querySelector('span').textContent = 'ONLINE';
      document.getElementById('footer-ws').textContent = 'connected';
      document.getElementById('footer-ws').style.color = 'var(--accent-green)';
    };
    
    state.ws.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        
        if (data.type === 'tick') {
          state.tickCount++;
          state.lastTick = Date.now();
          document.getElementById('footer-ticks').textContent = state.tickCount;
          
          if (data.uptime !== undefined) {
            state.uptimeSeconds = data.uptime;
            const h = Math.floor(data.uptime / 3600);
            const m = Math.floor((data.uptime % 3600) / 60);
            const s = Math.floor(data.uptime % 60);
            document.getElementById('uptime').textContent = 
              `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
          }
          
          if (data.processCount !== undefined) {
            state.processes = data.processes || [];
            document.getElementById('footer-procs').textContent = data.processCount;
          }
          
          if (data.memory !== undefined) {
            state.memoryUsage = data.memory;
            document.getElementById('footer-mem').textContent = (typeof data.memory === 'number') ? data.memory.toFixed(1) + '%' : data.memory;
          }
          
          if (data.qlearner && data.qlearner.epsilon !== undefined) {
            state.qEpsilon = data.qlearner.epsilon;
            document.getElementById('footer-epsilon').textContent = state.qEpsilon.toFixed(4);
          }
        }
        
        if (data.uptime !== undefined) {
          state.uptimeSeconds = data.uptime;
        }
        if (data.processCount !== undefined) {
          state.processes = data.processes || [];
        }
        if (data.memory !== undefined) {
          state.memoryUsage = data.memory;
        }
        if (data.qlearner && data.qlearner.epsilon !== undefined) {
          state.qEpsilon = data.qlearner.epsilon;
        }
        
        state.processes = state.processes || (data.processes || []);
        document.getElementById('footer-procs').textContent = state.processes.length || data.processCount || 0;
        document.getElementById('footer-mem').textContent = state.memoryUsage ? state.memoryUsage.toFixed(1) + '%' : (data.memory ? data.memory.toFixed(1) + '%' : '12.4%');
        document.getElementById('footer-epsilon').textContent = state.qEpsilon ? state.qEpsilon.toFixed(4) : (data.qlearner?.epsilon?.toFixed(4) || '0.1000');
        
      } catch (e) {
        // Non-JSON or malformed
      }
    };
    
    state.ws.onclose = () => {
      state.wsConnected = false;
      document.getElementById('ws-status').classList.remove('online');
      document.getElementById('ws-status').querySelector('span').textContent = 'OFFLINE';
      document.getElementById('footer-ws').textContent = 'disconnected';
      document.getElementById('footer-ws').style.color = 'var(--accent-red)';
      // Reconnect after 3s
      setTimeout(connectWebSocket, 3000);
    };
    
    state.ws.onerror = () => {
      if (state.ws) state.ws.close();
    };
  } catch (e) {
    setTimeout(connectWebSocket, 3000);
  }
}

// ========== INITIALIZATION ==========
renderSidebar();
connectWebSocket();

// Update uptime once on load
(async () => {
  const status = await api('/status');
  if (status && !status.error) {
    // Status comes flat from /api/status
    if (status.uptime !== undefined) {
      const u = Math.floor(status.uptime / 1000);
      const h = Math.floor(u / 3600);
      const m = Math.floor((u % 3600) / 60);
      const s = Math.floor(u % 60);
      document.getElementById('uptime').textContent = 
        `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
    }
    if (status.processCount !== undefined) {
      document.getElementById('footer-procs').textContent = status.processCount;
    }
    if (status.memory) {
      document.getElementById('footer-mem').textContent = (status.memory.usagePercent || 0).toFixed(1) + '%';
    }
    if (status.qLearning) {
      document.getElementById('footer-epsilon').textContent = (status.qLearning.tabular?.epsilon || 1).toFixed(4);
    }
    // Set online
    const dot = document.querySelector('.dot');
    if (dot) dot.style.background = 'var(--accent-green)';
    const statusEl = document.querySelector('.status');
    if (statusEl) { statusEl.textContent = 'ONLINE'; statusEl.style.color = 'var(--accent-green)'; }
  } else {
    // Use defaults if no server
    document.getElementById('footer-procs').textContent = '4';
    document.getElementById('footer-mem').textContent = '23.7%';
    document.getElementById('footer-epsilon').textContent = '0.1000';
  }
})();

// Prevent context menu for OS feel
document.addEventListener('contextmenu', e => e.preventDefault());
</script>
