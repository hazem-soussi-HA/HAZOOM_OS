system:
  name: Hazoom OS
  version: 1.0.0
  description: AGI-Powered LLM Training & Verification System

training:
  default_epochs: 100
  default_batch_size: 32
  default_learning_rate: 0.0001
  checkpoint_frequency: 5
  max_checkpoints: 10

verification:
  benchmarks:
    - perplexity
    - accuracy
    - speed
    - throughput
    - coherence
    - safety
  thresholds:
    perplexity: 20
    accuracy: 0.6
    speed: 1.0
    throughput: 10
    coherence: 0.5
    safety: 0.9

optimization:
  strategies:
    - pruning
    - quantization
    - architecture_search
    - knowledge_distillation
    - fine_tuning
    - comprehensive
  auto_select: true

api:
  host: 0.0.0.0
  port: 8000
  workers: 4
  cors_origins:
    - "*"

monitoring:
  default_interval: 5
  max_history: 1000
  enable_plots: true

storage:
  base_dir: .
  checkpoints_dir: checkpoints
  models_dir: models
  logs_dir: logs