<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 520" fill="none">
  <defs>
    <!-- Photo frame gradient -->
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1f3c"/>
      <stop offset="50%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#060d1a"/>
    </linearGradient>
    <!-- Glow effects -->
    <filter id="photoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feFlood flood-color="#00d4ff" flood-opacity="0.15"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softOuterGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <!-- Clip path for the photo — rounded rectangle -->
    <clipPath id="photoClip">
      <rect x="30" y="30" width="360" height="360" rx="24" ry="24"/>
    </clipPath>
    <!-- Vignette for photo -->
    <radialGradient id="vignette" cx="50%" cy="45%" r="55%">
      <stop offset="60%" stop-color="transparent"/>
      <stop offset="100%" stop-color="rgba(3,7,18,0.4)"/>
    </radialGradient>
    <!-- Scan line pattern -->
    <pattern id="scanlines" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="4" y2="0" stroke="#00d4ff" stroke-width="0.3" opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Outer ambient glow -->
  <ellipse cx="210" cy="260" rx="190" ry="240" fill="#00d4ff" opacity="0.03"/>

  <!-- Outer frame border -->
  <rect x="20" y="20" width="380" height="480" rx="28" ry="28" fill="url(#frameGrad)" stroke="#00d4ff" stroke-width="0.8" opacity="0.6"/>
  <rect x="25" y="25" width="370" height="470" rx="26" ry="26" fill="none" stroke="#00d4ff" stroke-width="0.3" opacity="0.2"/>

  <!-- Photo area background -->
  <rect x="30" y="30" width="360" height="360" rx="24" ry="24" fill="#030712"/>

  <!-- The actual photo — embedded as image -->
  <g clip-path="url(#photoClip)">
    <image href="hazem-photo.jpg" x="30" y="30" width="360" height="360" preserveAspectRatio="xMidYMid slice"/>
    <!-- Vignette overlay -->
    <rect x="30" y="30" width="360" height="360" rx="24" ry="24" fill="url(#vignette)"/>
    <!-- Scan lines overlay -->
    <rect x="30" y="30" width="360" height="360" rx="24" ry="24" fill="url(#scanlines)"/>
  </g>

  <!-- Photo frame glow -->
  <rect x="30" y="30" width="360" height="360" rx="24" ry="24" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.3" filter="url(#photoGlow)"/>

  <!-- Corner accents — cyber security style -->
  <g stroke="#00d4ff" stroke-width="1.5" opacity="0.4" fill="none">
    <!-- Top-left -->
    <path d="M30 50 L30 30 L50 30"/>
    <!-- Top-right -->
    <path d="M370 30 L390 30 L390 50"/>
    <!-- Bottom-left -->
    <path d="M30 370 L30 390 L50 390"/>
    <!-- Bottom-right -->
    <path d="M370 390 L390 390 L390 370"/>
  </g>

  <!-- Data stream lines on the frame -->
  <g stroke="#00d4ff" fill="none" opacity="0.08">
    <line x1="35" y1="410" x2="385" y2="410" stroke-width="0.5"/>
    <line x1="35" y1="415" x2="200" y2="415" stroke-width="0.3"/>
    <line x1="250" y1="415" x2="385" y2="415" stroke-width="0.3"/>
  </g>

  <!-- Name plate area -->
  <g>
    <!-- Plate background -->
    <rect x="60" y="420" width="300" height="50" rx="8" fill="#0a1628" stroke="#00d4ff" stroke-width="0.4" opacity="0.7"/>

    <!-- Name -->
    <text x="210" y="445" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="14" font-weight="700" opacity="0.8" letter-spacing="4">
      HAZEM SOUSSI
    </text>
    <!-- Title -->
    <text x="210" y="460" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="7" opacity="0.35" letter-spacing="3">
      OS ARCHITECT // GAME DEVELOPER
    </text>
  </g>

  <!-- Floating particles around the frame -->
  <g fill="#00d4ff">
    <circle cx="15" cy="100" r="1" opacity="0.08">
      <animate attributeName="cy" values="100;90;100" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="405" cy="150" r="0.8" opacity="0.06">
      <animate attributeName="cy" values="150;140;150" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="20" cy="300" r="1.2" opacity="0.05">
      <animate attributeName="cy" values="300;290;300" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="350" r="0.9" opacity="0.07">
      <animate attributeName="cy" values="350;340;350" dur="5.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="15" r="0.7" opacity="0.1">
      <animate attributeName="cy" values="15;10;15" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="320" cy="10" r="0.8" opacity="0.08">
      <animate attributeName="cy" values="10;5;10" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Bottom signature line -->
  <g opacity="0.25">
    <line x1="80" y1="490" x2="340" y2="490" stroke="#00d4ff" stroke-width="0.2"/>
    <text x="210" y="505" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="5.5" opacity="0.3" letter-spacing="2">
      THE SHADOW BUILDER — TUNISIA
    </text>
  </g>
</svg>
