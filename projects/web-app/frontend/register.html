<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - Hazoom</title>
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./hazoom_assets_styles.css">
</head>
<body class="login-body">
    <div class="login-container">
        <img src="./assets/images/logo_hazoom.png" alt="Hazoom" class="login-logo">
        <h2>Créer un compte</h2>

        <form id="registerForm">
            <div class="form-group">
                <label for="name">Nom complet</label>
                <input type="text" id="name" required placeholder="Votre nom complet">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required placeholder="votre@email.com">
            </div>

            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>

            <div id="errorMessage" class="error-message"></div>

            <button type="submit" class="btn btn-primary login-btn">
                <span id="btnText">S'inscrire</span>
                <span id="btnLoader" class="hidden">Chargement...</span>
            </button>
        </form>

        <p class="register-link">
            Déjà un compte ? <a href="login.html">Connectez-vous</a>
        </p>
    </div>

    <script src="./auth.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', handleRegister);
    </script>
</body>
</html>
