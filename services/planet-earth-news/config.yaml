# Planet Earth News — configuration
# You are sovereign here: edit the sources, the platform obeys.

server:
  bind: "127.0.0.1"     # loopback only — not exposed to the LAN
  port: 8000
  debug: false

fetcher:
  timeout_seconds: 15
  max_bytes: 5242880   # 5 MB cap per feed response (SSRF / memory guard)
  user_agent: "PlanetEarthNews/0.1 (+local)"
  retries: 2
  retry_backoff_seconds: 1.0

# Sources. Each entry is one aggregated feed.
# For YouTube, use a channel RSS URL (no API key required):
#   https://www.youtube.com/feeds/videos.xml?channel_id=<ID>
#   or by handle:  https://www.youtube.com/feeds/videos.xml?user=<handle>
# Reuters / CGTN are proxied via Google News RSS search (their native RSS is
# dead/blocked); this keeps the platform key-free and working out of the box.
sources:
  - name: "BBC World"
    type: "rss"
    url: "https://feeds.bbci.co.uk/news/world/rss.xml"
  - name: "Al Jazeera"
    type: "rss"
    url: "https://www.aljazeera.com/xml/rss/all.xml"
  - name: "France 24 (EN)"
    type: "rss"
    url: "https://www.france24.com/en/rss"
  - name: "Deutsche Welle (EN)"
    type: "rss"
    url: "https://rss.dw.com/rdf/rss-en-all"
  - name: "Reuters (via Google News)"
    type: "rss"
    url: "https://news.google.com/rss/search?q=when:24h+site:reuters.com&hl=en-US&gl=US&ceid=US:en"
  - name: "CGTN (China, via Google News)"
    type: "rss"
    url: "https://news.google.com/rss/search?q=when:24h+site:cgtn.com&hl=en-US&gl=US&ceid=US:en"
  - name: "YouTube: BBC News"
    type: "youtube"
    url: "https://www.youtube.com/feeds/videos.xml?channel_id=UC16niRr50-MSBwiO3YDb3RA"
  - name: "YouTube: Al Jazeera"
    type: "youtube"
    url: "https://www.youtube.com/feeds/videos.xml?user=aljazeeraenglish"

# Host allow-list for outbound fetch (SSRF guard). Only these hosts are fetched.
# Private/loopback addresses are always rejected regardless of this list.
allowed_hosts:
  - "feeds.bbci.co.uk"
  - "www.aljazeera.com"
  - "www.france24.com"
  - "rss.dw.com"
  - "news.google.com"
  - "www.youtube.com"

# Optional global search query to filter items (empty = all).
filter_query: ""
