<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>Planet Earth News</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌍%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/static/style.min.css" crossorigin="anonymous" integrity="__SRI_CSS__" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <button id="home" class="globe" type="button" title="Back to home &amp; refresh" aria-label="Back to home and refresh">🌍</button>
      <div class="brand-text">
        <h1>Planet&nbsp;Earth&nbsp;News</h1>
        <span class="tagline">sovereign · local-first · your feeds, your rules</span>
      </div>
    </div>
    <form id="search" class="search">
      <input id="q" type="search" placeholder="Filter the planet… (e.g. climate, Gaza, tech)" maxlength="120" />
      <button type="submit">Search</button>
    </form>
    <button id="refresh" class="ghost" title="Reload feeds">↻ Refresh</button>
  </header>

  <section id="status" class="status"></section>

  <section class="posture" id="posture" aria-label="security posture"></section>

  <main>
    <section class="col">
      <h2 class="col-title">📰 Headlines <span id="art-count" class="badge"></span></h2>
      <div id="articles" class="cards"></div>
    </section>
    <section class="col">
      <h2 class="col-title">📺 Videos <span id="vid-count" class="badge"></span></h2>
      <div id="videos" class="cards"></div>
    </section>
  </main>

  <footer class="foot">
    <div id="health"></div>
    <div class="prov">Sources controlled by you in <code>config.yaml</code> · nothing leaves your machine except the feeds you chose</div>
  </footer>

  <div id="lightbox" class="lightbox" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-label="Video player">
    <div class="lb-backdrop" data-close></div>
    <div class="lb-frame">
      <button class="lb-close" data-close type="button" aria-label="Close video">✕</button>
      <div class="lb-video" id="lb-video"></div>
      <div class="lb-meta"><a id="lb-title" href="#" target="_blank" rel="noopener"></a><span class="lb-note">plays via YouTube (nocookie)</span></div>
    </div>
  </div>

  <script nonce="__NONCE__">window.PEN_TOKEN = "__PEN_TOKEN__";</script>
  <script src="/static/app.min.js" crossorigin="anonymous" integrity="__SRI__" nonce="__NONCE__"></script>
</body>
</html>
