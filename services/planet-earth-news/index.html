<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Planet Earth News</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#0b1220; --card:#111b30; --line:#1e2c4a; --accent:#00f0ff; --text:#d7e3f4; --muted:#7d8fae; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; min-height:100vh; }
  header { display:flex; align-items:center; gap:12px; padding:18px 28px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:5; }
  header .logo { font-size:26px; }
  header h1 { font-size:19px; letter-spacing:1px; font-weight:600; }
  header .live { margin-left:auto; display:flex; align-items:center; gap:7px; font-size:12px; color:var(--accent); }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--accent); animation:pulse 1.4s infinite; }
  @keyframes pulse { 50% { opacity:.25; } }
  nav { display:flex; gap:8px; padding:14px 28px 0; flex-wrap:wrap; }
  nav button { background:#16223c; color:var(--muted); border:1px solid var(--line); padding:7px 16px; border-radius:20px; font-size:13px; cursor:pointer; transition:.15s; }
  nav button.active, nav button:hover { color:var(--accent); border-color:var(--accent); }
  main { padding:22px 28px 60px; max-width:1100px; margin:0 auto; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:18px; }
  article { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; transition:.2s; }
  article:hover { border-color:var(--accent); transform:translateY(-2px); }
  article .cat { font-size:11px; text-transform:uppercase; letter-spacing:1.5px; color:var(--accent); }
  article h2 { font-size:16px; margin:10px 0 8px; line-height:1.4; }
  article p { font-size:13.5px; color:var(--muted); line-height:1.6; }
  article footer { display:flex; justify-content:space-between; margin-top:14px; font-size:11.5px; color:#5b6d8e; }
  .empty { text-align:center; color:var(--muted); padding:60px 0; font-size:14px; }
</style>
</head>
<body>
<header>
  <div class="logo">🌍</div>
  <h1>PLANET EARTH NEWS</h1>
  <div class="live"><span class="dot"></span>LIVE FEED</div>
</header>
<nav id="nav"></nav>
<main><div id="grid" class="grid"><div class="empty">Loading feed…</div></div></main>
<script>
  let articles = [];
  const CATS = ['all','world','science','space','ecology','technology'];
  const nav = document.getElementById('nav');
  CATS.forEach(c => {
    const b = document.createElement('button');
    b.textContent = c;
    b.onclick = () => { document.querySelectorAll('nav button').forEach(x => x.classList.remove('active')); b.classList.add('active'); render(c); };
    nav.appendChild(b);
  });
  nav.firstChild.classList.add('active');

  function render(cat) {
    const grid = document.getElementById('grid');
    const list = cat === 'all' ? articles : articles.filter(a => a.category === cat);
    if (!list.length) { grid.innerHTML = '<div class="empty">No stories in this category yet.</div>'; return; }
    grid.innerHTML = list.map(a => `
      <article>
        <div class="cat">${a.category}</div>
        <h2>${a.title}</h2>
        <p>${a.body}</p>
        <footer><span>${a.source}</span><span>${a.date}</span></footer>
      </article>`).join('');
  }

  async function refresh() {
    try {
      const r = await fetch('/api/news');
      const d = await r.json();
      articles = d.articles;
      const active = document.querySelector('nav button.active');
      render(active ? active.textContent : 'all');
    } catch (e) { console.error('feed error', e); }
  }
  refresh();
  setInterval(refresh, 60000);
</script>
</body>
</html>
