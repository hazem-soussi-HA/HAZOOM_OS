# Super Mario GTA6 — Training Configuration

# PPO Training Hyperparameters
# Usage: python -m python.ai.trainer --config configs/ppo_mario.yaml

environment:
  max_steps_per_episode: 1000
  num_envs: 1
  headless: true

training:
  total_timesteps: 1000000
  learning_rate: 0.0003
  batch_size: 64
  num_epochs: 4
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5

network:
  frame_height: 84
  frame_width: 84
  frame_stack: 4
  state_dim: 16
  lstm_hidden: 256
  num_actions: 8
  device: auto  # auto, cuda, mps, cpu

logging:
  log_interval: 10
  save_interval: 100
  save_dir: checkpoints
  tensorboard_dir: logs/tensorboard

reward:
  coin_reward: 5.0
  enemy_reward: 10.0
  death_penalty: -10.0
  time_penalty: -0.01
  progress_weight: 1.0
  completion_bonus: 100.0
  survival_bonus: 0.01

curriculum:
  enabled: true
  stages:
    - {level: easy, episodes: 100}
    - {level: medium, episodes: 300}
    - {level: hard, episodes: 600}
