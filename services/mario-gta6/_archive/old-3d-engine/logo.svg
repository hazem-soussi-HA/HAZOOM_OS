<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4444"/>
      <stop offset="100%" style="stop-color:#cc0000"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffe066"/>
      <stop offset="50%" style="stop-color:#ffcc00"/>
      <stop offset="100%" style="stop-color:#cc9900"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ffff"/>
      <stop offset="50%" style="stop-color:#ff00ff"/>
      <stop offset="100%" style="stop-color:#00ffff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="3" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Background glow -->
  <ellipse cx="400" cy="110" rx="350" ry="80" fill="url(#neonGrad)" opacity="0.08">
    <animate attributeName="opacity" values="0.05;0.12;0.05" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Mario Hat Shape - iconic red cap -->
  <g filter="url(#shadow)">
    <!-- Hat top -->
    <ellipse cx="85" cy="62" rx="55" ry="35" fill="url(#redGrad)"/>
    <!-- Hat brim -->
    <rect x="40" y="85" width="90" height="18" rx="6" fill="url(#redGrad)"/>
    <!-- Hat band -->
    <rect x="42" y="78" width="86" height="8" rx="3" fill="#ffffff"/>
    <!-- M letter on hat -->
    <text x="85" y="72" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="32" font-weight="900" fill="#ffffff" filter="url(#glow)">M</text>
    
    <!-- Mini mushroom icon -->
    <g transform="translate(52,42)">
      <ellipse cx="8" cy="6" rx="10" ry="7" fill="#ff3333"/>
      <rect x="2" y="5" width="12" height="8" rx="2" fill="#ffcc99"/>
      <circle cx="5" cy="4" r="2" fill="#ffffff"/>
      <circle cx="11" cy="3" r="1.5" fill="#ffffff"/>
    </g>
  </g>
  
  <!-- Main Title: SUPER MARIO -->
  <g filter="url(#bigGlow)">
    <text x="165" y="100" font-family="Arial Black, Impact, sans-serif" font-size="58" font-weight="900" fill="#ff3333" letter-spacing="2">
      <tspan>SUPER </tspan>
      <tspan fill="#ffcc00">MARIO</tspan>
    </text>
  </g>
  
  <!-- GTA6 subtitle with neon effect -->
  <g filter="url(#bigGlow)">
    <text x="168" y="165" font-family="Arial Black, Impact, sans-serif" font-size="72" font-weight="900" fill="url(#neonGrad)" letter-spacing="4">
      GTA<tspan fill="#ff00ff" font-size="80">6</tspan>
    </text>
  </g>
  
  <!-- Tagline -->
  <text x="168" y="190" font-family="monospace" font-size="11" fill="#667788" letter-spacing="6">THE UNIFIED VISION</text>
  
  <!-- Animated scan line -->
  <line x1="155" y1="30" x2="750" y2="30" stroke="#00ffff" stroke-width="1" opacity="0.0">
    <animate attributeName="opacity" values="0;0.6;0" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="y1" values="30;195;30" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="30;195;30" dur="4s" repeatCount="indefinite"/>
  </line>
</svg>