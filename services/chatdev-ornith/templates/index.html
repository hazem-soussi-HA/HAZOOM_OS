<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChatDev · Ornith</title>
  <style>
    :root {
      --bg: #0b0e14;
      --bg-2: #11161f;
      --panel: #151b26;
      --panel-2: #1b2230;
      --border: #232c3b;
      --text: #e6edf3;
      --muted: #8b97a8;
      --accent: #6ea8fe;
      --accent-2: #7ee787;
      --user: #1f3a5f;
      --danger: #ff7b72;
      --radius: 14px;
      --shadow: 0 8px 30px rgba(0,0,0,.35);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 80% -10%, #16203200, #0b0e14), var(--bg);
      color: var(--text);
      display: grid;
      grid-template-columns: 280px 1fr;
      overflow: hidden;
    }
    /* ---------- Sidebar ---------- */
    .sidebar {
      background: var(--bg-2);
      border-right: 1px solid var(--border);
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      overflow-y: auto;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand .dot {
      width: 12px; height: 12px; border-radius: 50%;
      background: var(--accent-2); box-shadow: 0 0 12px var(--accent-2);
    }
    .brand h1 { font-size: 16px; margin: 0; letter-spacing: .3px; }
    .brand small { color: var(--muted); font-size: 11px; display: block; }

    .group { display: flex; flex-direction: column; gap: 8px; }
    .group > label { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); }
    select, input[type="number"] {
      width: 100%; padding: 9px 10px; border-radius: 10px;
      background: var(--panel); color: var(--text);
      border: 1px solid var(--border); font-size: 13px;
    }
    .row { display: flex; gap: 8px; }
    .row > * { flex: 1; }

    .btn {
      border: 1px solid var(--border); background: var(--panel);
      color: var(--text); padding: 9px 10px; border-radius: 10px;
      cursor: pointer; font-size: 13px; transition: .15s;
    }
    .btn:hover { background: var(--panel-2); border-color: #2f3b4f; }
    .btn.primary { background: var(--accent); color: #07101f; border: none; font-weight: 600; }
    .btn.primary:hover { filter: brightness(1.08); }
    .btn:disabled { opacity: .5; cursor: default; }

    .status {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px; font-size: 12px; color: var(--muted);
      white-space: pre-wrap; line-height: 1.5;
    }
    .status b { color: var(--text); font-weight: 600; }

    /* ---------- Main ---------- */
    .main { display: flex; flex-direction: column; min-width: 0; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 18px; border-bottom: 1px solid var(--border); background: var(--bg-2);
    }
    .topbar .title { font-size: 14px; font-weight: 600; }
    .topbar .meta { font-size: 12px; color: var(--muted); }
    .topbar .meta .pill {
      display: inline-block; padding: 2px 8px; border-radius: 999px;
      background: var(--panel); border: 1px solid var(--border); margin-left: 6px;
    }

    #messages { flex: 1; overflow-y: auto; padding: 22px; display: flex; flex-direction: column; gap: 14px; }
    .msg { max-width: 78%; padding: 12px 14px; border-radius: var(--radius); line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; font-size: 14px; }
    .msg .role { font-size: 11px; color: var(--muted); margin-bottom: 5px; }
    .msg.user { align-self: flex-end; background: var(--user); border: 1px solid #2c4a73; }
    .msg.assistant { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); }
    .msg.assistant.thinking::after { content: "▍"; animation: blink 1s steps(2) infinite; color: var(--muted); }
    .msg.error { align-self: stretch; max-width: 100%; background: #2a1414; border: 1px solid #5a2222; color: var(--danger); }

    @keyframes blink { 0%,50% { opacity: 1; } 50.01%,100% { opacity: 0; } }

    .footer {
      display: flex; align-items: center; gap: 12px; padding: 12px 18px;
      border-top: 1px solid var(--border); background: var(--bg-2);
    }
    #input {
      flex: 1; resize: none; height: 46px; max-height: 140px; padding: 12px 14px;
      border-radius: 12px; border: 1px solid var(--border);
      background: var(--panel); color: var(--text); font-size: 14px; font-family: inherit;
    }
    #stats { font-size: 11px; color: var(--muted); min-width: 150px; text-align: right; }
    .spinner { width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; display: none; }
    .spinner.on { display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 720px) {
      body { grid-template-columns: 1fr; }
      .sidebar { display: none; }
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <span class="dot" id="statusDot"></span>
      <div>
        <h1>ChatDev</h1>
        <small>Ornith · local AI</small>
      </div>
    </div>

    <div class="group">
      <label for="model">Model</label>
      <select id="model"></select>
    </div>

    <div class="group">
      <label>Context window (tokens)</label>
      <div class="row">
        <select id="numCtx">
          <option value="2048">2048</option>
          <option value="4096" selected>4096</option>
          <option value="8192">8192</option>
        </select>
      </div>
    </div>

    <div class="group">
      <label for="keepAlive">Keep model loaded</label>
      <select id="keepAlive">
        <option value="-1" selected>Forever</option>
        <option value="5m">5 min</option>
        <option value="1h">1 hour</option>
      </select>
    </div>

    <div class="group">
      <button class="btn" id="warmBtn">Warm model now</button>
    </div>

    <div class="group">
      <label>Device status (CPU / GPU)</label>
      <div class="status" id="statusBox">loading…</div>
    </div>

    <div style="margin-top:auto; font-size:11px; color:var(--muted); line-height:1.5;">
      Loopback only · offline-safe.<br>
      ornith:35b (21 GB) runs mostly on CPU; KV-cache uses your RTX 3050 Ti (4 GB).
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <span class="title" id="title">Ornith Chat</span>
      <span class="meta" id="metaPill"><span class="pill">—</span></span>
    </div>

    <div id="messages"></div>

    <div class="footer">
      <span class="spinner" id="spinner"></span>
      <textarea id="input" placeholder="Type a message — Enter to send, Shift+Enter for newline"></textarea>
      <button class="btn primary" id="sendBtn">Send</button>
      <button class="btn" id="stopBtn" disabled>Stop</button>
    </div>
    <div id="stats"></div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const messagesEl = $("messages"), inputEl = $("input");
    const sendBtn = $("sendBtn"), stopBtn = $("stopBtn"), spinner = $("spinner");
    const modelSel = $("model"), numCtxSel = $("numCtx"), keepAliveSel = $("keepAlive");

    let conversation = [];
    let controller = null;        // AbortController for the current fetch (Stop)
    let currentModel = null;

    // ---- bootstrap ----
    fetch("/api/models").then(r => r.json()).then(d => {
      const models = d.models && d.models.length ? d.models : [d.current || "ornith:35b"];
      currentModel = d.current || models[0];
      modelSel.innerHTML = models.map(m => `<option value="${m}" ${m === currentModel ? "selected" : ""}>${m}</option>`).join("");
      $("title").textContent = "Ornith · " + currentModel;
    }).catch(() => {
      currentModel = "ornith:35b";
      modelSel.innerHTML = `<option>${currentModel}</option>`;
    });

    refreshStatus();
    setInterval(refreshStatus, 15000);

    function refreshStatus() {
      fetch("/api/status").then(r => r.json()).then(d => {
        if (d.status === "ok" && d.rows.length) {
          const row = d.rows.find(r => r.name.includes("ornith")) || d.rows[0];
          $("statusBox").innerHTML = `<b>${row.name}</b>\nSize: ${row.size}\nSplit: ${row.processor}`;
          $("metaPill").innerHTML = `<span class="pill">${row.processor}</span>`;
          $("statusDot").style.background = "var(--accent-2)";
          $("statusDot").style.boxShadow = "0 0 12px var(--accent-2)";
        } else {
          $("statusBox").textContent = "model not loaded";
          $("metaPill").innerHTML = `<span class="pill">idle</span>`;
          $("statusDot").style.background = "var(--muted)";
          $("statusDot").style.boxShadow = "none";
        }
      }).catch(() => { $("statusBox").textContent = "ollama offline"; });
    }

    function scrollToBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }

    function addMessage(role, text) {
      const wrap = document.createElement("div");
      wrap.className = "msg " + role;
      const roleEl = document.createElement("div");
      roleEl.className = "role";
      roleEl.textContent = role === "user" ? "You" : "Ornith";
      const body = document.createElement("div");
      body.className = "body";
      body.textContent = text;
      wrap.appendChild(roleEl);
      wrap.appendChild(body);
      messagesEl.appendChild(wrap);
      scrollToBottom();
      return body;
    }

    function setBusy(on) {
      sendBtn.disabled = on;
      stopBtn.disabled = !on;
      spinner.classList.toggle("on", on);
    }

    async function sendMessage(text) {
      conversation.push({ role: "user", content: text });
      addMessage("user", text);
      const bodyEl = addMessage("assistant", "");
      bodyEl.parentElement.classList.add("thinking");
      setBusy(true);

      const payload = {
        messages: conversation,
        model: modelSel.value,
        num_ctx: parseInt(numCtxSel.value, 10),
        keep_alive: keepAliveSel.value === "-1" ? -1 : keepAliveSel.value,
      };

      const t0 = performance.now();
      let full = "", tokens = 0, loadMs = 0, tps = 0;

      try {
        controller = new AbortController();
        const resp = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
          signal: controller.signal,
        });
        if (!resp.ok) {
          bodyEl.parentElement.classList.remove("thinking");
          bodyEl.parentElement.classList.add("error");
          bodyEl.textContent = "[server error " + resp.status + "]";
          return;
        }
        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buf = "";
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          let idx;
          while ((idx = buf.indexOf("\n\n")) >= 0) {
            const chunk = buf.slice(0, idx); buf = buf.slice(idx + 2);
            const line = chunk.split("\n").find(l => l.startsWith("data: "));
            if (!line) continue;
            const p = JSON.parse(line.slice(6));
            if (p.token) { full += p.token; bodyEl.textContent = full; scrollToBottom(); }
            else if (p.done) {
              loadMs = p.load_ms || 0; tokens = p.tokens || 0; tps = p.tps || 0;
              bodyEl.parentElement.classList.remove("thinking");
            } else if (p.error) {
              bodyEl.parentElement.classList.remove("thinking");
              bodyEl.parentElement.classList.add("error");
              bodyEl.textContent = full + "\n[error] " + p.error;
            }
          }
        }
        conversation.push({ role: "assistant", content: full });
      } catch (err) {
        if (err.name === "AbortError") {
          bodyEl.parentElement.classList.remove("thinking");
          bodyEl.textContent = full + "\n[stopped]";
          conversation.push({ role: "assistant", content: full });
        } else {
          bodyEl.parentElement.classList.remove("thinking");
          bodyEl.parentElement.classList.add("error");
          bodyEl.textContent = "[network error] " + err.message;
        }
      } finally {
        const secs = (performance.now() - t0) / 1000;
        $("stats").textContent = `load ${loadMs ? (loadMs/1000).toFixed(1) + "s" : "—"} · ${tokens} tok · ${tps || (tokens/secs).toFixed(1)} tok/s`;
        setBusy(false);
        controller = null;
        refreshStatus();
      }
    }

    sendBtn.addEventListener("click", () => {
      const text = inputEl.value.trim();
      if (!text) return;
      inputEl.value = "";
      sendMessage(text);
    });
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendBtn.click(); }
    });
    stopBtn.addEventListener("click", () => { if (controller) controller.abort(); });
    $("warmBtn").addEventListener("click", () => {
      $("warmBtn").disabled = true;
      fetch("/api/warm", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ model: modelSel.value }) })
        .finally(() => { $("warmBtn").disabled = false; refreshStatus(); });
    });

    inputEl.focus();
  </script>
</body>
</html>
