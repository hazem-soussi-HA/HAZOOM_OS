<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ornith — Offline Chatbox</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#0d1017; --card:#151b26; --line:#232c3d; --accent:#fbbf24; --text:#e2e8f0; --muted:#8b98ad; --bubble:#1c2433; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; height:100vh; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:12px; padding:16px 24px; border-bottom:1px solid var(--line); }
  header h1 { font-size:17px; letter-spacing:1px; }
  header .offline { margin-left:auto; font-size:11px; color:var(--accent); border:1px solid var(--line); padding:5px 12px; border-radius:20px; }
  #log { flex:1; overflow-y:auto; padding:24px; display:flex; flex-direction:column; gap:12px; max-width:860px; width:100%; margin:0 auto; }
  .msg { max-width:70%; padding:11px 16px; border-radius:14px; font-size:14px; line-height:1.55; }
  .bot { align-self:flex-start; background:var(--bubble); border:1px solid var(--line); border-bottom-left-radius:4px; }
  .user { align-self:flex-end; background:#26324a; border-bottom-right-radius:4px; }
  footer { border-top:1px solid var(--line); padding:16px 24px; display:flex; gap:10px; max-width:860px; width:100%; margin:0 auto; }
  #inp { flex:1; background:var(--card); border:1px solid var(--line); color:var(--text); padding:12px 16px; border-radius:10px; font-size:14px; outline:none; }
  #inp:focus { border-color:var(--accent); }
  #send { background:var(--accent); color:#111; border:none; padding:12px 22px; border-radius:10px; font-weight:600; cursor:pointer; }
  #send:disabled { opacity:.5; }
  .typing { color:var(--muted); font-size:12px; padding:4px 6px; }
</style>
</head>
<body>
<header><h1>🐦 ORNITH — OFFLINE CHAT</h1><span class="offline">100% OFFLINE</span></header>
<div id="log">
  <div class="msg bot">Hello! I am Ornith, the offline chat companion of HAZOOM OS. No internet, no API keys — just my embedded knowledge. Ask me about birds, planets, the dev farm, or the GitHub bridge.</div>
</div>
<footer>
  <input id="inp" placeholder="Type a message…" autocomplete="off">
  <button id="send">Send</button>
</footer>
<script>
  const log = document.getElementById('log'), inp = document.getElementById('inp'), btn = document.getElementById('send');
  function add(cls, text) {
    const d = document.createElement('div');
    d.className = 'msg ' + cls;
    d.textContent = text;
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
  }
  async function ask() {
    const m = inp.value.trim();
    if (!m) return;
    add('user', m);
    inp.value = '';
    btn.disabled = true;
    add('bot', '…');
    try {
      const r = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: m }) });
      const d = await r.json();
      log.querySelector('.msg.bot:last-child').textContent = d.reply;
    } catch (e) {
      log.querySelector('.msg.bot:last-child').textContent = 'Something went offline.';
    }
    btn.disabled = false;
  }
  btn.onclick = ask;
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') ask(); });
</script>
</body>
</html>
