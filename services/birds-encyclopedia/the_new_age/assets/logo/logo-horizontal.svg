    </g>
    <circle cx="0" cy="-30" r="5" fill="#ffcc33" stroke="#0b1020" stroke-width="1"/>
  </g>

  <!-- wordmark -->
  <g font-family="system-ui, Segoe UI, Roboto, sans-serif" text-anchor="start">
    <text x="250" y="92" font-size="40" font-weight="700" fill="#e8eefc">THE NEW AGE</text>
    <text x="250" y="140" font-size="40" font-weight="700" fill="#2a6cff">OF BIRDS</text>
    <text x="252" y="168" font-size="15" fill="#93a4c8" letter-spacing="2">3D ORNITHOLOGY ATLAS · OFFLINE · CONFIDENTIAL</text>
  </g>
