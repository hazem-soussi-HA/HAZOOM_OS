apiVersion: v1
kind: Namespace
metadata:
  name: hazoom-intelligence
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: intelligence-dashboard
  namespace: hazoom-intelligence
spec:
  replicas: 1
  selector:
    matchLabels:
      app: intelligence-dashboard
  template:
    metadata:
      labels:
        app: intelligence-dashboard
    spec:
      containers:
        - name: dashboard
          image: hazoom-intelligence:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 4999
          env:
            - name: OLLAMA_HOST
              value: "http://host.docker.internal:11434"
---
apiVersion: v1
kind: Service
metadata:
  name: intelligence-service
  namespace: hazoom-intelligence
spec:
  selector:
    app: intelligence-dashboard
  ports:
    - port: 80
      targetPort: 4999
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: intelligence-ingress
  namespace: hazoom-intelligence
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: intelligence.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: intelligence-service
                port:
                  number: 80
