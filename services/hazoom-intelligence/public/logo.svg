<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a12"/>
      <stop offset="100%" style="stop-color:#12121e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f0ff"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="400" rx="40" fill="url(#bg)"/>
  <g transform="translate(200,200)">
    <circle cx="0" cy="0" r="120" fill="none" stroke="rgba(0,240,255,0.08)" stroke-width="1"/>
    <circle cx="0" cy="0" r="90" fill="none" stroke="rgba(0,240,255,0.12)" stroke-width="0.5"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="rgba(139,92,246,0.15)" stroke-width="0.5" stroke-dasharray="4,4"/>
  </g>
  <g filter="url(#glow)">
    <polygon points="200,100 280,160 260,260 140,260 120,160" fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-linejoin="round" opacity="0.9"/>
    <polygon points="200,120 265,170 248,250 152,250 135,170" fill="none" stroke="url(#accent)" stroke-width="1.5" stroke-linejoin="round" opacity="0.6"/>
  </g>
  <circle cx="200" cy="200" r="30" fill="none" stroke="url(#gold)" stroke-width="2.5" filter="url(#glow)"/>
  <circle cx="200" cy="200" r="12" fill="url(#gold)" filter="url(#glow)"/>
  <g font-family="'Inter','Segoe UI',sans-serif" text-anchor="middle">
    <text x="200" y="320" font-size="22" font-weight="800" fill="url(#accent)" letter-spacing="3">HAZOOM</text>
    <text x="200" y="344" font-size="11" font-weight="500" fill="#8888aa" letter-spacing="4">INTELLIGENCE</text>
  </g>
  <g opacity="0.15">
    <text x="200" y="380" font-size="8" font-family="monospace" fill="#8888aa" text-anchor="middle" letter-spacing="1">v1.0.0</text>
  </g>
</svg>
