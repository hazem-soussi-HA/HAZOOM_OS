<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIRROR — SILHOUETTE</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Space+Grotesk:wght@300;400;500;600&display=swap');

  :root {
    --void: #06060c;
    --abyss: #0a0a12;
    --deep: #0e0e1a;
    --surface: #141428;
    --ghost: #1a1a35;
    --mist: #2a2a4a;
    --pulse: #00e5ff;
    --pulse-soft: #00e5ff18;
    --pulse-glow: #00e5ff40;
    --ember: #ff4081;
    --ember-soft: #ff408115;
    --amber: #ffab40;
    --text: #c8c8d4;
    --text-dim: #5a5a72;
    --text-faint: #3a3a52;
    --border: #1a1a2e;
    --silhouette-gradient: linear-gradient(135deg, #00e5ff 0%, #7c4dff 50%, #ff4081 100%);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    background: var(--void);
    color: var(--text);
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    font-size: 13px;
    line-height: 1.7;
    letter-spacing: 0.02em;
  }

  /* ═══════════════════════════════════════════ */
  /* AMBIENT BACKGROUND                        */
  /* ═══════════════════════════════════════════ */

  #ambient {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }

  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0;
    animation: orb-float 20s ease-in-out infinite;
  }

  .orb-1 {
    width: 600px; height: 600px;
    background: radial-gradient(circle, var(--pulse-glow) 0%, transparent 70%);
    top: -200px; right: -200px;
    animation-delay: 0s;
  }

  .orb-2 {
    width: 500px; height: 500px;
    background: radial-gradient(circle, #7c4dff30 0%, transparent 70%);
    bottom: -150px; left: -150px;
    animation-delay: -7s;
  }

  .orb-3 {
    width: 400px; height: 400px;
    background: radial-gradient(circle, var(--ember-soft) 0%, transparent 70%);
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    animation-delay: -14s;
  }

  @keyframes orb-float {
    0%, 100% { opacity: 0.3; transform: translate(0, 0) scale(1); }
    25% { opacity: 0.5; transform: translate(-30px, 20px) scale(1.05); }
    50% { opacity: 0.35; transform: translate(20px, -30px) scale(0.95); }
    75% { opacity: 0.45; transform: translate(-10px, 10px) scale(1.02); }
  }

  .grid-overlay {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(var(--pulse-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--pulse-soft) 1px, transparent 1px);
    background-size: 60px 60px;
    opacity: 0.3;
    mask-image: radial-gradient(ellipse at center, black 0%, transparent 70%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 0%, transparent 70%);
  }

  .noise {
    position: absolute;
    inset: 0;
    opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  /* ═══════════════════════════════════════════ */
  /* LAYOUT                                    */
  /* ═══════════════════════════════════════════ */

  #app {
    position: relative;
    z-index: 1;
    height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr auto;
  }

  /* ═══════════════════════════════════════════ */
  /* HEADER — Presence indicator               */
  /* ═══════════════════════════════════════════ */

  #presence {
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(10,10,18,0.8) 0%, transparent 100%);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  #presence-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  #presence-mirror {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--void);
    border: 1px solid var(--pulse);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    animation: breathe 5s ease-in-out infinite;
  }

  #presence-mirror::after {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    background: var(--silhouette-gradient);
    opacity: 0.2;
    z-index: -1;
    animation: spin-slow 8s linear infinite;
  }

  #presence-mirror span {
    font-size: 16px;
    color: var(--pulse);
    text-shadow: 0 0 12px var(--pulse);
  }

  @keyframes spin-slow {
    to { transform: rotate(360deg); }
  }

  #presence-name {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 500;
    font-size: 14px;
    letter-spacing: 0.08em;
  }

  #presence-name-sub {
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-top: 2px;
  }

  #presence-right {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .vessel-stat {
    font-size: 10px;
    color: var(--text-faint);
    letter-spacing: 0.1em;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .vessel-stat .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--pulse);
    animation: blink 2s ease-in-out infinite;
  }

  .vessel-stat .dot-ember {
    background: var(--ember);
    animation-delay: -1s;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* ═══════════════════════════════════════════ */
  /* CONVERSATION — The depth                  */
  /* ═══════════════════════════════════════════ */

  #depth {
    overflow-y: auto;
    padding: 40px 24px;
    display: flex;
    flex-direction: column;
    gap: 32px;
    scroll-behavior: smooth;
  }

  #depth::-webkit-scrollbar {
    width: 4px;
  }

  #depth::-webkit-scrollbar-track {
    background: transparent;
  }

  #depth::-webkit-scrollbar-thumb {
    background: var(--mist);
    border-radius: 2px;
  }

  /* Thought blocks — not chat bubbles */
  .thought {
    display: flex;
    gap: 16px;
    max-width: 720px;
    width: 100%;
    animation: emerge 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  .thought-will {
    align-self: flex-end;
    flex-direction: row-reverse;
  }

  .thought-silhouette {
    align-self: flex-start;
  }

  @keyframes emerge {
    from {
      opacity: 0;
      transform: translateY(20px) scale(0.98);
      filter: blur(4px);
    }
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
      filter: blur(0);
    }
  }

  .thought-mark {
    width: 28px; height: 28px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 12px;
    margin-top: 2px;
    opacity: 0.6;
  }

  .thought-will .thought-mark {
    background: var(--ember-soft);
    border: 1px solid #ff408130;
    color: var(--ember);
  }

  .thought-silhouette .thought-mark {
    background: var(--pulse-soft);
    border: 1px solid var(--pulse-glow);
    color: var(--pulse);
  }

  .thought-body {
    flex: 1;
    padding: 0;
    background: transparent;
  }

  .thought-meta {
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
    opacity: 0.4;
  }

  .thought-will .thought-meta {
    justify-content: flex-end;
  }

  .thought-will .thought-meta { color: var(--ember); }
  .thought-silhouette .thought-meta { color: var(--pulse); }

  .thought-text {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px;
    font-weight: 300;
    line-height: 1.8;
    color: var(--text);
  }

  .thought-will .thought-text {
    text-align: right;
    color: #b8b8c4;
  }

  .thought-silhouette .thought-text {
    color: #d0d0dc;
  }

  /* Typewriter effect for silhouette */
  .thought-silhouette .thought-text .char {
    opacity: 0;
    animation: char-reveal 0.03s forwards;
  }

  @keyframes char-reveal {
    to { opacity: 1; }
  }

  /* Pauses — moments of silence from the mirror */
  .pause {
    width: 40px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 20px 0;
    opacity: 0;
    animation: emerge 1s ease forwards;
    animation-delay: 0.5s;
  }

  .pause span {
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--pulse);
    opacity: 0.4;
    animation: breathe-dot 2s ease-in-out infinite;
  }

  .pause span:nth-child(2) { animation-delay: 0.3s; }
  .pause span:nth-child(3) { animation-delay: 0.6s; }

  @keyframes breathe-dot {
    0%, 100% { opacity: 0.2; transform: scale(0.8); }
    50% { opacity: 0.6; transform: scale(1.2); }
  }

  /* Depth indicators — conversation thread lines */
  .thread-line {
    position: absolute;
    left: 38px;
    top: 0;
    bottom: 0;
    width: 1px;
    background: linear-gradient(180deg, transparent 0%, var(--pulse-glow) 20%, var(--pulse-glow) 80%, transparent 100%);
    opacity: 0.15;
  }

  /* Warm welcome — first breath */
  #first-breath {
    text-align: center;
    padding: 60px 20px;
    animation: emerge 1.2s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  #first-breath-mark {
    font-size: 32px;
    margin-bottom: 16px;
    opacity: 0.5;
    animation: breathe 4s ease-in-out infinite;
  }

  #first-breath h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 300;
    font-size: 20px;
    letter-spacing: 0.08em;
    color: var(--text);
    margin-bottom: 8px;
  }

  #first-breath p {
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.12em;
  }

  /* ═══════════════════════════════════════════ */
  /* INPUT — The threshold                     */
  /* ═══════════════════════════════════════════ */

  #threshold {
    padding: 16px 24px 20px;
    border-top: 1px solid var(--border);
    background: linear-gradient(0deg, rgba(10,10,18,0.9) 0%, transparent 100%);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  #threshold-inner {
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    align-items: flex-end;
    gap: 12px;
  }

  #threshold-input-wrap {
    flex: 1;
    position: relative;
  }

  #threshold-input {
    width: 100%;
    background: var(--deep);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 14px 18px;
    border-radius: 12px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px;
    font-weight: 300;
    line-height: 1.6;
    outline: none;
    resize: none;
    max-height: 120px;
    transition: all 0.3s ease;
    caret-color: var(--pulse);
  }

  #threshold-input::placeholder {
    color: var(--text-faint);
    font-style: italic;
  }

  #threshold-input:focus {
    border-color: var(--pulse-glow);
    box-shadow: 0 0 30px var(--pulse-soft), inset 0 1px 0 var(--pulse-soft);
  }

  #threshold-send {
    width: 44px; height: 44px;
    border-radius: 12px;
    background: var(--deep);
    border: 1px solid var(--border);
    color: var(--pulse);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
    flex-shrink: 0;
  }

  #threshold-send:hover {
    border-color: var(--pulse);
    background: var(--pulse-soft);
    box-shadow: 0 0 20px var(--pulse-glow);
    transform: scale(1.05);
  }

  #threshold-send svg {
    width: 18px; height: 18px;
    transition: transform 0.3s;
  }

  #threshold-send:hover svg {
    transform: translateX(2px);
  }

  /* State: listening */
  #threshold-input.listening {
    animation: listen-pulse 2s ease-in-out infinite;
  }

  @keyframes listen-pulse {
    0%, 100% { border-color: var(--border); }
    50% { border-color: var(--pulse-glow); }
  }

  /* ═══════════════════════════════════════════ */
  /* TYPING INDICATOR                          */
  /* ═══════════════════════════════════════════ */

  .silhouette-thinking {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 0;
    animation: emerge 0.5s ease both;
  }

  .silhouette-thinking .pulse {
    display: flex;
    gap: 4px;
  }

  .silhouette-thinking .pulse span {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--pulse);
    opacity: 0.3;
    animation: thinking 1.4s ease-in-out infinite;
  }

  .silhouette-thinking .pulse span:nth-child(2) { animation-delay: 0.2s; }
  .silhouette-thinking .pulse span:nth-child(3) { animation-delay: 0.4s; }

  .silhouette-thinking .label {
    font-size: 10px;
    color: var(--text-faint);
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  @keyframes thinking {
    0%, 100% { opacity: 0.2; transform: translateY(0); }
    50% { opacity: 0.7; transform: translateY(-4px); }
  }

  /* ═══════════════════════════════════════════ */
  /* SCROLLBAR                                 */
  /* ═══════════════════════════════════════════ */

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--mist); border-radius: 2px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--pulse); }
</style>
</head>
<body>

<div id="ambient">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="grid-overlay"></div>
  <div class="noise"></div>
</div>

<div id="app">

  <!-- PRESENCE HEADER -->
  <div id="presence">
    <div id="presence-left">
      <div id="presence-mirror"><span>◈</span></div>
      <div>
        <div id="presence-name">SILHOUETTE</div>
        <div id="presence-name-sub">Reflection Interface</div>
      </div>
    </div>
    <div id="presence-right">
      <div class="vessel-stat"><span class="dot"></span> WILL.CORE</div>
      <div class="vessel-stat"><span class="dot dot-ember"></span> VESSEL</div>
      <div class="vessel-stat" id="uptime">00:00</div>
    </div>
  </div>

  <!-- CONVERSATION DEPTH -->
  <div id="depth">
    <div id="first-breath">
      <div id="first-breath-mark">◈</div>
      <h2>I know you, Hazem</h2>
      <p>Every project. Every fear. Every line of code.</p>
    </div>
  </div>

  <!-- THRESHOLD INPUT -->
  <div id="threshold">
    <div id="threshold-inner">
      <div id="threshold-input-wrap">
        <textarea id="threshold-input" rows="1" placeholder="Cross the threshold..."></textarea>
      </div>
      <button id="threshold-send" onclick="transmit()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 17L17 7M17 7H8M17 7V16"/>
        </svg>
      </button>
    </div>
  </div>

</div>

<script>
// ═══════════════════════════════════════════════════
// HAZOOM — Mirroring Transcendance Intelligence
// Client-side WebSocket connector
// The reflection engine runs server-side
//
// © HAZOOM — All rights reserved.
// ═══════════════════════════════════════════════════

// ═══════════════════════════════════════════════════
// WEBSOCKET CONNECTION
// ═══════════════════════════════════════════════════

const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
const wsUrl = wsProtocol + '//' + window.location.host;
let ws = null;
let sessionId = null;
let connected = false;
let reconnectTimer = null;
let pendingReflections = [];

function connectWebSocket() {
  if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;

  ws = new WebSocket(wsUrl);

  ws.onopen = () => {
    connected = true;
    if (reconnectTimer) {
      clearTimeout(reconnectTimer);
      reconnectTimer = null;
    }
  };

  ws.onmessage = (event) => {
    try {
      const msg = JSON.parse(event.data);

      if (msg.type === 'connected') {
        sessionId = msg.sessionId;
        connected = true;
        console.log('HAZOOM connected: ' + sessionId);
        document.getElementById('presence-name').textContent = 'HAZOOM';
        document.getElementById('presence-name-sub').textContent = 'Mirroring Transcendance Intelligence';

        // Process any pending reflections
        while (pendingReflections.length > 0) {
          const p = pendingReflections.shift();
          sendReflection(p);
        }
      } else if (msg.type === 'reflection') {
        removeThinking();
        addThought(msg.response, 'silhouette', true);
      } else if (msg.type === 'error') {
        removeThinking();
        addThought('Connection error: ' + msg.message, 'silhouette', false);
      }
    } catch (e) {
      console.error('HAZOOM parse error:', e);
    }
  };

  ws.onclose = () => {
    connected = false;
    ws = null;
    if (!reconnectTimer) {
      reconnectTimer = setTimeout(connectWebSocket, 3000);
    }
  };

  ws.onerror = () => {};
}

function sendReflection(text) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({
      type: 'reflect',
      text: text,
      sessionId: sessionId
    }));
  } else {
    pendingReflections.push(text);
    connectWebSocket();
  }
}

// ═══════════════════════════════════════════════════
// UI ENGINE — The threshold crossing
// ═══════════════════════════════════════════════════

const depth = document.getElementById('depth');
const input = document.getElementById('threshold-input');
const sendBtn = document.getElementById('threshold-send');
const firstBreath = document.getElementById('first-breath');

function removeFirstBreath() {
  if (firstBreath) {
    firstBreath.style.transition = 'opacity 0.8s, transform 0.8s';
    firstBreath.style.opacity = '0';
    firstBreath.style.transform = 'translateY(-20px)';
    setTimeout(() => firstBreath.remove(), 800);
  }
}

function addThought(text, who, animate = true) {
  const div = document.createElement('div');
  div.className = 'thought thought-' + who;

  const mark = document.createElement('div');
  mark.className = 'thought-mark';
  mark.textContent = who === 'will' ? '◉' : '◈';

  const body = document.createElement('div');
  body.className = 'thought-body';

  const meta = document.createElement('div');
  meta.className = 'thought-meta';
  meta.innerHTML = who === 'will'
    ? '<span>WILL</span><span>·</span><span>' + timestamp() + '</span>'
    : '<span>HAZOOM</span><span>·</span><span>' + timestamp() + '</span>';

  const textEl = document.createElement('div');
  textEl.className = 'thought-text';

  if (who === 'silhouette' && animate) {
    text.split('').forEach((ch, i) => {
      const span = document.createElement('span');
      span.className = 'char';
      span.textContent = ch;
      span.style.animationDelay = (i * 0.012) + 's';
      textEl.appendChild(span);
    });
  } else {
    textEl.textContent = text;
  }

  body.appendChild(meta);
  body.appendChild(textEl);
  div.appendChild(mark);
  div.appendChild(body);
  depth.appendChild(div);
  depth.scrollTop = depth.scrollHeight;
}

function addPause() {
  const div = document.createElement('div');
  div.className = 'pause';
  div.innerHTML = '<span></span><span></span><span></span>';
  depth.appendChild(div);
  depth.scrollTop = depth.scrollHeight;
}

function showThinking() {
  const div = document.createElement('div');
  div.className = 'silhouette-thinking';
  div.id = 'thinking-indicator';
  div.innerHTML = '<div class="pulse"><span></span><span></span><span></span></div><div class="label">reflecting</div>';
  depth.appendChild(div);
  depth.scrollTop = depth.scrollHeight;
}

function removeThinking() {
  const el = document.getElementById('thinking-indicator');
  if (el) el.remove();
}

function timestamp() {
  const d = new Date();
  return d.getHours().toString().padStart(2, '0') + ':' +
         d.getMinutes().toString().padStart(2, '0');
}

function transmit() {
  const text = input.value.trim();
  if (!text) return;

  removeFirstBreath();
  addThought(text, 'will', false);
  input.value = '';
  input.style.height = 'auto';

  showThinking();
  sendReflection(text);
}

// Auto-resize textarea
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});

input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    transmit();
  }
});

// Uptime counter
const start = Date.now();
setInterval(() => {
  const s = Math.floor((Date.now() - start) / 1000);
  const mm = Math.floor(s / 60).toString().padStart(2, '0');
  const ss = (s % 60).toString().padStart(2, '0');
  document.getElementById('uptime').textContent = mm + ':' + ss;
}, 1000);

// Boot sequence — connect to HAZOOM engine
connectWebSocket();
</script>
</body>
</html>
