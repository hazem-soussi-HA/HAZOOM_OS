```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive To-Do List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .task-input-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .task-input {
            width: calc(100% - 60px);
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .add-task-button {
            padding: 8px 12px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .task-list {
            list-style-type: decimal;
            padding-left: 20px;
        }
        .task-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }
        .task-text {
            flex-grow: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .delete-task-button {
            padding: 3px 7px;
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="task-input-container">
        <input type="text" id="new-task" class="task-input" placeholder="Add a new task...">
        <button id="add-task-btn" class="add-task-button">Add Task</button>
    </div>
    <ul id="task-list" class="task-list"></ul>

    <script>
        document.getElementById('add-task-btn').addEventListener('click', addTask);
        document.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                addTask();
            }
        });

        function addTask() {
            const input = document.getElementById('new-task');
            const taskText = input.value.trim();
            if (taskText) {
                const li = document.createElement('li');
                li.className = 'task-item';
                li.innerHTML = `
                    <input type="text" value="${taskText}" class="task-text" readonly>
                    <button class="delete-task-button">Delete</button>
                `;
                document.getElementById('task-list').appendChild(li);
                input.value = '';

                li.querySelector('.delete-task-button').addEventListener('click', function() {
                    li.remove();
                });

                li.querySelector('.task-text').addEventListener('dblclick', function() {
                    this.contentEditable = true;
                    this.focus();
                });

                li.querySelector('.task-text').addEventListener('focusout', function() {
                    if (this.value.trim()) {
                        this.setAttribute('readonly', 'readonly');
                    } else {
                        this.remove();
                    }
                });
            }
        }
    </script>
</body>
</html>
