apiVersion: v1
kind: ConfigMap
metadata:
  name: deepseek-knowledge-config
  namespace: deepseek-knowledge
  labels:
    app: deepseek-knowledge
    component: config
    environment: production
data:
  # Application configuration
  APP_NAME: "The History of the Internet"
  APP_VERSION: "1.0.0"
  DEBUG: "false"
  ALLOWED_ORIGINS: "https://history-of-internet.com,https://app.history-of-internet.com"
  
  # Database configuration
  DATABASE_URL: "postgresql://postgres:postgres@deepseek-knowledge-postgres:5432/deepseek_knowledge"
  
  # Redis configuration
  REDIS_URL: "redis://deepseek-knowledge-redis:6379/0"
  
  # Celery configuration
  CELERY_BROKER_URL: "redis://deepseek-knowledge-redis:6379/1"
  CELERY_RESULT_BACKEND: "redis://deepseek-knowledge-redis:6379/2"
  
  # Storage configuration
  VIDEO_STORAGE_PATH: "/app/storage/videos"
  TEMP_STORAGE_PATH: "/app/storage/temp"
  ASSETS_PATH: "/app/assets"
  
  # Video generation configuration
  MAX_VIDEO_DURATION_SECONDS: "300"
  
  # Logging configuration
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"
  
  # Security configuration
  RATE_LIMIT_PER_MINUTE: "60"
  MAX_CONCURRENT_JOBS: "5"
  
  # Monitoring configuration
  PROMETHEUS_METRICS_ENABLED: "true"
  PROMETHEUS_METRICS_PORT: "8001"