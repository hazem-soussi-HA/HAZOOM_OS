apiVersion: v1
kind: Service
metadata:
  name: deepseek-knowledge-api
  namespace: deepseek-knowledge
  labels:
    app: deepseek-knowledge
    component: api
    environment: production
spec:
  selector:
    app: deepseek-knowledge
    component: api
  ports:
  - name: http
    port: 8000
    targetPort: http
    protocol: TCP
  type: ClusterIP