[alembic]
# path to migration scripts
# script_location = %(here)s/migrations
script_location = migrations
# template used to generate migration files
template = flask
# timezone aware datetime
timezone = true
# encoding to use for strings in the migration file
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s.sql

[post_write_hooks]
# post-write hooks for additional processing
# commands = mycommand
# hooks = myhook

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt =