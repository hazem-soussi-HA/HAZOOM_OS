server {
    listen 80;
    server_name hazoom.local localhost hazoom.peaceful.world;
    root /usr/share/nginx/html/hazoom-os;
    index index.html;
    
    # Frontend routing (SPA)
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Server "HAZOOM-OS-v6";
    }

    # API Explorer
    location /api/ {
        try_files $uri $uri/ /api-explorer.html;
    }

    # OS v5 desktop (new v6 code)
    location /os-desktop/ {
        alias /usr/share/nginx/html/hazoom-os/os-v5.html;
    }

    # Static assets with caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "no-referrer";

    # Error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
}
