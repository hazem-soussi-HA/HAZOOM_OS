<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAZOOM OS — AI-Powered Workspace</title>
    <link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #050510;
            --bg-secondary: #0a0a1a;
            --glass: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-hover: rgba(255, 255, 255, 0.08);
            --accent: #00f0ff;
            --accent-glow: rgba(0, 240, 255, 0.3);
            --gold: #ffd700;
            --gold-glow: rgba(255, 215, 0, 0.3);
            --purple: #8b5cf6;
            --green: #10b981;
            --red: #ef4444;
            --text: #e8e8f0;
            --text-dim: rgba(232, 232, 240, 0.5);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            /* Mood-responsive variables — updated dynamically by consciousness core */
            --mood-hue: 180;
            --mood-sat: 80%;
            --mood-light: 50%;
            --mood-accent: hsl(var(--mood-hue), var(--mood-sat), var(--mood-light));
            --mood-glow: hsla(var(--mood-hue), var(--mood-sat), var(--mood-light), 0.3);
        }

        /* Mood themes — classes added dynamically */
        body.mood-calm { --mood-hue: 200; --mood-sat: 60%; --mood-light: 45%; }
        body.mood-focused { --mood-hue: 180; --mood-sat: 80%; --mood-light: 50%; }
        body.mood-creative { --mood-hue: 280; --mood-sat: 70%; --mood-light: 55%; }
        body.mood-energetic { --mood-hue: 45; --mood-sat: 90%; --mood-light: 55%; }
        body.mood-serious { --mood-hue: 0; --mood-sat: 0%; --mood-light: 80%; }
        body.mood-night { --mood-hue: 240; --mood-sat: 40%; --mood-light: 30%; }
        body.mood-golden { --mood-hue: 45; --mood-sat: 100%; --mood-light: 50%; }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg-primary);
            color: var(--text);
            overflow: hidden;
            height: 100vh;
            user-select: none;
        }

        /* === BOOT SCREEN === */
        #boot-screen {
            position: fixed;
            inset: 0;
            z-index: 10000;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease;
        }
        #boot-screen.fade-out { opacity: 0; pointer-events: none; }

        .boot-logo-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin-bottom: 32px;
        }
        .boot-logo-ring {
            position: absolute;
            inset: 0;
            border: 2px solid var(--accent);
            border-radius: 50%;
            animation: bootRing 2s ease-in-out infinite;
        }
        .boot-logo-ring:nth-child(2) {
            inset: 10px;
            border-color: var(--purple);
            animation-delay: 0.3s;
        }
        .boot-logo-ring:nth-child(3) {
            inset: 20px;
            border-color: var(--gold);
            animation-delay: 0.6s;
        }
        .boot-logo-core {
            position: absolute;
            inset: 30px;
            background: linear-gradient(135deg, var(--accent), var(--purple));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 800;
            color: white;
            animation: bootPulse 2s ease-in-out infinite;
        }
        @keyframes bootRing {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.08); opacity: 1; }
        }
        @keyframes bootPulse {
            0%, 100% { box-shadow: 0 0 20px var(--accent-glow); }
            50% { box-shadow: 0 0 40px var(--accent-glow), 0 0 60px rgba(139, 92, 246, 0.2); }
        }

        .boot-title {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 6px;
        }
        .boot-subtitle { color: var(--text-dim); font-size: 0.85rem; margin-top: 8px; letter-spacing: 2px; }
        .boot-creator { color: var(--accent); font-size: 0.7rem; margin-top: 4px; letter-spacing: 1px; }

        .boot-bar {
            width: 240px;
            height: 3px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            margin-top: 40px;
            overflow: hidden;
        }
        .boot-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent), var(--purple), var(--gold));
            border-radius: 2px;
            transition: width 0.4s ease;
        }
        .boot-message { color: var(--text-dim); font-size: 0.75rem; margin-top: 16px; font-family: 'JetBrains Mono', monospace; }

        /* === TOP BAR === */
        #topbar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 40px;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background: rgba(10, 10, 26, 0.5);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
        }

        .topbar-left { display: flex; align-items: center; gap: 16px; }
        .topbar-start {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
        }
        .topbar-start:hover { background: var(--glass-hover); border-color: var(--accent); }
        .topbar-logo {
            font-weight: 800;
            font-size: 0.85rem;
            background: linear-gradient(135deg, var(--accent), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }
        .topbar-status {
            font-size: 0.7rem;
            color: var(--green);
            font-family: 'JetBrains Mono', monospace;
            transition: color var(--transition);
        }
        .topbar-right { display: flex; align-items: center; gap: 16px; }
        .topbar-clock { font-size: 0.8rem; font-weight: 500; font-family: 'JetBrains Mono', monospace; }

        /* === DESKTOP === */
        #desktop {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(139, 92, 246, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(0, 240, 255, 0.04) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(255, 215, 0, 0.03) 0%, transparent 50%),
                var(--bg-primary);
        }

        #desktop-canvas {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        /* === DESKTOP ICONS === */
        #desktop-icons {
            position: absolute;
            top: 50px;
            left: 20px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .desktop-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 10px 8px;
            border-radius: 12px;
            cursor: pointer;
            width: 80px;
            transition: var(--transition);
        }
        .desktop-icon:hover { background: var(--glass-hover); }
        .desktop-icon-img {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
        }
        .desktop-icon-label {
            font-size: 0.65rem;
            color: var(--text);
            text-align: center;
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
        }

        /* === DOCK === */
        #dock {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            align-items: flex-end;
            gap: 8px;
            padding: 12px 20px;
            background: rgba(10, 10, 26, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .dock-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: var(--transition);
            padding: 8px;
            border-radius: 12px;
        }
        .dock-item:hover { background: var(--glass-hover); transform: translateY(-4px); }
        .dock-item.active { background: var(--glass-hover); }

        .dock-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            transition: var(--transition);
        }
        .dock-item:hover .dock-icon { border-color: var(--accent); box-shadow: 0 0 16px var(--accent-glow); }

        .dock-label {
            font-size: 0.65rem;
            color: var(--text-dim);
            white-space: nowrap;
            opacity: 0;
            transition: var(--transition);
        }
        .dock-item:hover .dock-label { opacity: 1; }

        .dock-indicator {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--accent);
            opacity: 0;
            transition: var(--transition);
        }
        .dock-item.active .dock-indicator { opacity: 1; }

        /* === WINDOWS === */
        #windows-container { position: absolute; inset: 0; z-index: 50; pointer-events: none; }

        .os-window {
            position: absolute;
            background: rgba(10, 10, 26, 0.9);
            backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            pointer-events: auto;
            transition: box-shadow var(--transition);
            min-width: 300px;
            min-height: 200px;
        }
        .os-window.focused { box-shadow: 0 16px 64px rgba(0, 240, 255, 0.15), 0 12px 48px rgba(0, 0, 0, 0.5); border-color: rgba(0, 240, 255, 0.2); }

        .window-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid var(--glass-border);
            cursor: move;
        }
        .window-title { font-size: 0.8rem; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .window-controls { display: flex; gap: 8px; }
        .window-btn {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            transition: var(--transition);
        }
        .window-btn.close { background: #ff5f57; }
        .window-btn.minimize { background: #ffbd2e; }
        .window-btn.maximize { background: #28c840; }
        .window-btn:hover { transform: scale(1.2); }

        .window-content {
            height: calc(100% - 45px);
            overflow: auto;
            padding: 16px;
        }

        /* === RESIZE HANDLES === */
        .window-resize-handle {
            position: absolute;
            z-index: 10;
        }
        .window-resize-n { top: -3px; left: 8px; right: 8px; height: 6px; cursor: n-resize; }
        .window-resize-s { bottom: -3px; left: 8px; right: 8px; height: 6px; cursor: s-resize; }
        .window-resize-e { right: -3px; top: 8px; bottom: 8px; width: 6px; cursor: e-resize; }
        .window-resize-w { left: -3px; top: 8px; bottom: 8px; width: 6px; cursor: w-resize; }
        .window-resize-nw { top: -3px; left: -3px; width: 10px; height: 10px; cursor: nw-resize; }
        .window-resize-ne { top: -3px; right: -3px; width: 10px; height: 10px; cursor: ne-resize; }
        .window-resize-sw { bottom: -3px; left: -3px; width: 10px; height: 10px; cursor: sw-resize; }
        .window-resize-se { bottom: -3px; right: -3px; width: 10px; height: 10px; cursor: se-resize; }

        /* === MATRIX SELECTION === */
        #matrix-selector {
            position: fixed;
            z-index: 9998;
            border: 1px dashed var(--accent);
            background: rgba(0, 240, 255, 0.06);
            pointer-events: none;
            display: none;
        }
        .desktop-icon.selected .desktop-icon-img {
            border-color: var(--accent) !important;
            background: rgba(0, 240, 255, 0.15);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.3);
        }
        .desktop-icon.selected .desktop-icon-label {
            color: var(--accent);
        }
        .os-window.selected {
            border-color: rgba(0, 240, 255, 0.4);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
        }
        .os-window.minimized {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.3);
            transition: opacity 0.25s ease, transform 0.25s ease;
        }
        .os-window.maximized {
            border-radius: 0;
        }

        /* === APP STYLES === */
        .app-dashboard { display: flex; flex-direction: column; gap: 16px; }
        .stat-card {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            padding: 16px;
        }
        .stat-label { font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
        .stat-value { font-size: 1.8rem; font-weight: 700; margin-top: 4px; }
        .stat-value.accent { color: var(--accent); }
        .stat-value.gold { color: var(--gold); }
        .stat-value.green { color: var(--green); }

        .app-terminal {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            line-height: 1.6;
            color: var(--green);
        }
        .terminal-line { margin-bottom: 4px; }
        .terminal-prompt { color: var(--accent); }
        .terminal-input {
            background: none;
            border: none;
            color: var(--text);
            font-family: inherit;
            font-size: inherit;
            outline: none;
            width: calc(100% - 120px);
        }

        .app-chat { display: flex; flex-direction: column; height: 100%; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
        .chat-msg { padding: 10px 14px; border-radius: 12px; max-width: 85%; line-height: 1.5; font-size: 0.85rem; }
        .chat-msg.user { background: rgba(0, 240, 255, 0.1); margin-left: auto; border-bottom-right-radius: 4px; }
        .chat-msg.ai { background: var(--glass); border-bottom-left-radius: 4px; }
        .chat-msg.system { background: rgba(255, 215, 0, 0.08); color: var(--gold); font-size: 0.75rem; margin: 0 auto; max-width: 90%; text-align: center; }
        .chat-input-bar { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--glass-border); }
        .chat-input-bar input {
            flex: 1;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            padding: 10px 14px;
            color: var(--text);
            font-size: 0.85rem;
            outline: none;
        }
        .chat-input-bar input:focus { border-color: var(--accent); }
        .chat-input-bar button {
            padding: 10px 20px;
            background: linear-gradient(135deg, var(--accent), var(--purple));
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }
        .chat-input-bar button:hover { opacity: 0.9; transform: scale(1.02); }

        .app-filemanager { display: flex; flex-direction: column; gap: 8px; }
        .file-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
        }
        .file-item:hover { background: var(--glass-hover); border-color: var(--accent); }
        .file-icon { font-size: 20px; }
        .file-name { font-size: 0.85rem; font-weight: 500; }
        .file-meta { font-size: 0.7rem; color: var(--text-dim); }

        .app-browser { display: flex; flex-direction: column; height: 100%; }
        .browser-bar { display: flex; gap: 8px; padding: 8px; border-bottom: 1px solid var(--glass-border); }
        .browser-bar input {
            flex: 1;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 8px 12px;
            color: var(--text);
            font-size: 0.8rem;
            outline: none;
        }
        .browser-bar input:focus { border-color: var(--accent); }
        .browser-bar button {
            padding: 8px 16px;
            background: var(--accent);
            border: none;
            border-radius: 8px;
            color: var(--bg-primary);
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
        }
        .browser-frame { flex: 1; border: none; background: white; border-radius: 0 0 var(--radius) var(--radius); }

        .app-settings { display: flex; flex-direction: column; gap: 12px; }
        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
        }
        .setting-label { font-size: 0.85rem; }
        .setting-value { font-size: 0.8rem; color: var(--text-dim); }

        .app-music { padding: 8px; }
        .music-header { font-size: 1.1rem; font-weight: 700; margin-bottom: 4px; }
        .music-sub { font-size: 0.75rem; color: var(--text-dim); margin-bottom: 16px; }
        .playlist-card {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            padding: 12px;
            cursor: pointer;
            transition: var(--transition);
            margin-bottom: 10px;
        }
        .playlist-card:hover { background: var(--glass-hover); border-color: var(--accent); }
        .track-item {
            padding: 8px 10px;
            background: rgba(255,255,255,0.03);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }
        .track-item:hover { background: var(--glass-hover); }
        .track-item.active { background: rgba(0, 240, 255, 0.1); }

        /* === CONTEXT MENU === */
        #context-menu {
            position: fixed;
            z-index: 10000;
            background: rgba(10, 10, 26, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            padding: 6px;
            min-width: 200px;
            display: none;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }
        #context-menu.show { display: block; animation: ctxFadeIn 0.15s ease; }
        @keyframes ctxFadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        .ctx-header {
            padding: 8px 12px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--accent);
            letter-spacing: 0.5px;
        }
        .ctx-separator { height: 1px; background: var(--glass-border); margin: 4px 8px; }
        .ctx-item {
            padding: 8px 12px;
            font-size: 0.8rem;
            cursor: pointer;
            border-radius: 6px;
            transition: var(--transition);
            color: var(--text);
        }
        .ctx-item:hover { background: var(--glass-hover); }
        .ctx-item.destructive { color: #ff5f57; }
        .ctx-item.destructive:hover { background: rgba(255, 95, 87, 0.15); }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

        /* === START MENU === */
        #start-menu {
            position: fixed;
            bottom: 90px;
            left: 20px;
            width: 380px;
            max-height: 520px;
            background: rgba(10, 10, 26, 0.95);
            backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            box-shadow: 0 16px 64px rgba(0, 0, 0, 0.6);
            z-index: 9999;
            display: none;
            flex-direction: column;
            overflow: hidden;
        }
        #start-menu.show { display: flex; animation: startMenuIn 0.2s ease; }
        @keyframes startMenuIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .start-menu-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 20px;
            border-bottom: 1px solid var(--glass-border);
        }
        .start-menu-logo {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--accent), var(--purple));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 800;
            color: white;
        }
        .start-menu-title { font-size: 1rem; font-weight: 700; letter-spacing: 1px; }

        .start-menu-search { padding: 12px 16px; }
        .start-menu-search input {
            width: 100%;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            padding: 10px 14px;
            color: var(--text);
            font-size: 0.85rem;
            outline: none;
        }
        .start-menu-search input:focus { border-color: var(--accent); }

        .start-menu-categories {
            display: flex;
            gap: 6px;
            padding: 0 16px 12px;
            overflow-x: auto;
        }
        .start-menu-category {
            padding: 6px 12px;
            background: var(--glass);
            border: 1px solid var(--glass-border);

        .start-menu-category:hover, .start-menu-category.active { background: var(--glass-hover); border-color: var(--accent); }

        .start-menu-apps {

        .start-app-icon {

            padding: 6px 12px;

        }
        .start-menu-power:hover { background: var(--glass-hover); }
.topbar-separator { opacity: 0.3; margin: 0 4px; }
        .topbar-actions { display: flex; align-items: center; gap: 4px; margin-left: 8px; }
        .topbar-action-btn {
            background: none; border: 1px solid var(--glass-border);

        }
        .topbar-action-btn:hover { background: var(--red); color: white; border-color: var(--red); }

        .dock-minimized { opacity: 0.6; }
        .dock-minimized .dock-indicator { background: var(--text-dim) !important; }
        /* ===== RESPONSIVE DESIGN ===== */
        @media (max-width: 1200px) {
            .dock-item { min-width: 44px; padding: 6px 8px; }
            .dock-label { font-size: 0.55rem; }
            .desktop-icon { width: 70px; padding: 8px 6px; }
            .desktop-icon-img { width: 40px; height: 40px; font-size: 20px; }
            #desktop-icons { left: 12px; top: 40px; gap: 4px; }
            .topbar { padding: 6px 12px; }
            .topbar-status { font-size: 0.6rem; }
        }
        @media (max-width: 900px) {
            .desktop-icon { width: 60px; padding: 6px 4px; }
            .desktop-icon-img { width: 36px; height: 36px; font-size: 18px; }
            .desktop-icon-label { font-size: 0.55rem; }
            #desktop-icons { left: 8px; }
            .dock-item { min-width: 36px; padding: 4px 6px; }
            .dock-icon { font-size: 18px; }
            .dock-label { display: none; }
            .topbar-logo { display: none; }

        }
        @media (max-width: 600px) {
            #desktop-icons { flex-direction: row; flex-wrap: wrap; top: 36px; left: 4px; right: 4px; justify-content: center; }
            .desktop-icon { width: 52px; padding: 4px 2px; }
            .desktop-icon-img { width: 32px; height: 32px; font-size: 16px; }
            .desktop-icon-label { font-size: 0.5rem; max-width: 50px; overflow: hidden; text-overflow: ellipsis; }
            .dock { padding: 2px; gap: 1px; }
            .dock-item { min-width: 32px; padding: 3px 4px; }
            .dock-icon { font-size: 16px; }
            #topbar { padding: 4px 8px; }
            .topbar-clock { display: none; }
            .start-menu { width: 90vw; height: 70vh; }

            .window-header { padding: 6px 10px; }
            .window-title { font-size: 0.7rem; }
        }
        @media (min-width: 1600px) {

            .dock-item { min-width: 60px; }
            .start-menu { width: 480px; }
            .start-menu-apps { grid-template-columns: repeat(4, 1fr); }
        }

        /* ===== DRAG & DROP ICONS ===== */
        .desktop-icon {
            position: relative;
            transition: transform 0.15s, box-shadow 0.15s, background 0.2s;
        }
        .desktop-icon:hover {
            transform: translateY(-2px);
        }
        .desktop-icon.dragging {
            opacity: 0.7;
            transform: scale(1.1) rotate(2deg);
            box-shadow: 0 8px 30px rgba(0,240,255,0.2);
            z-index: 100;
            cursor: grabbing;
        }
        .desktop-icon.drag-over {
            background: rgba(0,240,255,0.15);
            border: 1px dashed rgba(0,240,255,0.5);
        }

        /* Drop indicator grid on desktop */
        #desktop-icons {
            transition: background 0.3s;
        }
        #desktop-icons.drag-active {
            background: radial-gradient(circle at var(--drop-x, 50%) var(--drop-y, 50%), rgba(0,240,255,0.08) 0%, transparent 40%);
        }

        /* Drop zone indicator */
        .drop-indicator {
            position: absolute;
            width: 84px;
            height: 88px;
            border: 2px dashed var(--mood-accent);
            border-radius: 12px;
            pointer-events: none;
            z-index: 99;
            animation: dropPulse 1s ease-in-out infinite;
        }
        @keyframes dropPulse { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }

        /* ===== CONTEXT MENU APP-AWARE ===== */
        .ctx-app-info {
            padding: 10px 12px;
            border-bottom: 1px solid var(--glass-border);
            margin-bottom: 4px;
        }
        .ctx-app-name { font-size: 0.8rem; font-weight: 600; color: var(--mood-accent); }
        .ctx-app-type { font-size: 0.6rem; color: var(--text-dim); margin-top: 2px; }
        .ctx-app-stats { font-size: 0.6rem; color: var(--text-dim); margin-top: 4px; display: flex; gap: 12px; }
        .ctx-app-actions { padding: 4px; }
        .ctx-badge { font-size: 0.55rem; padding: 1px 5px; border-radius: 3px; margin-left: 4px; }
        .ctx-badge-security { background: rgba(239,68,68,0.2); color: #ef4444; }
        .ctx-badge-ai { background: rgba(139,92,246,0.2); color: #8b5cf6; }
        .ctx-badge-network { background: rgba(6,182,212,0.2); color: #06b6d4; }
        .ctx-badge-system { background: rgba(255,215,0,0.2); color: #ffd700; }

        /* ===== MOOD-AWARE DYNAMIC DESIGN ===== */
        .mood-transition { transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
        
        body #desktop { transition: background 1.5s ease; }
        body.mood-calm #desktop { background: radial-gradient(ellipse at 30% 40%, rgba(100,180,220,0.08) 0%, transparent 50%), radial-gradient(ellipse at 70% 60%, rgba(100,200,180,0.06) 0%, transparent 50%), var(--bg-primary); }
        body.mood-focused #desktop { background: radial-gradient(ellipse at 50% 50%, rgba(0,240,255,0.08) 0%, transparent 50%), var(--bg-primary); }
        body.mood-creative #desktop { background: radial-gradient(ellipse at 20% 30%, rgba(180,100,255,0.1) 0%, transparent 50%), radial-gradient(ellipse at 80% 70%, rgba(255,100,200,0.06) 0%, transparent 50%), var(--bg-primary); }
        body.mood-energetic #desktop { background: radial-gradient(ellipse at 30% 70%, rgba(255,180,0,0.1) 0%, transparent 50%), radial-gradient(ellipse at 70% 30%, rgba(255,100,50,0.06) 0%, transparent 50%), var(--bg-primary); }
        body.mood-serious #desktop { background: var(--bg-primary); }
        body.mood-night #desktop { background: radial-gradient(ellipse at 50% 20%, rgba(60,60,120,0.1) 0%, transparent 60%), #020208; }
        body.mood-golden #desktop { background: radial-gradient(ellipse at 40% 40%, rgba(255,215,0,0.1) 0%, transparent 50%), radial-gradient(ellipse at 60% 60%, rgba(255,180,0,0.06) 0%, transparent 50%), var(--bg-primary); }

        /* Mood-aware boot screen */
        body.mood-creative .boot-logo-core { background: linear-gradient(135deg, #a85cf6, #ec4899); }
        body.mood-golden .boot-logo-core { background: linear-gradient(135deg, #ffd700, #f59e0b); }
        body.mood-night .boot-logo-core { background: linear-gradient(135deg, #4338ca, #6366f1); }

        /* Mood-aware dock */
        .dock-item:hover .dock-icon { filter: drop-shadow(0 0 6px var(--mood-glow)); }

        /* Mood-aware windows */
        .os-window { border-color: var(--glass-border); transition: border-color 0.5s, box-shadow 0.5s; }
        .os-window:focus-within { border-color: var(--mood-accent); box-shadow: 0 0 30px var(--mood-glow); }

        /* Mood-aware topbar */
        .topbar { border-bottom-color: rgba(255,255,255,0.06); transition: border-color 0.5s, background 0.5s; }
        body.mood-golden .topbar { border-bottom-color: rgba(255,215,0,0.15); background: rgba(10,8,0,0.95); }
        body.mood-night .topbar { background: rgba(2,2,8,0.98); }
        body.mood-creative .topbar { border-bottom-color: rgba(168,85,246,0.15); }

        /* Context menu mood adaptation */
        #context-menu { border-color: var(--glass-border); transition: border-color 0.5s; }
        body.mood-focused #context-menu { border-color: rgba(0,240,255,0.2); }
        body.mood-creative #context-menu { border-color: rgba(168,85,246,0.2); }
        body.mood-golden #context-menu { border-color: rgba(255,215,0,0.15); }

        /* Start menu mood */
        .start-menu { border-color: var(--glass-border); transition: border-color 0.5s; }
        body.mood-golden .start-menu { border-color: rgba(255,215,0,0.15); }
        body.mood-creative .start-menu { border-color: rgba(168,85,246,0.2); }

        /* Responsive start menu */
        @media (max-width: 600px) {
            .start-menu { position: fixed; inset: 36px 4px 56px 4px; width: auto; height: auto; border-radius: 12px; }
            .start-menu-apps { max-height: 50vh; }
            .window { border-radius: 8px !important; }
        }
        @media (max-width: 400px) {
            .desktop-icon { width: 48px; }
            .desktop-icon-img { width: 28px; height: 28px; font-size: 14px; }
            .start-menu-apps { grid-template-columns: repeat(2, 1fr); }
        }

        /* Touch-friendly for mobile */
        @media (pointer: coarse) {
            .desktop-icon { padding: 12px 8px; min-height: 48px; }
            .ctx-item { padding: 12px 16px; min-height: 44px; }
            .dock-item { min-width: 48px; min-height: 48px; }
            .window-btn { min-width: 32px; min-height: 32px; }
        }

        @keyframes notifIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
        #notification-container { position: fixed; top: 50px; right: 20px; z-index: 99999; display: flex; flex-direction: column; gap: 8px; }

        /* === INNOVATIVE PATTERNS FROM ALPHA PONY === */

        /* Toast Notifications */
        .toast {
            background: rgba(10, 10, 26, 0.95);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 14px 20px;
            min-width: 280px;
            max-width: 400px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4), 0 0 15px rgba(0,240,255,0.1);
            animation: toastIn 0.3s ease, toastOut 0.3s ease 2.7s forwards;
            backdrop-filter: blur(10px);
            cursor: pointer;
        }
        .toast:hover { border-color: var(--accent); }
        .toast-icon { font-size: 1.3rem; flex-shrink: 0; }
        .toast-content { flex: 1; }
        .toast-title { font-weight: 700; font-size: 0.85rem; color: var(--text); margin-bottom: 2px; }
        .toast-msg { font-size: 0.75rem; color: var(--text-dim); }
        .toast-close { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 1rem; padding: 0 4px; }
        .toast-close:hover { color: var(--text); }
        @keyframes toastIn { from { opacity: 0; transform: translateX(100px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes toastOut { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(100px); } }

        /* Scroll Reveal */
        .reveal { opacity: 0; transform: translateY(30px); transition: opacity 0.6s ease, transform 0.6s ease; }
        .reveal.visible { opacity: 1; transform: translateY(0); }
        .reveal-delay-1 { transition-delay: 0.1s; }
        .reveal-delay-2 { transition-delay: 0.2s; }
        .reveal-delay-3 { transition-delay: 0.3s; }

        /* 3D Tilt Card */
        .tilt-card {
            perspective: 1000px;
            transform-style: preserve-3d;
        }
        .tilt-card:hover .tilt-inner {
            transform: rotateY(var(--tilt-x, 0deg)) rotateX(var(--tilt-y, 0deg)) translateZ(10px);
        }
        .tilt-inner {
            transition: transform 0.15s ease;
            transform-style: preserve-3d;
        }

        /* Conic Gradient Ring Chart */
        .ring-chart {
            width: 80px; height: 80px;
            border-radius: 50%;
            background: conic-gradient(var(--accent) calc(var(--score) * 1%), rgba(255,255,255,0.05) 0);
            display: flex; align-items: center; justify-content: center;
            position: relative;
        }
        .ring-chart::before {
            content: '';
            position: absolute;
            width: 60px; height: 60px;
            background: var(--bg-secondary);
            border-radius: 50%;
        }
        .ring-chart-value {
            position: relative;
            z-index: 1;
            font-weight: 800;
            font-size: 0.9rem;
            color: var(--accent);
        }

        /* Status Indicator Dot */
        .status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }
        .status-dot.green { background: #10b981; box-shadow: 0 0 6px rgba(16,185,129,0.5); }
        .status-dot.amber { background: #f59e0b; box-shadow: 0 0 6px rgba(245,158,11,0.5); }
        .status-dot.red { background: #ef4444; box-shadow: 0 0 6px rgba(239,68,68,0.5); }
        .status-dot.blue { background: #3b82f6; box-shadow: 0 0 6px rgba(59,130,246,0.5); }
        .status-dot.pulse { animation: dotPulse 2s ease-in-out infinite; }
        @keyframes dotPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        /* Neural Pathway Flow */
        .neural-path {
            stroke-dasharray: 8 4;
            animation: neuralFlow 2s linear infinite;
        }
        @keyframes neuralFlow { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -24; } }

        /* CRT Scanline Effect (for retro terminal mode) */
        .crt-scanlines::after {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 0, 0, 0.15) 2px,
                rgba(0, 0, 0, 0.15) 4px
            );
            pointer-events: none;
            z-index: 10;
        }

        /* Theme Mode Toggle */
        body.theme-warm { --accent: #ff6b35; --accent-glow: rgba(255,107,53,0.3); }
        body.theme-purple { --accent: #a855f7; --accent-glow: rgba(168,85,247,0.3); }
        body.theme-gold { --accent: #ffd700; --accent-glow: rgba(255,215,0,0.3); }
        body.theme-cyan { --accent: #00f0ff; --accent-glow: rgba(0,240,255,0.3); }
    </style>
</head>
<body>

    <!-- Boot Screen -->
    <div id="boot-screen">
        <div class="boot-logo-container">
            <div class="boot-logo-ring"></div>
            <div class="boot-logo-ring"></div>
            <div class="boot-logo-ring"></div>
            <div class="boot-logo-core">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="width:42px;height:42px;">
                    <defs>
                        <linearGradient id="bootLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#00f0ff"/>
                            <stop offset="50%" style="stop-color:#8b5cf6"/>
                            <stop offset="100%" style="stop-color:#ffd700"/>
                        </linearGradient>
                        <filter id="bootGlow">
                            <feGaussianBlur stdDeviation="2" result="blur"/>
                            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
                        </filter>
                    </defs>
                    <polygon points="50,8 85,30 85,70 50,92 15,70 15,30" fill="none" stroke="url(#bootLogoGrad)" stroke-width="2" opacity="0.6"/>
                    <polygon points="50,18 75,34 75,66 50,82 25,66 25,34" fill="none" stroke="url(#bootLogoGrad)" stroke-width="1.5" opacity="0.4"/>
                    <text x="50" y="60" text-anchor="middle" font-size="36" font-weight="900" font-family="JetBrains Mono,monospace" fill="url(#bootLogoGrad)" filter="url(#bootGlow)">H</text>
                </svg>
            </div>
        </div>
        <div class="boot-title">HAZOOM OS</div>
        <div class="boot-subtitle">AI-Powered Workspace</div>
        <div class="boot-creator">by Hazem Soussi</div>
        <div class="boot-bar"><div class="boot-bar-fill" id="boot-bar-fill"></div></div>
        <div class="boot-message" id="boot-message">Initializing kernel...</div>
        <div class="boot-readme-link" style="margin-top:28px;">
            <a href="landing.html" style="color:rgba(232,232,240,0.3);font-size:0.7rem;text-decoration:none;letter-spacing:1px;transition:color 0.3s;" onmouseover="this.style.color='#00f0ff'" onmouseout="this.style.color='rgba(232,232,240,0.3)'">README &nbsp;→</a>
        </div>
    </div>

    <!-- Top Bar -->
    <div id="topbar">
        <div class="topbar-left">
            <div class="topbar-start" onclick="HAZOOM.toggleStartMenu()">H</div>
            <span class="topbar-logo">HAZOOM</span>
            <span class="topbar-status" id="topbar-status">● Online</span>
            <span class="topbar-status" id="pascal-kernel-status">🧠 -/4</span>
            <span class="topbar-status topbar-separator">|</span>
            <span class="topbar-status" id="tray-cpu">⚡ 12%</span>
            <span class="topbar-status" id="tray-mem">💾 450MB</span>
            <span class="topbar-status" id="tray-windows">📱 0</span>
        </div>
        <div class="topbar-right">
            <span class="topbar-status" id="tray-uptime">⏱ 0s</span>
            <span class="topbar-clock" id="topbar-clock"></span>
            <div class="topbar-actions">
                <button class="topbar-action-btn" onclick="HAZOOM.restart()" title="Restart OS">⏻</button>
            </div>
        </div>
    </div>

    <!-- Desktop -->
    <div id="desktop">
        <canvas id="desktop-canvas"></canvas>
        <div id="desktop-icons"></div>
        <div id="windows-container"></div>
        <div id="matrix-selector"></div>
    </div>

    <!-- Dock -->
    <div id="dock"></div>

    <!-- Context Menu -->
    <div id="context-menu"></div>

    <!-- Start Menu -->
    <div id="start-menu">
        <div class="start-menu-header">
            <span class="start-menu-logo">H</span>
            <span class="start-menu-title">HAZOOM OS</span>
        </div>
        <div class="start-menu-search">
            <input type="text" id="start-search" placeholder="Search apps..." oninput="HAZOOM.filterStartMenu(this.value)">
        </div>
        <div class="start-menu-categories">
            <div class="start-menu-category" onclick="HAZOOM.filterStartMenuCategory('all')">All</div>
            <div class="start-menu-category" onclick="HAZOOM.filterStartMenuCategory('core')">Core</div>
            <div class="start-menu-category" onclick="HAZOOM.filterStartMenuCategory('ai')">AI</div>
            <div class="start-menu-category" onclick="HAZOOM.filterStartMenuCategory('tools')">Tools</div>
            <div class="start-menu-category" onclick="HAZOOM.filterStartMenuCategory('games')">Games</div>
            <div class="start-menu-category" onclick="HAZOOM.filterStartMenuCategory('visualizers')">Visualizers</div>
        </div>
        <div class="start-menu-apps" id="start-menu-apps"></div>
        <div class="start-menu-footer">
            <span class="start-menu-version">v3.1.0</span>
            <span class="start-menu-power" onclick="location.reload()">Restart</span>
        </div>
    </div>

    <script src="core/app_registry.js"></script>
    <script src="core/privacy_browser.js"></script>
    <script src="core/consciousness.js"></script>
    <script src="core/app_launcher.js"></script>
    <script src="core/os-filesystem.js"></script>
    <!-- Alpha Pony Integrated Engines -->
    <script src="core/ai_orchestrator.js"></script>
    <script src="core/deep_think_engine.js"></script>
    <script src="core/system_monitor.js"></script>
    <script src="core/os-desktop.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            HAZOOM.boot();
            if (typeof HAZOOMConsciousness !== 'undefined') {
                HAZOOMConsciousness.start();
                HAZOOM.consciousness = HAZOOMConsciousness;
            }
        });
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'f') { e.preventDefault(); HAZOOM.openApp('ai'); }
            if (e.ctrlKey && e.key === 'q') { e.preventDefault(); if (HAZOOM.focusedWindow) HAZOOM.closeWindow(HAZOOM.focusedWindow); }
            if (e.ctrlKey && e.key === 'm') { e.preventDefault(); if (HAZOOM.focusedWindow) HAZOOM.minimizeWindow(HAZOOM.focusedWindow); }
            if (e.key === 'F11') { e.preventDefault(); HAZOOM.toggleFullscreen(); }
            if (e.key === 'Meta' || (e.ctrlKey && e.key === ' ')) { e.preventDefault(); HAZOOM.toggleStartMenu(); }
            // Shutdown: Ctrl+Alt+Shift+Q
            if (e.ctrlKey && e.altKey && e.shiftKey && e.key === 'Q') { e.preventDefault(); HAZOOM.shutdown(); }
            // Logout: Ctrl+Alt+Shift+L
            if (e.ctrlKey && e.altKey && e.shiftKey && e.key === 'L') { e.preventDefault(); HAZOOM.logout(); }
        });
        document.addEventListener('click', (e) => {
            const startMenu = document.getElementById('start-menu');
            const startBtn = document.querySelector('.topbar-start');
            if (startMenu && startMenu.classList.contains('show') && !startMenu.contains(e.target) && e.target !== startBtn && !startBtn?.contains(e.target)) {
                startMenu.classList.remove('show');
            }
        });
    </script>
