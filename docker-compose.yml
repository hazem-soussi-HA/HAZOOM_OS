version: "3.9"

name: hazoom-ecosystem

services:
  # ─── Main Backend Server ─────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: hazoom-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "3443:3443"
    volumes:
      - hazoom_data:/app/data
      - hazoom_config:/app/config
      - ./ssl:/app/ssl:ro
    environment:
      - NODE_ENV=production
      - HTTP_PORT=3000
      - HTTPS_PORT=3443
      - HOST=0.0.0.0
      - LOG_LEVEL=info
      - QLEARNING_ENABLED=true
      - QLEARNING_MODE=hybrid
      - SESSION_SECRET=${SESSION_SECRET:-}
      - JWT_SECRET=${JWT_SECRET:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - USER_PASSWORD=${USER_PASSWORD:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - hazoom-net

  # ─── AI Services ─────────────────────────────────────────────────
  ai-service:
    build:
      context: ./services/ai
      dockerfile: Dockerfile
    container_name: hazoom-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - hazoom_data:/app/data
      - ./config:/app/config:ro
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - backend
    networks:
      - hazoom-net

  # ─── API Gateway ─────────────────────────────────────────────────
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: hazoom-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - hazoom_data:/app/data
      - ./ssl:/app/ssl:ro
    environment:
      - SERVER_PORT=8080
      - SECURE_PORT=8443
      - BACKEND_URL=http://backend:3000
      - PYTHONUNBUFFERED=1
    depends_on:
      - backend
      - ai-service
    networks:
      - hazoom-net

  # ─── Orchestrator ────────────────────────────────────────────────
  orchestrator:
    build:
      context: ./services/orchestrator
      dockerfile: Dockerfile
    container_name: hazoom-orchestrator
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - hazoom_data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - backend
      - ai-service
    networks:
      - hazoom-net

  # ─── WebSocket Server ────────────────────────────────────────────
  websocket:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile.ws
    container_name: hazoom-websocket
    restart: unless-stopped
    ports:
      - "9090:9090"
    environment:
      - WS_PORT=9090
      - EVENT_BUS_URL=http://orchestrator:9000
    depends_on:
      - orchestrator
    networks:
      - hazoom-net

  # ─── Frontend (Static Nginx) ────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: hazoom-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
      - ./deploy/nginx_frontend.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - BACKEND_URL=http://backend:3000
      - WS_URL=ws://websocket:9090
    depends_on:
      - backend
      - websocket
    networks:
      - hazoom-net

  # ─── Planet Earth ────────────────────────────────────────────────
  planet-earth:
    image: python:3.12-alpine
    profiles: ["optional"]
    working_dir: /app
    container_name: hazoom-planet-earth
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      - PORT=8080
      - BIND=0.0.0.0
    volumes:
      - ./services/planet-earth:/app
    command: python3 server.py
    networks:
      - hazoom-net



  # ─── Birds Encyclopedia ──────────────────────────────────────────
  birds-encyclopedia:
    build:
      context: ./services/birds-encyclopedia
      dockerfile: Dockerfile
    container_name: hazoom-birds
    restart: unless-stopped
    ports:
      - "4100:4100"
    volumes:
      - ./services/birds-encyclopedia:/app
    command: node server/server.js
    networks:
      - hazoom-net

  # ─── Hazoom POD (Print-on-Demand) ────────────────────────────────
  hazoom-pod:
    image: node:20-alpine
    profiles: ["optional"]
    working_dir: /app
    container_name: hazoom-pod
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - ./services/hazoom-pod:/app
    command: sh -c "npm install --omit=dev && node server/server.js"
    networks:
      - hazoom-net

  # ─── Ornith Chat (ChatDev) ───────────────────────────────────────
  chatdev-ornith:
    build:
      context: ./services/chatdev-ornith
    container_name: hazoom-chatdev
    restart: unless-stopped
    ports:
      - "5055:5055"
    environment:
      - BIND=0.0.0.0
    volumes:
      - ./services/chatdev-ornith:/app
    command: python3 ornith_server.py
    networks:
      - hazoom-net

  # ─── Collaborative Beat ──────────────────────────────────────────
  collaborative-beat:
    image: python:3.12-alpine
    profiles: ["optional"]
    working_dir: /app
    container_name: hazoom-collab-beat
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - BIND=0.0.0.0
    volumes:
      - ./services/collaborative-beat:/app
    command: python3 server.py
    networks:
      - hazoom-net

  # ─── DESCER Drum Machine ─────────────────────────────────────────
  descer:
    build:
      context: ./services/descer
    container_name: hazoom-descer
    restart: unless-stopped
    ports:
      - "6000:6000"
    environment:
      - PORT=6000
      - BIND=0.0.0.0
    volumes:
      - ./services/descer:/app
    command: python3 server.py
    networks:
      - hazoom-net

  # ─── Sovereign State ─────────────────────────────────────────────
  sovereign-state:
    image: python:3.12-alpine
    profiles: ["optional"]
    working_dir: /app
    container_name: hazoom-sovereign
    restart: unless-stopped
    ports:
      - "4747:4747"
    volumes:
      - ./services/sovereign-state:/app
    command: python3 gui.py
    networks:
      - hazoom-net

  # ─── Bouzelfa Ndhifa ─────────────────────────────────────────────
  bouzelfa-ndhifa:
    build:
      context: ./services/bouzelfa-ndhifa
      dockerfile: Dockerfile
    container_name: hazoom-bouzelfa
    restart: unless-stopped
    ports:
      - "7000:7000"
    volumes:
      - ./services/bouzelfa-ndhifa:/app
    environment:
      - PORT=7000
      - BIND=0.0.0.0
    networks:
      - hazoom-net

  # ─── Hazoom Intelligence ─────────────────────────────────────────
  hazoom-intelligence:
    build:
      context: ./services/hazoom-intelligence
      dockerfile: Dockerfile
    container_name: hazoom-intel
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      - PORT=8003
    volumes:
      - ./services/hazoom-intelligence:/app
    command: node server.js
    networks:
      - hazoom-net

  # ─── Serotonin Engine ────────────────────────────────────────────
  serotonin-engine:
    image: python:3.12-alpine
    profiles: ["optional"]
    working_dir: /app
    container_name: hazoom-serotonin
    restart: unless-stopped
    ports:
      - "8005:8005"
    volumes:
      - ./services/serotonin-engine:/app
    command: python3 -m http.server 8005
    networks:
      - hazoom-net

  # ─── Mario GTA6 ──────────────────────────────────────────────────
  mario-gta6:
    image: python:3.12-alpine
    profiles: ["optional"]
    working_dir: /app
    container_name: hazoom-mario-gta6
    restart: unless-stopped
    ports:
      - "9001:9001"
    volumes:
      - ./services/mario-gta6:/app
    command: python3 -m http.server 9001
    networks:
      - hazoom-net

  # ─── Portfolio ────────────────────────────────────────────────────
  portfolio:
    build:
      context: ./projects/portfolio
      dockerfile: Dockerfile
    container_name: hazoom-portfolio
    restart: unless-stopped
    ports:
      - "9002:80"
    volumes:
      - ./projects/portfolio/dist:/usr/share/nginx/html:ro
    networks:
      - hazoom-net

  # ─── Q-Learner (C Kernel VM) ────────────────────────────────────
  qkernel:
    image: qemux86_64:latest
    container_name: hazoom-qkernel
    restart: "no"
    profiles: ["kernel"]
    build:
      context: ./kernel/c
      dockerfile: Dockerfile.qemu
    devices:
      - /dev/kvm:/dev/kvm
    volumes:
      - ./kernel/c/hazoom-kernel.bin:/kernel.bin:ro
    networks:
      - hazoom-net

  # ─── DeepSeek Knowledge ──────────────────────────────────────────
  deepseek-knowledge:
    build:
      context: ./services/deepseek-knowledge
      dockerfile: Dockerfile
    container_name: hazoom-deepseek
    restart: unless-stopped
    ports:
      - "8200:8200"
    volumes:
      - ./services/deepseek-knowledge:/app
    command: python3 serve.py
    networks:
      - hazoom-net

  # ─── Mirror Transcendance ────────────────────────────────────────
  mirror-transcendance:
    build:
      context: ./services/mirror-transcendance
      dockerfile: Dockerfile
    container_name: hazoom-mirror
    restart: unless-stopped
    ports:
      - "8006:8006"
    volumes:
      - ./services/mirror-transcendance:/app
    command: python3 server.py
    networks:
      - hazoom-net

volumes:
  hazoom_data:
    driver: local
  hazoom_config:
    driver: local

networks:
  hazoom-net:
    driver: bridge
