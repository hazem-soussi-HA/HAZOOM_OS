# Recovery Configuration File
# This file contains configuration settings for recovery operations

# Default recovery settings
DEFAULT_RECOVERY_PATH="/recovery/location"

# Verification settings
VERIFY_AFTER_RECOVERY=true
CHECKSUM_ALGORITHM="md5"

# Safety settings
SAFETY_BACKUP_BEFORE_RECOVERY=true
MAX_RECOVERY_SIZE="100G"

# Excluded patterns during recovery
EXCLUDE_PATTERNS=(
    "*.tmp"
    "*.log"
    ".git"
    "node_modules"
)

# Notification settings
NOTIFY_EMAIL="admin@example.com"
NOTIFY_ON_SUCCESS=true
NOTIFY_ON_FAILURE=true

# Logging settings
LOG_LEVEL="INFO"
LOG_TO_SYSLOG=false

# Network settings (for remote recovery)
MAX_BANDWIDTH="10M"
CONNECTION_TIMEOUT=300