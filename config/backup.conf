# Backup Configuration File
# This file contains configuration settings for backup operations

# Source directories to backup
SOURCE_DIRS=(
    "/home/user/documents"
    "/var/www"
    "/etc"
    "/home/user/projects"
)

# Destination for backups
BACKUP_DEST="/backup/location"

# Excluded patterns
EXCLUDE_PATTERNS=(
    "*.tmp"
    "*.log"
    ".git"
    "node_modules"
    "*.cache"
    ".DS_Store"
)

# Encryption settings
ENCRYPTION_ENABLED=false
ENCRYPTION_KEY_FILE="/path/to/key"

# Compression settings
COMPRESSION_ENABLED=true
COMPRESSION_LEVEL=6

# Verification settings
VERIFY_AFTER_BACKUP=true
CHECKSUM_ALGORITHM="md5"

# Notification settings
NOTIFY_EMAIL="admin@example.com"
NOTIFY_ON_SUCCESS=true
NOTIFY_ON_FAILURE=true

# Retention settings
RETENTION_DAYS=30
MAX_BACKUPS=10