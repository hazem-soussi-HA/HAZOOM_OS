<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser - HAZOOM OS</title>
    <style>
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        .toolbar { display: flex; gap: 10px; padding: 10px; background: #1e293b; border-bottom: 1px solid #334155; }
        input { flex: 1; padding: 8px 12px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 5px; outline: none; }
        .btn { padding: 8px 15px; background: #3b82f6; border: none; color: white; border-radius: 5px; cursor: pointer; }
        .content { flex: 1; position: relative; }
        iframe { width: 100%; height: 100%; border: none; background: white; }
    </style>
</head>
<body>
    <div class="toolbar">
        <input type="text" id="urlInput" placeholder="Enter URL (e.g., https://www.bing.com)" value="https://www.wikipedia.org">
        <button class="btn" onclick="loadUrl()">Go</button>
    </div>
    <div class="content">
        <iframe id="browserFrame" src="https://www.wikipedia.org"></iframe>
    </div>

    <script>
        function loadUrl() {
            let url = document.getElementById('urlInput').value;
            if (!url.startsWith('http')) url = 'https://' + url;
            document.getElementById('browserFrame').src = url;
        }
        document.getElementById('urlInput').onkeypress = (e) => {
            if (e.key === 'Enter') loadUrl();
        };
    </script>
</body>
</html>
