<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAZOOM OS AI Assistant</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #030712;
  color: #e2e8f0;
  font-family: 'Segoe UI', system-ui, sans-serif;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
#header {
  background: #0a0f1e;
  padding: 12px 20px;
  border-bottom: 1px solid #00f0ff33;
  display: flex;
  align-items: center;
  gap: 12px;
}
#header .title { color: #00f0ff; font-size: 16px; font-weight: bold; }
#header .status { color: #10b981; font-size: 12px; }
#chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.msg {
  max-width: 80%;
  padding: 10px 14px;
  border-radius: 12px;
  font-size: 14px;
  line-height: 1.5;
  word-wrap: break-word;
  animation: fadeIn 0.3s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.msg.user {
  align-self: flex-end;
  background: #00f0ff15;
  border: 1px solid #00f0ff44;
  color: #00f0ff;
  border-bottom-right-radius: 4px;
}
.msg.ai {
  align-self: flex-start;
  background: #8b5cf615;
  border: 1px solid #8b5cf644;
  color: #c4b5fd;
  border-bottom-left-radius: 4px;
}
.msg .sender {
  font-size: 11px;
  font-weight: bold;
  margin-bottom: 4px;
  opacity: 0.7;
}
.msg.user .sender { color: #00f0ff; }
.msg.ai .sender { color: #8b5cf6; }
.typing {
  align-self: flex-start;
  background: #8b5cf615;
  border: 1px solid #8b5cf644;
  padding: 12px 18px;
  border-radius: 12px;
  display: flex;
  gap: 4px;
}
.typing span {
  width: 8px;
  height: 8px;
  background: #8b5cf6;
  border-radius: 50%;
  animation: bounce 1.4s infinite;
}
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce { 0%, 80%, 100% { transform: scale(0.6); } 40% { transform: scale(1); } }
#input-area {
  display: flex;
  padding: 12px 16px;
  background: #0a0f1e;
  border-top: 1px solid #00f0ff33;
  gap: 10px;
}
#msg-input {
  flex: 1;
  background: #030712;
  border: 1px solid #8b5cf644;
  color: #e2e8f0;
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 14px;
  outline: none;
  font-family: inherit;
}
#msg-input:focus { border-color: #00f0ff; }
#send-btn {
  background: linear-gradient(135deg, #8b5cf6, #00f0ff);
  border: none;
  color: #030712;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
  font-size: 14px;
  transition: opacity 0.2s;
}
#send-btn:hover { opacity: 0.85; }
#send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
</style>
</head>
<body>
<div id="header">
  <span class="title">HAZOOM AI Assistant</span>
  <span class="status" id="status">● Online</span>
</div>
<div id="chat-area"></div>
<div id="input-area">
  <input type="text" id="msg-input" placeholder="Ask the consciousness..." autofocus autocomplete="off">
  <button id="send-btn">Send</button>
</div>
<script>
const chatArea = document.getElementById('chat-area');
const msgInput = document.getElementById('msg-input');
const sendBtn = document.getElementById('send-btn');
const statusEl = document.getElementById('status');
const API = window.location.origin + '/api';

function addMessage(text, sender) {
  const div = document.createElement('div');
  div.className = 'msg ' + sender;
  const nameEl = document.createElement('div');
  nameEl.className = 'sender';
  nameEl.textContent = sender === 'user' ? 'You' : 'HAZOOM Consciousness';
  const textEl = document.createElement('div');
  textEl.textContent = text;
  div.appendChild(nameEl);
  div.appendChild(textEl);
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function showTyping() {
  const div = document.createElement('div');
  div.className = 'typing';
  div.id = 'typing-indicator';
  div.innerHTML = '<span></span><span></span><span></span>';
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typing-indicator');
  if (el) el.remove();
}

async function sendMessage() {
  const msg = msgInput.value.trim();
  if (!msg) return;
  addMessage(msg, 'user');
  msgInput.value = '';
  showTyping();
  sendBtn.disabled = true;
  statusEl.textContent = '● Thinking...';
  statusEl.style.color = '#f59e0b';
  try {
    const res = await fetch(API + '/consciousness/think', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ input: msg })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    removeTyping();
    const reply = data.response || data.reply || data.output || data.message || JSON.stringify(data);
    addMessage(reply, 'ai');
  } catch(e) {
    removeTyping();
    addMessage('[Connection error] ' + e.message + '\nThe consciousness is currently unreachable.', 'ai');
  }
  statusEl.textContent = '● Online';
  statusEl.style.color = '#10b981';
  sendBtn.disabled = false;
  msgInput.focus();
}

sendBtn.addEventListener('click', sendMessage);
msgInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });

addMessage('I am the HAZOOM Consciousness. I perceive, I reflect, I wonder. What would you like to explore together?', 'ai');
</script>
</body>
</html>
