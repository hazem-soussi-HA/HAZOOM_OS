<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Hazoom OS — Terminal</title>
<style>
:root{--bg:#0a0e17;--bg2:#111827;--green:#22c55e;--red:#ef4444;--yellow:#f59e0b;--blue:#3b82f6;--cyan:#06b6d4;--text:#e2e8f0;--text2:#64748b;--border:#1e293b;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'JetBrains Mono','Fira Code','SF Mono','Cascadia Code',monospace;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;}
.scanline{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999;background:repeating-linear-gradient(0deg,rgba(0,0,0,.03) 0px,rgba(0,0,0,.03) 1px,transparent 1px,transparent 3px);}

/* Tabs */
.tabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--border);padding:0 8px;overflow-x:auto;flex-shrink:0;}
.tab{display:flex;align-items:center;gap:6px;padding:8px 14px;font-size:.78rem;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap;}
.tab:hover{color:var(--text);}
.tab.active{border-bottom-color:var(--green);color:var(--green);}
.tab-close{margin-left:4px;opacity:.4;font-size:.7rem;padding:2px;border-radius:3px;}
.tab-close:hover{opacity:1;background:rgba(255,255,255,.1);}
.new-tab{padding:8px 10px;color:var(--text2);cursor:pointer;font-size:1rem;}
.new-tab:hover{color:var(--green);}

/* Terminal Output */
.term-output{flex:1;overflow-y:auto;padding:12px 16px;font-size:.88rem;line-height:1.6; scroll-behavior: smooth;}
.term-output::-webkit-scrollbar{width:6px;}
.term-output::-webkit-scrollbar-track{background:transparent;}
.term-output::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}

.output-line{white-space:pre-wrap;word-break:break-all;min-height:1.3em;}
.output-line .prompt{color:var(--green);font-weight:600;margin-right:4px;}
.output-line .cmd{color:var(--text);margin-right:8px;}
.output-line .err{color:var(--red);}
.output-line .ok{color:var(--cyan);}
.output-line .info{color:var(--yellow);}
.output-line .dim{color:var(--text2);font-size:.8rem;}
.output-line .tree-branch{color:var(--blue);}
.output-line .neofetch-label{color:var(--cyan);font-weight:600;}
.output-line .neofetch-val{color:var(--text);}

/* Input */
.input-row{display:flex;align-items:center;padding:10px 16px;background:var(--bg2);border-top:2px solid var(--green);flex-shrink:0;}
.input-prompt{color:var(--green);font-weight:600;margin-right:8px;white-space:nowrap;font-size:.88rem;}
.term-input{flex:1;background:none;border:none;color:var(--text);font-family:inherit;font-size:.88rem;outline:none;caret-color:var(--green);}
.term-input::placeholder{color:var(--text2);opacity:.4;}

/* Context Menu */
.ctx-menu{position:fixed;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:4px 0;min-width:160px;z-index:998;box-shadow:0 8px 30px rgba(0,0,0,.5);display:none;}
.ctx-menu.show{display:block;}
.ctx-item{padding:7px 16px;font-size:.8rem;color:var(--text2);cursor:pointer;display:flex;justify-content:space-between;}
.ctx-item:hover{background:var(--border);color:var(--text);}
.ctx-item .shortcut{color:var(--text2);font-size:.7rem;margin-left:16px;}
</style>
</head>
<body>
<div class="scanline"></div>
<div class="tabs" id="tabs"><div class="new-tab" id="newTabBtn" title="New Tab (Ctrl+T)">+</div></div>
<div class="term-output" id="output"></div>
<div class="input-row"><span class="input-prompt" id="inputPrompt">hazem@hazoom:~$</span><input type="text" class="term-input" id="input" autocomplete="off" spellcheck="false"></div>
<div class="ctx-menu" id="ctxMenu"></div>

<script>
// ─── Security: No eval() — Command Map Only ─────────────────────────────────
const E = s => { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; };
const CLI = {}; // command registry

// ─── Virtual Filesystem ─────────────────────────────────────────────────────
const FS_KEY = 'hazoom_os_fs';
function loadFS() {
  try { return JSON.parse(localStorage.getItem(FS_KEY) || 'null'); } catch { return null; }
}
function saveFS(fs) { localStorage.setItem(FS_KEY, JSON.stringify(fs)); }

function initFS() {
  return {
    '/': { type: 'dir', children: ['home','etc','tmp','var','usr','dev'] },
    '/home': { type: 'dir', children: ['hazoom'] },
    '/home/hazoom': { type: 'dir', children: ['Desktop','Documents','Downloads','Projects','.config','.bashrc'], owner: 'hazoom' },
    '/home/hazoom/Desktop': { type: 'dir', children: [] },
    '/home/hazoom/Documents': { type: 'dir', children: ['welcome.txt','notes.md'], owner: 'hazoom' },
    '/home/hazoom/Documents/welcome.txt': { type: 'file', content: 'Welcome to Hazoom OS v2.3!\n\nThis is a real virtual filesystem backed by localStorage.\nTry: ls, cat welcome.txt, tree, find, grep, and more.\n\n"Nothing is lost and everything is connected." — Hazoom', size: 180 },
    '/home/hazoom/Documents/notes.md': { type: 'file', content: '# Hazoom OS Notes\n\n## Features\n- Virtual filesystem\n- Real terminal emulator\n- Window manager\n- MCP architecture\n- 34+ applications\n\n## Motto\nOS is like a deep self-mind.\nDoubt is a key for opening doors.', size: 220 },
    '/home/hazoom/Downloads': { type: 'dir', children: [] },
    '/home/hazoom/Projects': { type: 'dir', children: ['hazoom-os','website'] },
    '/home/hazoom/Projects/hazoom-os': { type: 'dir', children: ['README.md','package.json'] },
    '/home/hazoom/Projects/hazoom-os/README.md': { type: 'file', content: '# Hazoom OS\n\nA comprehensive web-based operating system.\nBuilt with JavaScript, Python, and HTML5.\n\n## Running\n```bash\n./start_hazoom.sh\n```', size: 140 },
    '/home/hazoom/Projects/hazoom-os/package.json': { type: 'file', content: '{\n  "name": "hazoom-os",\n  "version": "2.3.0",\n  "description": "Web-based OS"\n}', size: 85 },
    '/home/hazoom/Projects/website': { type: 'dir', children: ['index.html'] },
    '/home/hazoom/Projects/website/index.html': { type: 'file', content: '<!DOCTYPE html>\n<html>\n<head><title>Hazoom OS</title></head>\n<body><h1>Hazoom OS</h1></body>\n</html>', size: 105 },
    '/home/hazoom/.config': { type: 'dir', children: ['settings.json'] },
    '/home/hazoom/.config/settings.json': { type: 'file', content: '{\n  "theme": "dark",\n  "accent": "#3b82f6",\n  "fontSize": 15\n}', size: 65 },
    '/home/hazoom/.bashrc': { type: 'file', content: '# Hazoom Shell Configuration\nexport PS1="hazoom@hazoom:~$ "\nexport EDITOR=vim\nexport PATH=/usr/local/bin:/usr/bin:/bin\nalias ll="ls -la"\nalias la="ls -la"\nalias ..="cd .."', size: 195 },
    '/etc': { type: 'dir', children: ['hostname','passwd','os-release'] },
    '/etc/hostname': { type: 'file', content: 'hazoom-os', size: 9 },
    '/etc/passwd': { type: 'file', content: 'hazoom:x:1000:1000:Hazem Soussi:/home:hazoom:/bin/hazsh\nroot:x:0:0:root:/root:/bin/hazsh', size: 100 },
    '/etc/os-release': { type: 'file', content: 'NAME="Hazoom OS"\nVERSION="2.3.0"\nID=hazoom\nPRETTY_NAME="Hazoom OS 2.3.0 Ethereal Edition"', size: 95 },
    '/tmp': { type: 'dir', children: [] },
    '/var': { type: 'dir', children: ['log'] },
    '/var/log': { type: 'dir', children: ['syslog','boot.log'] },
    '/var/log/syslog': { type: 'file', content: '[2026-05-30 22:00:01] Hazoom OS v2.3.0 booted\n[2026-05-30 22:00:02] Kernel: JavaScript Core loaded\n[2026-05-30 22:00:03] Window Manager: initialized\n[2026-05-30 22:00:04] MCP Context Router: active\n[2026-05-30 22:00:05] Ready.', size: 250 },
    '/var/log/boot.log': { type: 'file', content: '[OK] Virtual filesystem initialized\n[OK] Terminal emulator loaded\n[OK] Window manager ready\n[OK] Search proxy started\n[OK] All systems operational', size: 180 },
    '/usr': { type: 'dir', children: ['bin','lib','share'] },
    '/usr/bin': { type: 'dir', children: [] },
    '/usr/lib': { type: 'dir', children: [] },
    '/usr/share': { type: 'dir', children: ['doc'] },
    '/usr/share/doc': { type: 'dir', children: [] },
    '/dev': { type: 'dir', children: ['null','random','zero'] },
    '/dev/null': { type: 'file', content: '', size: 0 },
    '/dev/random': { type: 'file', content: '(binary device)', size: 14 },
    '/dev/zero': { type: 'file', content: '\x00\x00\x00\x00\x00\x00\x00\x00', size: 8 },
  };
}

let fs = loadFS() || initFS();
saveFS(fs);

// ─── FS Helpers ─────────────────────────────────────────────────────────────
function resolvePath(p, cwd) {
  if (!p || p === '/') return '/';
  if (p.startsWith('/')) {
    const parts = p.split('/').filter(Boolean);
  } else {
    const parts = [...cwd.split('/').filter(Boolean), ...p.split('/').filter(Boolean)];
  }
  const resolved = [];
  const raw = p.startsWith('/') ? p.split('/').filter(Boolean) : [...cwd.split('/').filter(Boolean), ...p.split('/').filter(Boolean)];
  for (const part of raw) {
    if (part === '..') resolved.pop();
    else if (part !== '.') resolved.push(part);
  }
  return '/' + resolved.join('/');
}

function getNode(path) {
  const abs = resolvePath(path, state.cwd);
  return { node: fs[abs], path: abs };
}

function getParent(path) {
  const parts = path.split('/').filter(Boolean);
  parts.pop();
  return '/' + parts.join('/');
}

// ─── Session State ──────────────────────────────────────────────────────────
let state = {
  cwd: '/home/hazoom',
  user: 'hazoom',
  env: { HOME: '/home/hazoom', SHELL: '/bin/hazsh', EDITOR: 'vim', PATH: '/usr/bin:/bin:/usr/local/bin', TERM: 'xterm-256color', LANG: 'en_US.UTF-8' },
  history: [],
  historyIdx: -1,
  sessionStart: Date.now(),
  rateLimit: [],
};

// ─── Tab System ─────────────────────────────────────────────────────────────
let tabs = [{ id: 0, output: [], cwd: state.cwd }];
let activeTabId = 0;
let tabCounter = 1;

const tabsEl = document.getElementById('tabs');
const outputEl = document.getElementById('output');
const inputEl = document.getElementById('input');
const inputPromptEl = document.getElementById('inputPrompt');

function renderTabs() {
  const existing = tabsEl.querySelectorAll('.tab');
  existing.forEach(e => e.remove());
  tabs.forEach(t => {
    const div = document.createElement('div');
    div.className = 'tab' + (t.id === activeTabId ? ' active' : '');
    div.id = `tab-${t.id}`;
    div.innerHTML = `<span>⚡ hazsh</span><span class="tab-close" data-id="${t.id}">✕</span>`;
    div.addEventListener('click', (e) => {
      if (e.target.classList.contains('tab-close')) { closeTab(t.id); }
      else { switchTab(t.id); }
    });
    tabsEl.insertBefore(div, tabsEl.lastElementChild);
  });
}

function switchTab(id) {
  // Save current tab state
  const cur = tabs.find(t => t.id === activeTabId);
  if (cur) cur.output = [...outputEl.children];
  activeTabId = id;
  const tab = tabs.find(t => t.id === id);
  if (!tab) return;
  outputEl.innerHTML = '';
  tab.output.forEach(el => outputEl.appendChild(el));
  state.cwd = tab.cwd;
  renderTabs();
  updatePrompt();
  scrollToBottom();
}

function closeTab(id) {
  if (tabs.length <= 1) return;
  const idx = tabs.findIndex(t => t.id === id);
  tabs.splice(idx, 1);
  if (activeTabId === id) switchTab(tabs[Math.max(0, idx - 1)].id);
  else renderTabs();
}

function newTab() {
  const t = { id: tabCounter++, output: [], cwd: '/home/hazoom' };
  tabs.push(t);
  switchTab(t.id);
}

document.getElementById('newTabBtn').addEventListener('click', newTab);
renderTabs();

// ─── Output Helpers ─────────────────────────────────────────────────────────
function out(html) {
  const div = document.createElement('div');
  div.className = 'output-line';
  div.innerHTML = html;
  outputEl.appendChild(div);
  const tab = tabs.find(t => t.id === activeTabId);
  if (tab) tab.output.push(div);
  scrollToBottom();
}

function outPlain(text) { out(E(text)); }
function cmdEcho(cmd) { out(`<span class="prompt">${E(state.user)}@hazoom:${E(state.cwd)}$</span> <span class="cmd">${E(cmd)}</span>`); }
function outErr(msg) { out(`<span class="err">${E(msg)}</span>`); }
function outOk(msg) { out(`<span class="ok">${E(msg)}</span>`); }
function outInfo(msg) { out(`<span class="info">${E(msg)}</span>`); }
function outLine(msg) { out(`<span class="dim">${E(msg)}</span>`); }

function scrollToBottom() { outputEl.scrollTop = outputEl.scrollHeight; }

function updatePrompt() { inputPromptEl.textContent = `${state.user}@hazoom:${state.cwd}$ `; }

// ─── Commands ───────────────────────────────────────────────────────────────

CLI.help = (args) => {
  outInfo('═══ Hazoom OS Terminal v2.3 ═══');
  outLine('');
  outOk('FILE SYSTEM:');
  outLine('  ls [-la] [path]    List directory contents');
  outLine('  cd <path>          Change directory');
  outLine('  pwd                Print working directory');
  outLine('  cat <file>         Display file content');
  outLine('  head [-n N] <file> Show first N lines');
  outLine('  tail [-n N] <file> Show last N lines');
  outLine('  touch <file>       Create empty file');
  outLine('  mkdir <dir>        Create directory');
  outLine('  rm <file>          Delete file');
  outLine('  cp <src> <dst>     Copy file');
  outLine('  mv <src> <dst>     Move/rename file');
  outLine('  tree [path]        Show directory tree');
  outLine('  find <name>        Find files matching pattern');
  outLine('  grep <pat> <file>  Search text in file');
  out('');
  outOk('SYSTEM:');
  outLine('  whoami             Show current user');
  outLine('  date               Show current date/time');
  outLine('  uptime             Session uptime');
  outLine('  version            OS version info');
  outLine('  neofetch           System information');
  outLine('  clear              Clear terminal');
  out('');
  outOk('UTILITY:');
  outLine('  echo <text>        Display text');
  outLine('  calc <expr>        Calculator (e.g. 2+3*4)');
  outLine('  env                Show environment');
  outLine('  export K=V         Set environment variable');
  outLine('  history            Command history');
  outLine('  resetfs            Reset filesystem to defaults');
  out('');
  outOk('SHORTCUTS:');
  outLine('  Ctrl+T   New tab    Ctrl+W   Close tab');
  outLine('  Ctrl+L   Clear      Ctrl+C   Cancel');
  outLine('  ↑/↓      History    Tab      Autocomplete');
};

CLI.ls = (args) => {
  const flags = args.filter(a => a.startsWith('-'));
  const paths = args.filter(a => !a.startsWith('-'));
  const showAll = flags.some(f => f.includes('a'));
  const showLong = flags.some(f => f.includes('l'));
  const target = paths[0] || state.cwd;
  const { node, path } = getNode(target);
  if (!node) return outErr(`ls: cannot access '${target}': No such file or directory`);
  if (node.type === 'file') {
    if (showLong) outPlain(`-rw-r--r-- 1 hazoom hazoom ${node.size.toString().padStart(6)} Jan 01 00:00 ${path.split('/').pop()}`);
    else outPlain(path.split('/').pop());
    return;
  }
  const children = (node.children || []).filter(c => showAll || !c.startsWith('.'));
  if (showLong) {
    children.forEach(name => {
      const child = fs[path + '/' + name];
      if (!child) return;
      const type = child.type === 'dir' ? 'd' : '-';
      const size = child.size?.toString().padStart(6) || '     0';
      const color = child.type === 'dir' ? 'ok' : '';
      out(`<span class="${color}">${type}rw-r--r-- 1 hazoom hazoom ${size} Jan 01 00:00 ${E(name)}</span>`);
    });
    outLine(`  ${children.length} items`);
  } else {
    const formatted = children.map(name => {
      const child = fs[path + '/' + name];
      if (child && child.type === 'dir') return `<span class="ok">${E(name)}/</span>`;
      return E(name);
    });
    out(formatted.join('  '));
  }
};

CLI.cd = (args) => {
  if (!args[0] || args[0] === '~') args[0] = state.env.HOME;
  const target = resolvePath(args[0], state.cwd);
  const node = fs[target];
  if (!node) return outErr(`cd: no such directory: ${args[0]}`);
  if (node.type !== 'dir') return outErr(`cd: not a directory: ${args[0]}`);
  state.cwd = target;
  const tab = tabs.find(t => t.id === activeTabId);
  if (tab) tab.cwd = target;
  updatePrompt();
};

CLI.pwd = () => outPlain(state.cwd);

CLI.cat = (args) => {
  if (!args[0]) return outErr('cat: missing operand');
  const { node, path } = getNode(args[0]);
  if (!node) return outErr(`cat: ${args[0]}: No such file or directory`);
  if (node.type === 'dir') return outErr(`cat: ${args[0]}: Is a directory`);
  node.content.split('\n').forEach(line => outPlain(line));
};

CLI.head = (args) => {
  const nIdx = args.indexOf('-n');
  const n = nIdx >= 0 ? parseInt(args[nIdx + 1]) || 10 : 10;
  const file = args.filter(a => a !== '-n' && args.indexOf(a) !== nIdx + 1)[0];
  if (!file) return outErr('head: missing operand');
  const { node } = getNode(file);
  if (!node) return outErr(`head: ${file}: No such file`);
  node.content.split('\n').slice(0, n).forEach(line => outPlain(line));
};

CLI.tail = (args) => {
  const nIdx = args.indexOf('-n');
  const n = nIdx >= 0 ? parseInt(args[nIdx + 1]) || 10 : 10;
  const file = args.filter(a => a !== '-n' && args.indexOf(a) !== nIdx + 1)[0];
  if (!file) return outErr('tail: missing operand');
  const { node } = getNode(file);
  if (!node) return outErr(`tail: ${file}: No such file`);
  node.content.split('\n').slice(-n).forEach(line => outPlain(line));
};

CLI.touch = (args) => {
  if (!args[0]) return outErr('touch: missing operand');
  const { path } = getNode(args[0]);
  if (fs[path]) return; // exists
  fs[path] = { type: 'file', content: '', size: 0 };
  const parent = fs[getParent(path)];
  if (parent && parent.children && !parent.children.includes(path.split('/').pop())) {
    parent.children.push(path.split('/').pop());
  }
  saveFS(fs);
  outOk(`Created: ${path}`);
};

CLI.mkdir = (args) => {
  if (!args[0]) return outErr('mkdir: missing operand');
  const { path } = getNode(args[0]);
  if (fs[path]) return outErr(`mkdir: already exists: ${args[0]}`);
  fs[path] = { type: 'dir', children: [], owner: state.user };
  const parentPath = getParent(path);
  const parent = fs[parentPath];
  if (parent && parent.children) parent.children.push(path.split('/').pop());
  saveFS(fs);
  outOk(`Created directory: ${path}`);
};

CLI.rm = (args) => {
  if (!args[0]) return outErr('rm: missing operand');
  const { path } = getNode(args[0]);
  if (!fs[path]) return outErr(`rm: no such file: ${args[0]}`);
  if (path === '/') return outErr('rm: cannot remove root filesystem');
  delete fs[path];
  const parent = fs[getParent(path)];
  if (parent && parent.children) parent.children = parent.children.filter(c => c !== path.split('/').pop());
  saveFS(fs);
  outOk(`Removed: ${path}`);
};

CLI.cp = (args) => {
  if (args.length < 2) return outErr('cp: missing operands');
  const { node: srcNode, path: srcPath } = getNode(args[0]);
  if (!srcNode) return outErr(`cp: ${args[0]}: not found`);
  const { path: dstPath } = getNode(args[1]);
  fs[dstPath] = { ...srcNode };
  const parent = fs[getParent(dstPath)];
  if (parent && parent.children && !parent.children.includes(dstPath.split('/').pop())) {
    parent.children.push(dstPath.split('/').pop());
  }
  saveFS(fs);
  outOk(`Copied: ${srcPath} → ${dstPath}`);
};

CLI.mv = (args) => {
  if (args.length < 2) return outErr('mv: missing operands');
  CLI.cp(args);
  CLI.rm([args[0]]);
  outOk(`Moved: ${resolvePath(args[0], state.cwd)} → ${resolvePath(args[1], state.cwd)}`);
};

CLI.tree = (args) => {
  const target = args[0] || state.cwd;
  const { node, path } = getNode(target);
  if (!node) return outErr(`tree: ${target}: not found`);
  if (node.type === 'file') { outPlain(path.split('/').pop()); return; }
  outPlain(path);
  function walk(p, prefix) {
    const n = fs[p];
    if (!n || !n.children) return;
    n.children.forEach((name, i) => {
      const childPath = p + '/' + name;
      const isLast = i === n.children.length - 1;
      const branch = isLast ? '└── ' : '├── ';
      const child = fs[childPath];
      const displayName = child?.type === 'dir' ? `<span class="ok">${E(name)}/</span>` : E(name);
      out(`<span class="tree-branch">${prefix}${branch}</span>${displayName}`);
      if (child?.type === 'dir') walk(childPath, prefix + (isLast ? '    ' : '│   '));
    });
  }
  walk(path, '');
};

CLI.find = (args) => {
  if (!args[0]) return outErr('find: missing pattern');
  const pattern = args[0].toLowerCase();
  const results = [];
  for (const [p, node] of Object.entries(fs)) {
    if (p.toLowerCase().includes(pattern)) results.push(p);
  }
  if (!results.length) return outInfo('No matches found');
  results.sort().forEach(p => {
    const n = fs[p];
    outLine(`  ${n.type === 'dir' ? '📁' : '📄'} ${E(p)}`);
  });
  outInfo(`Found ${results.length} matches`);
};

CLI.grep = (args) => {
  if (args.length < 2) return outErr('grep: grep <pattern> <file>');
  const pattern = args[0].toLowerCase();
  const file = args.slice(1).join(' ');
  const { node } = getNode(file);
  if (!node) return outErr(`grep: ${file}: not found`);
  if (node.type === 'dir') return outErr(`grep: ${file}: is a directory`);
  const lines = node.content.split('\n');
  let count = 0;
  lines.forEach((line, i) => {
    if (line.toLowerCase().includes(pattern)) {
      outLine(`  <span class="info">${i + 1}:</span> ${E(line)}`);
      count++;
    }
  });
  outInfo(`${count} match${count !== 1 ? 'es' : ''}`);
};

CLI.whoami = () => outPlain(state.user);

CLI.date = () => outPlain(new Date().toString());

CLI.uptime = () => {
  const ms = Date.now() - state.sessionStart;
  const s = Math.floor(ms / 1000);
  const m = Math.floor(s / 60);
  const h = Math.floor(m / 60);
  outPlain(`Session: ${h}h ${m % 60}m ${s % 60}s`);
};

CLI.clear = () => {
  outputEl.innerHTML = '';
  const tab = tabs.find(t => t.id === activeTabId);
  if (tab) tab.output = [];
};

CLI.echo = (args) => outPlain(args.join(' ') || '');

CLI.calc = (args) => {
  if (!args[0]) return outErr('calc: missing expression');
  const expr = args.join('');
  if (!/^[\d+\-*/().%^ ]+$/.test(expr)) return outErr('calc: invalid characters');
  try {
    const result = new Function('return ' + expr.replace(/\^/g, '**'))();
    outOk(`= ${result}`);
  } catch { outErr('calc: invalid expression'); }
};

CLI.env = () => {
  Object.entries(state.env).forEach(([k, v]) => outPlain(`${k}=${v}`));
};

CLI.export = (args) => {
  if (!args[0] || !args[0].includes('=')) return outErr('export: usage: export KEY=VALUE');
  const [k, ...rest] = args.join(' ').split('=');
  state.env[k.trim()] = rest.join('=');
  outOk(`export ${k.trim()}=${state.env[k.trim()]}`);
};

CLI.history = () => {
  if (!state.history.length) return outInfo('No history yet');
  state.history.forEach((h, i) => outLine(`  ${(i + 1).toString().padStart(3)}  ${E(h)}`));
};

CLI.resetfs = () => {
  localStorage.removeItem(FS_KEY);
  fs = initFS();
  saveFS(fs);
  outInfo('Filesystem reset to defaults');
};

CLI.import = (args) => {
  if (!args[0]) return outErr('import: usage: import <module>');

};

CLI.man = (args) => {
  if (!args[0]) return outErr('man: usage: man <command>');
  const cmd = CLI[args[0]];
  if (!cmd) return outErr(`man: no manual for '${args[0]}'`);
  outInfo(`MANUAL: ${args[0]}`);
  outLine(cmd._help || `  ${args[0]} — Hazoom OS command`);
};
CLI.man._help = 'man <cmd>          Show manual for command';

CLI.cd._help = 'cd <path>          Change directory';
CLI.pwd._help = 'pwd                Print working directory';

CLI.touch._help = 'touch <file>       Create empty file';
CLI.mkdir._help = 'mkdir <dir>        Create directory';
CLI.rm._help = 'rm <file>          Delete file';
CLI.cp._help = 'cp <src> <dst>     Copy file';
CLI.mv._help = 'mv <src> <dst>     Move/rename file';
CLI.tree._help = 'tree [path]        Show directory tree';
CLI.find._help = 'find <name>        Find files matching pattern';
CLI.grep._help = 'grep <pat> <file>  Search text in file';

// ─── Input Handler ──────────────────────────────────────────────────────────
function execCommand(raw) {
  const cmd = raw.trim();
  if (!cmd) return;

  state.history.push(cmd);
  state.historyIdx = -1;
  cmdEcho(cmd);

  const parts = cmd.match(/(?:[^\s"]+|"[^"]*")+/g) || [];
  const name = parts[0]?.toLowerCase();
  const args = parts.slice(1).map(a => a.replace(/^"|"$/g, ''));

  if (name === 'exit' || name === 'quit') {
    outInfo('Logout. Refresh to restart.');
    inputEl.disabled = true;
    return;
  }

  const fn = CLI[name];
  if (fn) {
    fn(args);
  } else {
    outErr(`${name}: command not found. Type 'help' for available commands.`);
  }
}

// ─── Event Listeners ────────────────────────────────────────────────────────
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    execCommand(inputEl.value);
    inputEl.value = '';
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (state.history.length === 0) return;
    if (state.historyIdx === -1) state.historyIdx = state.history.length - 1;
    else if (state.historyIdx > 0) state.historyIdx--;
    inputEl.value = state.history[state.historyIdx] || '';
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (state.historyIdx === -1) return;
    state.historyIdx++;
    if (state.historyIdx >= state.history.length) { state.historyIdx = -1; inputEl.value = ''; }
    else inputEl.value = state.history[state.historyIdx] || '';
  } else if (e.key === 'Tab') {
    e.preventDefault();
    const val = inputEl.value.trim();
    if (!val) return;
    const cmds = Object.keys(CLI);
    const matches = cmds.filter(c => c.startsWith(val.toLowerCase()));
    if (matches.length === 1) inputEl.value = matches[0] + ' ';
    else if (matches.length > 1) { cmdEcho(inputEl.value); outLine('  ' + matches.join('  ')); }
  } else if (e.key === 'l' && e.ctrlKey) {
    e.preventDefault(); CLI.clear();
  } else if (e.key === 'c' && e.ctrlKey) {
    e.preventDefault(); cmdEcho(inputEl.value + '^C'); inputEl.value = '';
  } else if (e.key === 't' && e.ctrlKey) {
    e.preventDefault(); newTab();
  } else if (e.key === 'w' && e.ctrlKey) {
    e.preventDefault(); closeTab(activeTabId);
  } else if (e.key === 'Tab' && e.ctrlKey) {
    e.preventDefault();
    const idx = tabs.findIndex(t => t.id === activeTabId);
    switchTab(tabs[(idx + 1) % tabs.length].id);
  }
});

// ─── Context Menu ─────────────────────────────────────────────────────────
const ctxMenu = document.getElementById('ctxMenu');
const ctxItems = [
  { label: 'Copy', shortcut: 'Ctrl+C', action: () => { const sel = window.getSelection().toString(); if (sel) navigator.clipboard.writeText(sel); } },
  { label: 'Paste', shortcut: 'Ctrl+V', action: () => navigator.clipboard.readText().then(t => { inputEl.value += t; }) },
  { label: 'Clear', shortcut: 'Ctrl+L', action: () => CLI.clear() },
  { label: 'Find Text', action: () => { const q = prompt('Find:'); if (!q) return; const lines = outputEl.querySelectorAll('.output-line'); lines.forEach(l => { if (l.textContent.toLowerCase().includes(q.toLowerCase())) { l.style.background = 'rgba(245,158,11,.15)'; } else { l.style.background = ''; } }); } },
];

function showCtxMenu(x, y) {
  ctxMenu.innerHTML = ctxItems.map(i => `<div class="ctx-item"><span>${i.label}</span>${i.shortcut ? `<span class="shortcut">${i.shortcut}</span>` : ''}</div>`).join('');
  ctxMenu.innerHTML += '<div style="height:1px;background:var(--border);margin:4px 0"></div>';
  ctxItems.forEach((item, idx) => {
    const div = ctxMenu.querySelectorAll('.ctx-item')[idx];
    div.addEventListener('click', () => { item.action(); ctxMenu.classList.remove('show'); });
  });
  ctxMenu.style.left = x + 'px';
  ctxMenu.style.top = y + 'px';
  ctxMenu.classList.add('show');
}

outputEl.addEventListener('contextmenu', (e) => { e.preventDefault(); showCtxMenu(e.clientX, e.clientY); });
document.addEventListener('click', () => ctxMenu.classList.remove('show'));

// ─── Init ───────────────────────────────────────────────────────────────────
updatePrompt();
outInfo('⚡ Hazoom OS Terminal v2.3 — Ethereal Edition');
outLine('Type "help" for available commands. Ctrl+T for new tab.');
out('');
</script>
