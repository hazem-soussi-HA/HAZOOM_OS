<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Live Stream - HAZOOM OS</title>
    <link rel="stylesheet" href="../styles/hazoom-os.css">
    <style>
        :root {
            --primary-color: #ff0066;
            --secondary-color: #ff00ff;
            --accent-color: #00ffff;
            --bg-primary: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 50%, #0a1a2e 100%);
            --bg-secondary: rgba(0, 0, 0, 0.7);
            --border-color: rgba(255, 0, 100, 0.3);
            --text-primary: #e0e0ff;
            --video-border: rgba(255, 0, 100, 0.3);
            --video-glow: rgba(255, 0, 100, 0.2);
        }

        [data-theme="neon"] {
            --primary-color: #ff0066;
            --secondary-color: #ff00ff;
            --accent-color: #00ffff;
            --bg-primary: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 50%, #0a1a2e 100%);
            --bg-secondary: rgba(0, 0, 0, 0.7);
            --border-color: rgba(255, 0, 100, 0.3);
            --text-primary: #e0e0ff;
            --video-border: rgba(255, 0, 100, 0.3);
            --video-glow: rgba(255, 0, 100, 0.2);
        }

        [data-theme="cyberpunk"] {
            --primary-color: #00ff00;
            --secondary-color: #ff0066;
            --accent-color: #ffff00;
            --bg-primary: linear-gradient(135deg, #0a0a0a 0%, #1a1a00 50%, #0a0a1a 100%);
            --bg-secondary: rgba(0, 0, 0, 0.7);
            --border-color: rgba(0, 255, 0, 0.3);
            --text-primary: #00ff00;
            --video-border: rgba(0, 255, 0, 0.3);
            --video-glow: rgba(0, 255, 0, 0.2);
        }

        [data-theme="dark"] {
            --primary-color: #3b82f6;
            --secondary-color: #8b5cf6;
            --accent-color: #ffffff;
            --bg-primary: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            --bg-secondary: rgba(0, 0, 0, 0.7);
            --border-color: rgba(59, 130, 246, 0.3);
            --text-primary: #e0e0ff;
            --video-border: rgba(59, 130, 246, 0.3);
            --video-glow: rgba(59, 130, 246, 0.2);
        }

        [data-theme="purple"] {
            --primary-color: #8b5cf6;
            --secondary-color: #d946ef;
            --accent-color: #a855f7;
            --bg-primary: linear-gradient(135deg, #1a0a2e 0%, #2e0a4e 50%, #1a0a2e 100%);
            --bg-secondary: rgba(45, 20, 60, 0.7);
            --border-color: rgba(139, 92, 246, 0.3);
            --text-primary: #e0e0ff;
            --video-border: rgba(139, 92, 246, 0.3);
            --video-glow: rgba(139, 92, 246, 0.2);
        }

        [data-theme="blue"] {
            --primary-color: #3b82f6;
            --secondary-color: #06b6d4;
            --accent-color: #0ea5e9;
            --bg-primary: linear-gradient(135deg, #0a0a2e 0%, #0a1a2e 50%, #0a0a2e 100%);
            --bg-secondary: rgba(10, 25, 47, 0.7);
            --border-color: rgba(59, 130, 246, 0.3);
            --text-primary: #e0e0ff;
            --video-border: rgba(6, 182, 212, 0.3);
            --video-glow: rgba(6, 182, 212, 0.2);
        }

        [data-theme="green"] {
            --primary-color: #22c55e;
            --secondary-color: #10b981;
            --accent-color: #34d399;
            --bg-primary: linear-gradient(135deg, #0a2a0a 0%, #1a3a1a 50%, #0a2a0a 100%);
            --bg-secondary: rgba(10, 42, 10, 0.7);
            --border-color: rgba(34, 197, 94, 0.3);
            --text-primary: #e0e0ff;
            --video-border: rgba(34, 197, 94, 0.3);
            --video-glow: rgba(34, 197, 94, 0.2);
        }

        [data-theme="gold"] {
            --primary-color: #fbbf24;
            --secondary-color: #f59e0b;
            --accent-color: #fcd34d;
            --bg-primary: linear-gradient(135deg, #1a1a0a 0%, #2a2a1a 50%, #1a1a0a 100%);
            --bg-secondary: rgba(26, 26, 10, 0.7);
            --border-color: rgba(251, 191, 36, 0.3);
            --text-primary: #fffbeb;
            --video-border: rgba(251, 191, 36, 0.3);
            --video-glow: rgba(251, 191, 36, 0.2);
        }

        [data-theme="matrix"] {
            --primary-color: #00ff00;
            --secondary-color: #003300;
            --accent-color: #00ff00;
            --bg-primary: linear-gradient(135deg, #000000 0%, #001100 50%, #000000 100%);
            --bg-secondary: rgba(0, 0, 0, 0.8);
            --border-color: rgba(0, 255, 0, 0.5);
            --text-primary: #00ff00;
            --video-border: rgba(0, 255, 0, 0.3);
            --video-glow: rgba(0, 255, 0, 0.3);
            font-family: 'JetBrains Mono', 'Courier New', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            transition: all 0.5s ease;
        }

        .container {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            padding: 20px;
            background: var(--bg-secondary);
            border-radius: 15px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header h1 {
            font-size: 2em;
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color), var(--accent-color));
            background-size: 200% 200%;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradient 3s ease infinite;
        }

        @keyframes gradient {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .header-controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .theme-selector {
            padding: 12px 20px;
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            color: var(--primary-color);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .theme-selector:hover {
            background: var(--bg-secondary);
            border-color: var(--primary-color);
        }

        .video-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            justify-content: center;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            max-width: 800px;
            max-height: 60vh;
            aspect-ratio: 16/9;
            background: var(--bg-secondary);
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid var(--border-color);
            box-shadow: 0 0 40px var(--video-glow);
            transition: all 0.5s ease;
        }

        #videoElement {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .overlay-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-badge {
            background: var(--bg-secondary);
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-badge.offline {
            background: var(--bg-secondary);
            border-color: #ff0000;
            color: #ff0000;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        .timestamp {
            background: var(--bg-secondary);
            padding: 8px 16px;
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            color: var(--accent-color);
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .control-btn {
            padding: 12px 24px;
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            color: var(--primary-color);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-btn:hover {
            background: var(--bg-secondary);
            border-color: var(--primary-color);
            box-shadow: 0 0 20px var(--video-glow);
            transform: translateY(-2px);
        }

        .control-btn.active {
            background: var(--bg-secondary);
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        #startBtn {
            background: var(--primary-color);
            color: white;
            border-color: transparent;
            padding: 16px 32px;
            font-size: 16px;
            box-shadow: 0 4px 15px var(--video-glow);
        }

        #startBtn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px var(--video-glow);
        }

        .control-btn.recording {
            background: var(--bg-secondary);
            border-color: #ff0000;
            color: #ff0000;
            animation: recordingPulse 1s infinite;
        }

        @keyframes recordingPulse {

            0%,
            100% {
                box-shadow: 0 0 20px rgba(255, 0, 0, 0.3);
            }

            50% {
                box-shadow: 0 0 40px rgba(255, 0, 0, 0.6);
            }
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-top: 20px;
            width: 100%;
            max-width: 800px;
        }

        .stat-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .stat-label {
            font-size: 0.8em;
            color: var(--secondary-color);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 1.5em;
            font-weight: 700;
            color: var(--primary-color);
        }

        .no-camera {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--primary-color);
        }

        .no-camera-icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .no-camera h2 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .no-camera p {
            color: var(--secondary-color);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>📹 Camera Live Stream</h1>
            <div class="header-controls">
                <select class="theme-selector" id="themeSelector" onchange="changeTheme()">
                    <option value="neon">🎨 Neon</option>
                    <option value="cyberpunk">🌃 Cyberpunk</option>
                    <option value="dark">🌙 Dark</option>
                    <option value="purple">💜 Purple</option>
                    <option value="blue">💙 Blue</option>
                    <option value="green">💚 Green</option>
                    <option value="gold">🟡 Gold</option>
                    <option value="matrix">🟢 Matrix</option>
                </select>
            </div>
        </div>

        <div class="video-container">
            <div class="video-wrapper">
                <video id="videoElement" autoplay playsinline muted></video>
                <div class="overlay">
                    <div class="overlay-top">
                        <div class="status-badge" id="statusBadge">
                            <span class="status-dot"></span>
                            <span id="statusText">OFFLINE</span>
                        </div>
                    </div>
                    <div class="overlay-bottom">
                        <div class="timestamp" id="timestamp">00:00:00</div>
                    </div>
                </div>
                <div class="no-camera" id="noCamera"
                    style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: none;">
                    <div class="no-camera-icon">📹</div>
                    <h2>No Camera Found</h2>
                    <p>Please connect a camera and refresh page</p>
                </div>
            </div>

            <div class="controls">
                <button class="control-btn" id="startBtn" onclick="startCamera()">
                    <span>▶</span> Activate Camera
                </button>
                <button class="control-btn" id="stopBtn" onclick="stopCamera()" style="display: none;">
                    <span>⏹</span> Stop Camera
                </button>
                <button class="control-btn" id="screenshotBtn" onclick="takeScreenshot()" disabled>
                    <span>📸</span> Screenshot
                </button>
                <button class="control-btn" id="recordBtn" onclick="toggleRecording()" disabled>
                    <span>●</span> <span id="recordBtnText">Record</span>
                </button>
            </div>

            <div class="stats">
                <div class="stat-card">
                    <div class="stat-label">Resolution</div>
                    <div class="stat-value" id="resolution">-- x --</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">FPS</div>
                    <div class="stat-value" id="fps">--</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Duration</div>
                    <div class="stat-value" id="duration">00:00</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Status</div>
                    <div class="stat-value" id="streamStatus">OFFLINE</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentTheme = 'neon';

        function changeTheme() {
            const themeSelector = document.getElementById('themeSelector');
            const newTheme = themeSelector.value;

            document.documentElement.setAttribute('data-theme', newTheme);
            currentTheme = newTheme;

            localStorage.setItem('camera_theme', newTheme);
        }

        function loadTheme() {
            const savedTheme = localStorage.getItem('camera_theme');
            if (savedTheme) {
                document.documentElement.setAttribute('data-theme', savedTheme);
                document.getElementById('themeSelector').value = savedTheme;
                currentTheme = savedTheme;
            }
        }

        let videoElement = document.getElementById('videoElement');
        let stream = null;
        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;
        let recordingStartTime = null;
        let durationInterval = null;

        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                        facingMode: 'user'
                    },
                    audio: true
                });

                videoElement.srcObject = stream;
                videoElement.play();

                updateStatus('ONLINE');
                document.getElementById('startBtn').style.display = 'none';
                document.getElementById('stopBtn').style.display = 'flex';
                document.getElementById('screenshotBtn').disabled = false;
                document.getElementById('recordBtn').disabled = false;
                document.getElementById('noCamera').style.display = 'none';

                videoElement.onloadedmetadata = function () {
                    const width = videoElement.videoWidth;
                    const height = videoElement.videoHeight;
                    document.getElementById('resolution').textContent = `${width} x ${height}`;
                    document.getElementById('streamStatus').textContent = 'LIVE';
                };

                startFpsCounter();
            } catch (error) {
                console.error('Camera access error:', error);
                updateStatus('ERROR');
                document.getElementById('noCamera').style.display = 'flex';
                alert('Unable to access camera. Please allow camera permissions and try again.');
            }
        }

        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                videoElement.srcObject = null;
            }

            if (isRecording) {
                stopRecording();
            }

            updateStatus('OFFLINE');
            document.getElementById('startBtn').style.display = 'flex';
            document.getElementById('stopBtn').style.display = 'none';
            document.getElementById('screenshotBtn').disabled = true;
            document.getElementById('recordBtn').disabled = true;
            document.getElementById('resolution').textContent = '-- x --';
            document.getElementById('fps').textContent = '--';
            document.getElementById('streamStatus').textContent = 'OFFLINE';

            stopFpsCounter();
        }

        function updateStatus(status) {
            const statusBadge = document.getElementById('statusBadge');
            const statusText = document.getElementById('statusText');

            if (status === 'ONLINE') {
                statusBadge.classList.remove('offline');
                statusText.textContent = 'LIVE';
            } else if (status === 'OFFLINE') {
                statusBadge.classList.add('offline');
                statusText.textContent = 'OFFLINE';
            } else if (status === 'ERROR') {
                statusBadge.classList.add('offline');
                statusText.textContent = 'ERROR';
            }
        }

        function takeScreenshot() {
            const canvas = document.createElement('canvas');
            canvas.width = videoElement.videoWidth;
            canvas.height = videoElement.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(videoElement, 0, 0);

            const link = document.createElement('a');
            link.download = `screenshot_${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        function toggleRecording() {
            if (isRecording) {
                stopRecording();
            } else {
                startRecording();
            }
        }

        function startRecording() {
            recordedChunks = [];
            mediaRecorder = new MediaRecorder(stream);

            mediaRecorder.ondataavailable = function (e) {
                if (e.data.size > 0) {
                    recordedChunks.push(e.data);
                }
            };

            mediaRecorder.onstop = function () {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.download = `recording_${Date.now()}.webm`;
                link.href = url;
                link.click();
                URL.revokeObjectURL(url);
            };

            mediaRecorder.start(100);
            isRecording = true;
            recordingStartTime = Date.now();

            document.getElementById('recordBtn').classList.add('recording');
            document.getElementById('recordBtnText').textContent = 'Stop';

            startDurationCounter();
        }

        function stopRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;

                document.getElementById('recordBtn').classList.remove('recording');
                document.getElementById('recordBtnText').textContent = 'Record';

                stopDurationCounter();
            }
        }

        function startDurationCounter() {
            durationInterval = setInterval(() => {
                const elapsed = Date.now() - recordingStartTime;
                const seconds = Math.floor(elapsed / 1000);
                const minutes = Math.floor(seconds / 60);
                const secs = seconds % 60;
                document.getElementById('duration').textContent =
                    `${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            }, 1000);
        }

        function stopDurationCounter() {
            if (durationInterval) {
                clearInterval(durationInterval);
            }
        }

        let frameCount = 0;
        let fpsInterval = null;
        let lastFrameTime = performance.now();

        function startFpsCounter() {
            frameCount = 0;
            lastFrameTime = performance.now();
            fpsInterval = setInterval(() => {
                frameCount++;
                const currentTime = performance.now();
                const elapsed = currentTime - lastFrameTime;

                if (elapsed >= 1000) {
                    const fps = Math.round((frameCount * 1000) / elapsed);
                    document.getElementById('fps').textContent = fps;
                    frameCount = 0;
                    lastFrameTime = currentTime;
                }
            }, 100);
        }

        function stopFpsCounter() {
            if (fpsInterval) {
                clearInterval(fpsInterval);
                document.getElementById('fps').textContent = '--';
            }
        }

        function updateTimestamp() {
            const now = new Date();
            const time = now.toTimeString().split(' ')[0];
            document.getElementById('timestamp').textContent = time;
        }

        setInterval(updateTimestamp, 1000);
        updateTimestamp();
        loadTheme();
    </script>
</body>

</html>
