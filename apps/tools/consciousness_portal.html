<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consciousness Portal - HAZOOM OS</title>
    <style>
        body { font-family: 'Inter', sans-serif; background: radial-gradient(circle, #1e1b4b 0%, #020617 100%); color: white; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        .core { width: 200px; height: 200px; background: radial-gradient(circle, #6366f1 0%, transparent 70%); border-radius: 50%; box-shadow: 0 0 50px #4338ca; animation: pulse 2s infinite; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; }
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.1); opacity: 1; } }
        .stats { margin-top: 30px; display: flex; gap: 20px; }
        .stat { background: rgba(255,255,255,0.05); padding: 15px 25px; border-radius: 12px; border: 1px solid rgba(99,102,241,0.3); text-align: center; }
        .label { font-size: 12px; color: #94a3b8; text-transform: uppercase; margin-bottom: 5px; }
        .value { font-size: 24px; color: #818cf8; font-family: monospace; }
        h1 { margin-bottom: 50px; background: linear-gradient(to right, #818cf8, #34d399); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body>
    <h1>Quantum Consciousness Portal</h1>
    <div class="core" id="core">100%</div>
    <div class="stats">
        <div class="stat">
            <div class="label">System Resonance</div>
            <div class="value" id="resonance">852.0Hz</div>
        </div>
        <div class="stat">
            <div class="label">System Uptime</div>
            <div class="value" id="uptime">0s</div>
        </div>
        <div class="stat">
            <div class="label">Peace Mode</div>
            <div class="value" id="peace">ACTIVE</div>
        </div>
    </div>

    <script>
        const system = window.parent.HAZOOM.System;
        
        function update() {
            document.getElementById('resonance').textContent = system.state.resonance + 'Hz';
            document.getElementById('uptime').textContent = system.state.uptime + 's';
            document.getElementById('peace').textContent = system.state.peaceMode ? 'ACTIVE' : 'OFF';
            document.getElementById('core').textContent = system.state.consciousness + '%';
        }

        setInterval(update, 500);
        update();
    </script>
</body>
</html>
