<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAZOOM System Monitor</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#030308;color:#e8e8f0;font-family:'JetBrains Mono',monospace;height:100vh;overflow:hidden;display:flex;flex-direction:column}
.header{padding:12px 20px;border-bottom:1px solid rgba(16,185,129,0.15);display:flex;align-items:center;gap:12px}
.header h1{font-size:0.85rem;color:#10b981}
.main{display:flex;flex:1;overflow:hidden}
.sidebar{width:160px;border-right:1px solid rgba(255,255,255,0.06);padding:10px}
.sb-btn{width:100%;text-align:left;padding:7px 10px;margin-bottom:2px;background:transparent;border:none;border-radius:4px;color:rgba(255,255,255,0.5);font-size:0.7rem;cursor:pointer;font-family:inherit}
.sb-btn:hover{background:rgba(16,185,129,0.1);color:#10b981}
.sb-btn.active{background:rgba(16,185,129,0.15);color:#10b981}
.content{flex:1;display:flex;flex-direction:column;overflow:hidden}
.metrics-row{display:flex;gap:12px;padding:12px;border-bottom:1px solid rgba(255,255,255,0.06);flex-wrap:wrap}
.metric{flex:1;min-width:140px;padding:10px;background:rgba(255,255,255,0.02);border-radius:8px;position:relative;overflow:hidden}
.metric-label{font-size:0.6rem;color:rgba(255,255,255,0.4);margin-bottom:4px}
.metric-value{font-size:1.4rem;font-weight:700}
.metric-value.unavailable{color:#6b7280!important}
.metric-detail{font-size:0.55rem;color:rgba(255,255,255,0.3);margin-top:4px;line-height:1.4}
.metric-bar{height:3px;background:rgba(255,255,255,0.1);border-radius:2px;margin-top:6px;overflow:hidden}
.metric-bar-fill{height:100%;border-radius:2px;transition:width 0.5s}
.chart-wrap{height:140px;padding:12px;border-bottom:1px solid rgba(255,255,255,0.06)}
.chart-wrap canvas{width:100%;height:100%;display:block}
.panel{flex:1;overflow-y:auto;padding:12px}
table{width:100%;border-collapse:collapse;font-size:0.7rem}
th{text-align:left;padding:6px 10px;color:rgba(255,255,255,0.4);border-bottom:1px solid rgba(255,255,255,0.08);font-weight:400;position:sticky;top:0;background:#030308}
td{padding:6px 10px;border-bottom:1px solid rgba(255,255,255,0.03)}
.pid{color:#ffd700}
.mem{color:#8b5cf6}
.panel-message{color:rgba(255,255,255,0.55);font-size:0.7rem;line-height:1.7;padding:18px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);border-radius:6px}
.panel-message-title{color:#e8e8f0;font-size:0.8rem;margin-bottom:6px}
.panel-message.error{border-color:rgba(239,68,68,0.35);color:#fca5a5}
.panel-note{color:rgba(255,255,255,0.45);font-size:0.65rem;margin:2px 0 10px}
.kernel-summary{display:flex;gap:12px;padding:0 0 12px;flex-wrap:wrap}
.kernel-summary .metric{min-width:120px}
.status-ok{color:#10b981}
.status-offline{color:#ef4444}
.status-unavailable{color:#6b7280}
</style>
</head>
<body>
<div class="header">
    <h1>HAZOOM SYSTEM MONITOR</h1>
    <span style="font-size:0.65rem;color:rgba(255,255,255,0.3)" id="uptime-display">Uptime: Unavailable</span>
</div>
<div class="main">
    <div class="sidebar">
        <button class="sb-btn active" type="button" data-tab="overview">Overview</button>
        <button class="sb-btn" type="button" data-tab="processes">Processes</button>
        <button class="sb-btn" type="button" data-tab="network">Network</button>
        <button class="sb-btn" type="button" data-tab="storage">Storage</button>
        <button class="sb-btn" type="button" data-tab="kernel">Kernel</button>
    </div>
    <div class="content">
        <div class="metrics-row" id="metrics-row"></div>
        <div class="chart-wrap"><canvas id="chartCanvas"></canvas></div>
        <div class="panel" id="panel-area"></div>
    </div>
</div>
<script>
'use strict';

const REQUEST_TIMEOUT = 5000;
const MAX_HISTORY = 60;
const canvas = document.getElementById('chartCanvas');
const ctx = canvas.getContext('2d');
const tabButtons = Array.from(document.querySelectorAll('[data-tab]'));
const state = {
    metrics: null,
    metricsError: null,
    status: null,
    statusError: null,
    activeTab: 'overview',
    polling: false
};
let cpuHistory = [];
let memHistory = [];

function byId(id) {
    return document.getElementById(id);
}

function isRecord(value) {
    return value !== null && typeof value === 'object' && !Array.isArray(value);
}

function finiteNumber(value) {
    if (typeof value === 'boolean' || value === null || value === undefined) return null;
    if (typeof value === 'string' && value.trim() === '') return null;
    try {
        const number = Number(value);
        return Number.isFinite(number) ? number : null;
    } catch {
        return null;
    }
}

function firstFinite(...values) {
    for (const value of values) {
        const number = finiteNumber(value);
        if (number !== null) return number;
    }
    return null;
}

function firstBoolean(...values) {
    for (const value of values) {
        if (typeof value === 'boolean') return value;
    }
    return null;
}

function primitiveText(value) {
    if (value === null || value === undefined) return 'Unavailable';
    if (typeof value === 'object' || typeof value === 'function') return 'Unavailable';
    return String(value);
}

function formatNumber(value) {
    const number = finiteNumber(value);
    if (number === null) return 'Unavailable';
    return Number.isInteger(number) ? String(number) : number.toFixed(1);
}

function formatPercent(value) {
    const number = finiteNumber(value);
    return number === null ? 'Unavailable' : `${number.toFixed(1)}%`;
}

function formatBytes(value) {
    const number = finiteNumber(value);
    if (number === null) return 'Unavailable';
    const units = ['B', 'KB', 'MB', 'GB', 'TB'];
    let amount = Math.max(0, number);
    let unit = 0;
    while (amount >= 1024 && unit < units.length - 1) {
        amount /= 1024;
        unit += 1;
    }
    const digits = unit === 0 ? 0 : amount >= 100 ? 0 : amount >= 10 ? 1 : 2;
    return `${amount.toFixed(digits)} ${units[unit]}`;
}

function formatDuration(value) {
    const number = finiteNumber(value);
    if (number === null) return 'Unavailable';
    const totalSeconds = Math.max(0, Math.floor(number / 1000));
    const hours = Math.floor(totalSeconds / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;
    return `${hours}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
}

function getMetricColor(value, max) {
    const number = finiteNumber(value);
    const limit = finiteNumber(max);
    if (number === null || limit === null || limit <= 0) return '#6b7280';
    const ratio = Math.max(0, Math.min(1, number / limit));
    if (ratio < 0.5) return '#10b981';
    if (ratio < 0.8) return '#f59e0b';
    return '#ef4444';
}

function visualPercent(value) {
    const number = finiteNumber(value);
    return number === null ? null : Math.max(0, Math.min(100, number));
}

function statusColor(value) {
    if (value === true) return '#10b981';
    if (value === false) return '#ef4444';
    return '#6b7280';
}

function createElement(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
}

function metricCard(label, value, color, percentage, detail) {
    const card = createElement('div', 'metric');
    card.appendChild(createElement('div', 'metric-label', label));
    const valueNode = createElement('div', 'metric-value', value);
    valueNode.style.color = color;
    if (value === 'Unavailable') valueNode.classList.add('unavailable');
    card.appendChild(valueNode);
    const barValue = visualPercent(percentage);
    if (barValue !== null) {
        const bar = createElement('div', 'metric-bar');
        const fill = createElement('div', 'metric-bar-fill');
        fill.style.width = `${barValue}%`;
        fill.style.background = color;
        bar.appendChild(fill);
        card.appendChild(bar);
    }
    if (detail !== undefined && detail !== '') card.appendChild(createElement('div', 'metric-detail', detail));
    return card;
}

function normalizeMetrics(data) {
    if (!isRecord(data)) throw new Error('Invalid metrics response');
    const cpu = isRecord(data.cpu) ? data.cpu : {};
    const memory = isRecord(data.memory) ? data.memory : {};
    const cpuValue = firstFinite(cpu.utilization, cpu.percent, cpu.usage, isRecord(data.cpu) ? null : data.cpu);
    const memoryUsed = firstFinite(memory.used, memory.usedMemory, memory.usedBytes);
    const memoryTotal = firstFinite(memory.total, memory.totalMemory, memory.totalBytes);
    let memoryPercent = firstFinite(memory.usagePercent, memory.percent, memory.utilization);
    if (memoryPercent === null && memoryUsed !== null && memoryTotal !== null && memoryTotal > 0) {
        memoryPercent = (memoryUsed / memoryTotal) * 100;
    }
    const processCount = Array.isArray(data.processes) ? data.processes.length : firstFinite(data.processes, cpu.processCount);
    const uptime = firstFinite(data.uptimeMs, data.uptime);
    const missing = [];
    if (cpuValue === null) missing.push('CPU');
    if (memoryUsed === null) missing.push('memory usage');
    if (memoryTotal === null) missing.push('memory total');
    if (memoryPercent === null) missing.push('memory percentage');
    return {
        raw: data,
        cpu: cpuValue,
        memoryUsed,
        memoryTotal,
        memoryPercent,
        processCount,
        uptime,
        running: typeof data.running === 'boolean' ? data.running : null,
        scope: primitiveText(data.scope),
        timestamp: firstFinite(data.timestamp),
        missing
    };
}

function normalizeStatus(data) {
    if (!isRecord(data)) throw new Error('Invalid status response');
    const required = ['version', 'running', 'uptime', 'tickCount', 'readyQueue', 'blockedQueue'];
    const missing = required.filter(key => data[key] === null || data[key] === undefined);
    return { raw: data, missing };
}

function requestError(error) {
    if (error && error.name === 'AbortError') return 'Request timed out';
    if (error && error.message) return String(error.message);
    return 'Request failed';
}

async function fetchJson(path) {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), REQUEST_TIMEOUT);
    try {
        const response = await fetch(path, {
            cache: 'no-store',
            credentials: 'same-origin',
            headers: { Accept: 'application/json' },
            signal: controller.signal
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return await response.json();
    } finally {
        clearTimeout(timeout);
    }
}

function renderHeader() {
    const uptime = firstFinite(state.status && state.status.uptime, state.metrics && state.metrics.uptime);
    byId('uptime-display').textContent = `Uptime: ${formatDuration(uptime)}`;
}

function renderMetrics() {
    const row = byId('metrics-row');
    row.replaceChildren();
    const metrics = state.metrics;
    const status = state.status;
    const cpu = metrics ? metrics.cpu : null;
    const memoryUsed = metrics ? metrics.memoryUsed : null;
    const memoryTotal = metrics ? metrics.memoryTotal : null;
    const memoryPercent = metrics ? metrics.memoryPercent : null;
    const processCount = firstFinite(metrics && metrics.processCount, status && status.processCount);
    const ready = firstFinite(metrics && metrics.raw && metrics.raw.cpu && metrics.raw.cpu.readyQueue, status && status.readyQueue);
    const blocked = firstFinite(metrics && metrics.raw && metrics.raw.cpu && metrics.raw.cpu.blockedQueue, status && status.blockedQueue);
    const running = firstBoolean(
        status && status.running,
        metrics && metrics.running
    );
    const version = status ? primitiveText(status.version) : 'Unavailable';
    const cpuColor = getMetricColor(cpu, 100);
    const memoryColor = getMetricColor(memoryPercent, 100);
    const memoryValue = memoryUsed !== null
        ? formatBytes(memoryUsed)
        : memoryPercent !== null ? formatPercent(memoryPercent) : 'Unavailable';
    const memoryDetail = memoryUsed === null && memoryTotal === null
        ? memoryPercent === null ? 'Memory metrics unavailable' : `${formatPercent(memoryPercent)} reported; used and total unavailable`
        : `${memoryUsed === null ? 'Used unavailable' : formatBytes(memoryUsed)} / ${memoryTotal === null ? 'Total unavailable' : formatBytes(memoryTotal)}`;
    const processDetail = ready === null && blocked === null
        ? 'Queue metrics unavailable'
        : `Ready ${formatNumber(ready)} · Blocked ${formatNumber(blocked)}`;

    row.appendChild(metricCard('CPU', cpu === null ? 'Unavailable' : formatPercent(cpu), cpuColor, cpu, metrics ? metrics.scope : 'Metrics API unavailable'));
    row.appendChild(metricCard('MEMORY', memoryValue, memoryColor, memoryPercent, memoryDetail));
    row.appendChild(metricCard('PROCESS COUNT', formatNumber(processCount), '#a855f7', null, processDetail));
    row.appendChild(metricCard('KERNEL', running === null ? 'Unavailable' : running ? 'Running' : 'Offline', statusColor(running), null, version));
    row.appendChild(metricCard('NETWORK', 'Not collected', '#6b7280', null, 'No interface data collected'));
    row.appendChild(metricCard('STORAGE', 'Not collected', '#6b7280', null, 'No disk data collected'));
}

function resizeChart() {
    canvas.width = Math.max(1, canvas.offsetWidth);
    canvas.height = Math.max(1, canvas.offsetHeight);
}

window.addEventListener('resize', () => {
    resizeChart();
    drawChart();
});

function drawSeries(values, color) {
    if (!values.length || !ctx) return;
    const width = canvas.width;
    const height = canvas.height;
    const offset = MAX_HISTORY - values.length;
    ctx.beginPath();
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    values.forEach((value, index) => {
        const number = finiteNumber(value);
        if (number === null) return;
        const x = (offset + index) * (width / Math.max(1, MAX_HISTORY - 1));
        const y = height - (Math.max(0, Math.min(100, number)) / 100) * height;
        if (index === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
    });
    ctx.stroke();
    if (values.length === 1) {
        const number = finiteNumber(values[0]);
        if (number !== null) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(width, height - (Math.max(0, Math.min(100, number)) / 100) * height, 2, 0, Math.PI * 2);
            ctx.fill();
        }
    }
}

function drawChart() {
    if (!ctx) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    for (let index = 0; index < 5; index += 1) {
        const y = index * canvas.height / 4;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
    }
    if (!cpuHistory.length && !memHistory.length) {
        ctx.font = '10px JetBrains Mono';
        ctx.fillStyle = state.metricsError ? '#fca5a5' : 'rgba(255,255,255,0.4)';
        ctx.fillText(state.metricsError ? 'Metrics unavailable' : 'Waiting for metrics', 8, 24);
        return;
    }
    drawSeries(cpuHistory, '#10b981');
    drawSeries(memHistory, '#8b5cf6');
    ctx.font = '9px JetBrains Mono';
    ctx.fillStyle = '#10b981';
    ctx.fillText('● CPU', 8, 12);
    ctx.fillStyle = '#8b5cf6';
    ctx.fillText('● RAM', 60, 12);
    if (state.metricsError) {
        ctx.font = '9px JetBrains Mono';
        ctx.fillStyle = '#fca5a5';
        ctx.fillText('Last available samples', 8, canvas.height - 8);
    }
}

function renderPanelMessage(title, detail, error) {
    const panel = byId('panel-area');
    const message = createElement('div', `panel-message${error ? ' error' : ''}`);
    message.appendChild(createElement('div', 'panel-message-title', title));
    message.appendChild(createElement('div', '', detail));
    panel.appendChild(message);
}

function renderOverview() {
    const panel = byId('panel-area');
    panel.replaceChildren();
    let message = 'Live CPU and memory metrics are sourced from /api/system/metrics.';
    if (state.metricsError) message = `Metrics unavailable: ${state.metricsError}`;
    else if (state.statusError) message = `Kernel status unavailable: ${state.statusError}`;
    const box = createElement('div', 'panel-message');
    box.appendChild(createElement('div', 'panel-message-title', 'System overview'));
    box.appendChild(createElement('div', '', message));
    box.appendChild(createElement('div', '', 'Network and storage data are not collected by the available APIs.'));
    panel.appendChild(box);
}

function createTable(headers) {
    const table = createElement('table');
    const head = createElement('thead');
    const headRow = createElement('tr');
    headers.forEach(header => headRow.appendChild(createElement('th', '', header)));
    head.appendChild(headRow);
    table.appendChild(head);
    table.appendChild(createElement('tbody'));
    return table;
}

function addCell(row, value, className, color) {
    const cell = createElement('td', className || '', value);
    if (color) cell.style.color = color;
    row.appendChild(cell);
    return cell;
}

function processStateColor(value) {
    if (typeof value !== 'string') return '#6b7280';
    const stateName = value.toUpperCase();
    if (stateName === 'RUNNING') return '#10b981';
    if (stateName === 'BLOCKED' || stateName === 'WAITING') return '#f59e0b';
    if (stateName === 'TERMINATED') return '#ef4444';
    return '#06b6d4';
}

function availableProcesses() {
    if (state.status && Array.isArray(state.status.processes)) return state.status.processes;
    if (state.metrics && state.metrics.raw && Array.isArray(state.metrics.raw.processes)) return state.metrics.raw.processes;
    return null;
}

function renderProcesses() {
    const panel = byId('panel-area');
    panel.replaceChildren();
    const processes = availableProcesses();
    if (!processes) {
        const detail = state.statusError || state.metricsError || 'The available API responses did not include a process list.';
        renderPanelMessage('Process list unavailable', detail, true);
        return;
    }
    const source = state.status && Array.isArray(state.status.processes) ? '/api/status' : '/api/system/metrics';
    panel.appendChild(createElement('div', 'panel-note', `${processes.length} kernel process${processes.length === 1 ? '' : 'es'} reported by ${source}`));
    if (state.statusError && source === '/api/status') panel.appendChild(createElement('div', 'panel-note', state.statusError));
    if (state.metricsError && source === '/api/system/metrics') panel.appendChild(createElement('div', 'panel-note', state.metricsError));
    const table = createTable(['PID', 'PPID', 'Process', 'State', 'CPU time', 'Memory', 'Priority']);
    const body = table.querySelector('tbody');
    processes.forEach(process => {
        const row = createElement('tr');
        const source = isRecord(process) ? process : {};
        const pid = finiteNumber(source.pid);
        const ppid = finiteNumber(source.ppid);
        const cpuTime = finiteNumber(source.cpuTime);
        const priority = finiteNumber(source.priority);
        addCell(row, formatNumber(pid), 'pid');
        addCell(row, formatNumber(ppid));
        addCell(row, primitiveText(source.name));
        addCell(row, primitiveText(source.state), '', processStateColor(source.state));
        addCell(row, formatNumber(cpuTime));
        addCell(row, formatBytes(source.memory), 'mem');
        addCell(row, formatNumber(priority));
        body.appendChild(row);
    });
    if (!processes.length) {
        const row = createElement('tr');
        const cell = createElement('td', '', 'No kernel processes reported.');
        cell.colSpan = 7;
        row.appendChild(cell);
        body.appendChild(row);
    }
    panel.appendChild(table);
}

function renderNetwork() {
    const panel = byId('panel-area');
    panel.replaceChildren();
    renderPanelMessage('Network data is not collected', 'The available system APIs do not provide network interface, address, traffic, or error metrics.');
}

function renderStorage() {
    const panel = byId('panel-area');
    panel.replaceChildren();
    renderPanelMessage('Storage data is not collected', 'The available system APIs do not provide disk, mount, capacity, or filesystem metrics.');
}

function subsystemPresence(status, key) {
    return isRecord(status) && Object.prototype.hasOwnProperty.call(status, key) && status[key] !== null && status[key] !== false;
}

function renderKernel() {
    const panel = byId('panel-area');
    panel.replaceChildren();
    if (!state.status) {
        renderPanelMessage('Kernel status unavailable', state.statusError || 'The /api/status response is unavailable.', true);
        return;
    }
    const status = state.status;
    const running = typeof status.running === 'boolean' ? status.running : null;
    const summary = createElement('div', 'kernel-summary');
    summary.appendChild(metricCard('VERSION', primitiveText(status.version), '#ffd700'));
    summary.appendChild(metricCard('STATE', running === null ? 'Unavailable' : running ? 'Running' : 'Offline', statusColor(running), null, 'From /api/status'));
    summary.appendChild(metricCard('UPTIME', formatDuration(status.uptime), '#10b981'));
    summary.appendChild(metricCard('TICKS', formatNumber(status.tickCount), '#06b6d4'));
    summary.appendChild(metricCard('READY QUEUE', formatNumber(status.readyQueue), '#a855f7'));
    summary.appendChild(metricCard('BLOCKED QUEUE', formatNumber(status.blockedQueue), '#f59e0b'));
    panel.appendChild(summary);
    if (state.statusError) panel.appendChild(createElement('div', 'panel-note', state.statusError));

    const subsystemTable = createTable(['Subsystem', 'Presence']);
    const subsystemBody = subsystemTable.querySelector('tbody');
    const subsystems = [
        ['pascalEngine', 'Pascal engine'],
        ['consciousness', 'Consciousness'],
        ['qLearning', 'Q-Learning'],
        ['services', 'Services'],
        ['intelligence', 'Intelligence']
    ];
    subsystems.forEach(([key, label]) => {
        const row = createElement('tr');
        const loaded = subsystemPresence(status, key);
        addCell(row, label);
        addCell(row, loaded ? 'Loaded' : 'Not loaded', loaded ? 'status-ok' : 'status-unavailable');
        subsystemBody.appendChild(row);
    });
    panel.appendChild(subsystemTable);
}

function renderCurrentPanel() {
    if (state.activeTab === 'processes') renderProcesses();
    else if (state.activeTab === 'network') renderNetwork();
    else if (state.activeTab === 'storage') renderStorage();
    else if (state.activeTab === 'kernel') renderKernel();
    else renderOverview();
}

function setTab(tab, button) {
    const selected = button || tabButtons.find(candidate => candidate.dataset.tab === tab);
    tabButtons.forEach(candidate => candidate.classList.toggle('active', candidate === selected));
    state.activeTab = tab;
    renderCurrentPanel();
}

async function updateData() {
    if (state.polling) return;
    state.polling = true;
    const results = await Promise.allSettled([
        fetchJson('/api/system/metrics'),
        fetchJson('/api/status')
    ]);
    const metricsResult = results[0];
    const statusResult = results[1];
    if (metricsResult.status === 'fulfilled') {
        try {
            state.metrics = normalizeMetrics(metricsResult.value);
            state.metricsError = state.metrics.missing.length ? 'Incomplete metrics response' : null;
            if (finiteNumber(state.metrics.cpu) !== null) {
                cpuHistory.push(state.metrics.cpu);
                if (cpuHistory.length > MAX_HISTORY) cpuHistory.shift();
            }
            if (finiteNumber(state.metrics.memoryPercent) !== null) {
                memHistory.push(state.metrics.memoryPercent);
                if (memHistory.length > MAX_HISTORY) memHistory.shift();
            }
        } catch (error) {
            state.metrics = null;
            state.metricsError = requestError(error);
        }
    } else {
        state.metrics = null;
        state.metricsError = requestError(metricsResult.reason);
    }
    if (statusResult.status === 'fulfilled') {
        try {
            const normalized = normalizeStatus(statusResult.value);
            state.status = normalized.raw;
            state.statusError = normalized.missing.length ? 'Incomplete status response' : null;
        } catch (error) {
            state.status = null;
            state.statusError = requestError(error);
        }
    } else {
        state.status = null;
        state.statusError = requestError(statusResult.reason);
    }
    state.polling = false;
    renderHeader();
    renderMetrics();
    renderCurrentPanel();
    drawChart();
}

tabButtons.forEach(button => {
    button.addEventListener('click', () => setTab(button.dataset.tab, button));
});

resizeChart();
renderHeader();
renderMetrics();
setTab('overview', tabButtons[0]);
drawChart();
setInterval(updateData, 2000);
updateData();
</script>
</body>
</html>
