<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Focus Timer — Pomodoro</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0b0f1a; color: #c8d0e8; font-family: 'Courier New', monospace; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #app { text-align: center; position: relative; z-index: 2; }
  #timer { font-size: clamp(3rem, 12vw, 8rem); font-weight: 300; letter-spacing: 4px; margin-bottom: 8px; color: #0ff; text-shadow: 0 0 20px rgba(0,255,255,0.3); }
  #state { font-size: 18px; margin-bottom: 24px; color: #889; letter-spacing: 2px; }
  .btn { background: transparent; border: 1px solid #0ff; color: #0ff; padding: 10px 28px; font-family: inherit; font-size: 16px; cursor: pointer; letter-spacing: 2px; margin: 4px; transition: all .15s; }
  .btn:hover { background: rgba(0,255,255,0.08); box-shadow: 0 0 16px rgba(0,255,255,0.2); }
  .btn:active { transform: scale(0.97); }
  #controls { margin-top: 16px; }
  #stats { margin-top: 20px; font-size: 12px; color: #667; letter-spacing: 1px; }
  #glCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
  .hidden { display: none !important; }
  #exportModal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 10; }
  #exportModal.show { display: flex; }
  #exportBox { background: #0f1326; border: 1px solid #0ff; padding: 24px; min-width: 360px; max-width: 90vw; }
  #exportBox h3 { margin-bottom: 12px; color: #0ff; letter-spacing: 2px; }
  #exportBox textarea { width: 100%; height: 160px; background: #0a0e1a; color: #0ff; border: 1px solid #0ff; padding: 10px; font-family: monospace; resize: vertical; }
  #exportBox .actions { margin-top: 12px; text-align: right; }
  #exportBox .btn { font-size: 13px; }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,255,255,0.1); border: 1px solid #0ff; padding: 8px 16px; letter-spacing: 1px; display: none; z-index: 20; }
</style>
</head>
<body>
<canvas id="glCanvas"></canvas>
<div id="app">
  <div id="timer">00:00</div>
  <div id="state">Ready</div>
  <div id="controls">
    <button class="btn" id="btnStart">Start</button>
    <button class="btn" id="btnPause">Pause</button>
    <button class="btn" id="btnReset">Reset</button>
  </div>
  <div id="stats">Sessions: 0 • Total: 00:00</div>
</div>
<div id="exportModal"><div id="exportBox"><h3>Export Stats</h3><textarea id="exportData" readonly></textarea><div class="actions"><button class="btn" id="btnCopy">Copy</button><button class="btn" id="btnDownload">Download</button><button class="btn" id="btnCloseExport">Close</button></div></div></div>
<div id="toast"></div>
<script src="src/main.js"></script>
</body>
</html>
