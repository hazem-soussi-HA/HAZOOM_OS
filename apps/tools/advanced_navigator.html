<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Hazoom Navigator</title>
    <style>
        :root {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --secondary: #8b5cf6;
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: #475569;
            --success: #22c55e;
            --warning: #f59e0b;
            --error: #ef4444;
            --glass: rgba(15, 23, 42, 0.4);
            --glass-heavy: rgba(15, 23, 42, 0.8);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-accent: rgba(59, 130, 246, 0.4);
            --window-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --primary-glow: 0 0 20px rgba(59, 130, 246, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .navigator-header {
            background: var(--glass-heavy);
            backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--glass-border);
            padding: 12px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 100;
        }

        .address-bar {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .protocol-indicator {
            background: var(--bg-tertiary);
            padding: 8px 12px;
            border-radius: 6px 0 0 6px;
            font-size: 0.9rem;
            color: var(--text-secondary);
            border: 1px solid var(--border);
            border-right: none;
        }

        #urlInput {
            flex: 1;
            padding: 10px 15px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 0 6px 6px 0;
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
        }

        #urlInput:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .navigation-controls {
            display: flex;
            gap: 8px;
        }

        .nav-btn {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 12px;
            color: var(--text-primary);
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .nav-btn:hover {
            background: var(--primary);
            color: white;
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .ai-controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .ai-btn {
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            border: none;
            border-radius: 6px;
            padding: 8px 12px;
            color: white;
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .ai-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
        }

        .browser-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .tab-bar {
            background: var(--bg-secondary);
            padding: 8px 12px;
            display: flex;
            gap: 4px;
            overflow-x: auto;
            border-bottom: 1px solid var(--border);
        }

        .tab {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 6px 6px 0 0;
            padding: 6px 12px;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .tab.active {
            background: var(--bg-primary);
            border-bottom: 1px solid var(--bg-primary);
            margin-bottom: -1px;
        }

        .tab-close {
            color: var(--text-secondary);
            font-size: 0.7rem;
            cursor: pointer;
        }

        .tab-close:hover {
            color: var(--error);
        }

        .iframe-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        #webBrowser {
            width: 100%;
            height: 100%;
            border: none;
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--bg-tertiary);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .ai-insights-panel {
            background: var(--glass-heavy);
            backdrop-filter: blur(16px);
            border-top: 1px solid var(--glass-border);
            padding: 15px;
            max-height: 200px;
            overflow-y: auto;
        }

        .insights-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .insights-title {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .insight-item {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 8px;
            font-size: 0.85rem;
        }

        .insight-title {
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .insight-content {
            color: var(--text-secondary);
        }

        .status-bar {
            background: var(--bg-secondary);
            padding: 6px 12px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
            border-top: 1px solid var(--border);
        }

        .security-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .security-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .secure {
            background: var(--success);
        }

        .insecure {
            background: var(--error);
        }

        .search-suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-top: none;
            border-radius: 0 0 6px 6px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 100;
            display: none;
        }

        .suggestion-item {
            padding: 8px 12px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .suggestion-item:hover {
            background: var(--bg-tertiary);
        }

        .suggestion-highlight {
            color: var(--primary);
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="navigator-header">
        <div class="address-bar">
            <div class="protocol-indicator">https://</div>
            <input type="text" id="urlInput" placeholder="Enter URL or search query..." autocomplete="off">
            <div class="search-suggestions" id="searchSuggestions"></div>
        </div>
        
        <div class="navigation-controls">
            <button class="nav-btn" id="btnBack" title="Back">
                <span>←</span> Back
            </button>
            <button class="nav-btn" id="btnForward" title="Forward">
                <span>→</span> Forward
            </button>
            <button class="nav-btn" id="btnReload" title="Reload">
                <span>↻</span> Reload
            </button>
            <button class="nav-btn" id="btnHome" title="Home">
                <span>⌂</span> Home
            </button>
            <button class="nav-btn" id="btnNewTab" title="New Tab">
                <span>+</span> New Tab
            </button>
        </div>
        
        <div class="ai-controls">
            <button class="ai-btn" id="btnSummarize" title="Summarize Page">
                <span>📝</span> Summarize
            </button>
            <button class="ai-btn" id="btnTranslate" title="Translate">
                <span>🌐</span> Translate
            </button>
            <button class="ai-btn" id="btnExtract" title="Extract Info">
                <span>🔍</span> Extract
            </button>
            <button class="ai-btn" id="btnAskAI" title="Ask AI Assistant">
                <span>🤖</span> Ask AI
            </button>
            <button class="ai-btn" id="btnSaveBookmark" title="Save Bookmark">
                <span>⭐</span> Bookmark
            </button>
        </div>
    </div>
    
    <div class="browser-container">
        <div class="tab-bar" id="tabBar">
            <div class="tab active" data-tab="tab1">
                <span>🏠</span> New Tab
                <span class="tab-close" data-tab="tab1">×</span>
            </div>
        </div>
        
        <div class="iframe-container">
            <iframe id="webBrowser" src="about:blank" sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-modals allow-top-navigation-by-user-activation"></iframe>
            <div class="loading-overlay" id="loadingOverlay" style="display: none;">
                <div class="spinner"></div>
                <div class="loading-text">Loading page...</div>
            </div>
        </div>
        
        <div class="ai-insights-panel" id="aiInsightsPanel" style="display: none;">
            <div class="insights-header">
                <div class="insights-title">AI Insights</div>
                <button id="closeInsights" style="background: none; border: none; color: var(--text-secondary); cursor: pointer;">×</button>
            </div>
            <div id="insightsContent"></div>
        </div>
    </div>
    
    <div class="status-bar">
        <div class="security-indicator">
            <div class="security-dot secure" id="securityDot"></div>
            <span id="securityStatus">Secure Connection</span>
        </div>
        <div id="pageInfo">Ready</div>
    </div>

    <script>
        // Advanced Hazoom Navigator - Enhanced with AI and MCP capabilities
        class AdvancedNavigator {
            constructor() {
                this.tabs = {
                    'tab1': {
                        id: 'tab1',
                        url: 'about:blank',
                        title: 'New Tab',
                        active: true,
                        history: [],
                        currentIndex: -1
                    }
                };
                this.currentTabId = 'tab1';
                this.bookmarks = JSON.parse(localStorage.getItem('hazoom_bookmarks') || '[]');
                this.searchHistory = JSON.parse(localStorage.getItem('hazoom_search_history') || '[]');
                
                this.initializeElements();
                this.bindEvents();
                this.loadHomePage();
            }
            
            initializeElements() {
                this.elements = {
                    urlInput: document.getElementById('urlInput'),
                    webBrowser: document.getElementById('webBrowser'),
                    loadingOverlay: document.getElementById('loadingOverlay'),
                    btnBack: document.getElementById('btnBack'),
                    btnForward: document.getElementById('btnForward'),
                    btnReload: document.getElementById('btnReload'),
                    btnHome: document.getElementById('btnHome'),
                    btnNewTab: document.getElementById('btnNewTab'),
                    btnSummarize: document.getElementById('btnSummarize'),
                    btnTranslate: document.getElementById('btnTranslate'),
                    btnExtract: document.getElementById('btnExtract'),
                    btnAskAI: document.getElementById('btnAskAI'),
                    btnSaveBookmark: document.getElementById('btnSaveBookmark'),
                    tabBar: document.getElementById('tabBar'),
                    aiInsightsPanel: document.getElementById('aiInsightsPanel'),
                    insightsContent: document.getElementById('insightsContent'),
                    closeInsights: document.getElementById('closeInsights'),
                    securityDot: document.getElementById('securityDot'),
                    securityStatus: document.getElementById('securityStatus'),
                    pageInfo: document.getElementById('pageInfo'),
                    searchSuggestions: document.getElementById('searchSuggestions')
                };
            }
            
            bindEvents() {
                // Navigation events
                this.elements.btnBack.addEventListener('click', () => this.goBack());
                this.elements.btnForward.addEventListener('click', () => this.goForward());
                this.elements.btnReload.addEventListener('click', () => this.reloadPage());
                this.elements.btnHome.addEventListener('click', () => this.goHome());
                this.elements.btnNewTab.addEventListener('click', () => this.createNewTab());
                
                // URL input events
                this.elements.urlInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        this.navigateTo(this.elements.urlInput.value);
                    }
                });
                
                this.elements.urlInput.addEventListener('input', (e) => {
                    this.showSearchSuggestions(e.target.value);
                });
                
                // AI features
                this.elements.btnSummarize.addEventListener('click', () => this.summarizeCurrentPage());
                this.elements.btnTranslate.addEventListener('click', () => this.translateCurrentPage());
                this.elements.btnExtract.addEventListener('click', () => this.extractInformation());
                this.elements.btnAskAI.addEventListener('click', () => this.askAIAssistant());
                this.elements.btnSaveBookmark.addEventListener('click', () => this.saveBookmark());
                
                // Insights panel
                this.elements.closeInsights.addEventListener('click', () => {
                    this.elements.aiInsightsPanel.style.display = 'none';
                });
                
                // Tab events will be bound dynamically
                this.setupIframeEvents();
            }
            
            setupIframeEvents() {
                // Listen for iframe load events
                this.elements.webBrowser.addEventListener('load', () => {
                    this.handlePageLoad();
                });
                
                this.elements.webBrowser.addEventListener('error', () => {
                    this.handlePageError();
                });
            }
            
            loadHomePage() {
                this.navigateTo('https://www.google.com');
            }
            
            navigateTo(url) {
                // Validate and format URL
                let formattedUrl = this.formatUrl(url);
                
                if (!formattedUrl) {
                    this.showError('Invalid URL');
                    return;
                }
                
                // Show loading state
                this.elements.loadingOverlay.style.display = 'flex';
                
                // Update current tab
                const currentTab = this.tabs[this.currentTabId];
                if (currentTab.history.length > currentTab.currentIndex + 1) {
                    // If we're not at the end of history, truncate from current position
                    currentTab.history = currentTab.history.slice(0, currentTab.currentIndex + 1);
                }
                
                currentTab.history.push(formattedUrl);
                currentTab.currentIndex = currentTab.history.length - 1;
                currentTab.url = formattedUrl;
                
                // Update UI
                this.elements.urlInput.value = formattedUrl;
                this.updateNavigationButtons();
                this.updateSecurityIndicator(formattedUrl);
                
                // Load the page
                this.elements.webBrowser.src = formattedUrl;
                
                // Add to search history if it's a search query
                if (this.isSearchQuery(url)) {
                    this.addToSearchHistory(url);
                }
            }
            
            formatUrl(input) {
                if (!input.trim()) return null;
                
                // Check if it's a search query (contains spaces or common search patterns)
                if (this.isSearchQuery(input)) {
                    // Use search engine
                    return `https://www.google.com/search?q=${encodeURIComponent(input)}`;
                }
                
                // Check if it already has a protocol
                if (input.startsWith('http://') || input.startsWith('https://')) {
                    return input;
                }
                
                // Add https:// by default
                if (!input.includes('://')) {
                    return 'https://' + input;
                }
                
                return input;
            }
            
            isSearchQuery(input) {
                // If it contains spaces or common search operators, treat as search
                return input.trim().includes(' ') || 
                       input.includes('?') || 
                       input.includes('&') ||
                       input.toLowerCase().includes('the ') ||
                       input.toLowerCase().includes('what ') ||
                       input.toLowerCase().includes('how ') ||
                       input.toLowerCase().includes('where ') ||
                       input.toLowerCase().includes('who ');
            }
            
            addToSearchHistory(query) {
                // Add to search history
                if (!this.searchHistory.includes(query)) {
                    this.searchHistory.unshift(query);
                    // Keep only last 50 searches
                    if (this.searchHistory.length > 50) {
                        this.searchHistory = this.searchHistory.slice(0, 50);
                    }
                    localStorage.setItem('hazoom_search_history', JSON.stringify(this.searchHistory));
                }
            }
            
            showSearchSuggestions(input) {
                if (!input.trim()) {
                    this.elements.searchSuggestions.style.display = 'none';
                    return;
                }
                
                // Filter search history for suggestions
                const suggestions = this.searchHistory.filter(query => 
                    query.toLowerCase().includes(input.toLowerCase())
                ).slice(0, 8);
                
                if (suggestions.length > 0) {
                    this.elements.searchSuggestions.innerHTML = suggestions.map(suggestion => {
                        const highlighted = this.highlightMatch(suggestion, input);
                        return `<div class="suggestion-item" data-query="${suggestion}">${highlighted}</div>`;
                    }).join('');
                    
                    this.elements.searchSuggestions.style.display = 'block';
                    
                    // Add click handlers to suggestions
                    this.elements.searchSuggestions.querySelectorAll('.suggestion-item').forEach(item => {
                        item.addEventListener('click', () => {
                            const query = item.getAttribute('data-query');
                            this.elements.urlInput.value = query;
                            this.navigateTo(query);
                            this.elements.searchSuggestions.style.display = 'none';
                        });
                    });
                } else {
                    this.elements.searchSuggestions.style.display = 'none';
                }
            }
            
            highlightMatch(text, query) {
                const regex = new RegExp(`(${query})`, 'gi');
                return text.replace(regex, '<span class="suggestion-highlight">$1</span>');
            }
            
            handlePageLoad() {
                this.elements.loadingOverlay.style.display = 'none';
                
                // Update page info
                try {
                    const iframeDoc = this.elements.webBrowser.contentDocument || this.elements.webBrowser.contentWindow.document;
                    const title = iframeDoc.title || this.elements.urlInput.value;
                    this.updateTabTitle(this.currentTabId, title);
                    this.elements.pageInfo.textContent = `Loaded: ${title.substring(0, 50)}${title.length > 50 ? '...' : ''}`;
                } catch (e) {
                    // Cross-origin restriction - use URL as title
                    this.elements.pageInfo.textContent = `Loaded: ${this.elements.urlInput.value.substring(0, 50)}...`;
                }
                
                // Update security indicator
                this.updateSecurityIndicator(this.elements.urlInput.value);
            }
            
            handlePageError() {
                this.elements.loadingOverlay.style.display = 'none';
                this.showError('Failed to load page');
            }
            
            updateNavigationButtons() {
                const currentTab = this.tabs[this.currentTabId];
                
                this.elements.btnBack.disabled = currentTab.currentIndex <= 0;
                this.elements.btnForward.disabled = currentTab.currentIndex >= currentTab.history.length - 1;
            }
            
            updateSecurityIndicator(url) {
                const isSecure = url.startsWith('https://');
                
                if (isSecure) {
                    this.elements.securityDot.className = 'security-dot secure';
                    this.elements.securityStatus.textContent = 'Secure Connection';
                    this.elements.securityStatus.style.color = 'var(--success)';
                } else {
                    this.elements.securityDot.className = 'security-dot insecure';
                    this.elements.securityStatus.textContent = 'Not Secure';
                    this.elements.securityStatus.style.color = 'var(--error)';
                }
            }
            
            goBack() {
                const currentTab = this.tabs[this.currentTabId];
                
                if (currentTab.currentIndex > 0) {
                    currentTab.currentIndex--;
                    const url = currentTab.history[currentTab.currentIndex];
                    this.elements.webBrowser.src = url;
                    this.elements.urlInput.value = url;
                    this.updateNavigationButtons();
                }
            }
            
            goForward() {
                const currentTab = this.tabs[this.currentTabId];
                
                if (currentTab.currentIndex < currentTab.history.length - 1) {
                    currentTab.currentIndex++;
                    const url = currentTab.history[currentTab.currentIndex];
                    this.elements.webBrowser.src = url;
                    this.elements.urlInput.value = url;
                    this.updateNavigationButtons();
                }
            }
            
            reloadPage() {
                this.elements.webBrowser.src = this.elements.webBrowser.src;
            }
            
            goHome() {
                this.navigateTo('https://www.google.com');
            }
            
            createNewTab() {
                const tabId = `tab${Date.now()}`;
                
                this.tabs[tabId] = {
                    id: tabId,
                    url: 'about:blank',
                    title: 'New Tab',
                    active: true,
                    history: [],
                    currentIndex: -1
                };
                
                // Deactivate current tab
                this.tabs[this.currentTabId].active = false;
                
                // Set new tab as current
                this.currentTabId = tabId;
                
                // Update UI
                this.updateTabBar();
                this.navigateTo('about:blank');
            }
            
            updateTabBar() {
                this.elements.tabBar.innerHTML = '';
                
                Object.values(this.tabs).forEach(tab => {
                    const tabElement = document.createElement('div');
                    tabElement.className = `tab ${tab.active ? 'active' : ''}`;
                    tabElement.setAttribute('data-tab', tab.id);
                    tabElement.innerHTML = `
                        <span>${this.getFaviconForUrl(tab.url)}</span> 
                        ${tab.title}
                        <span class="tab-close" data-tab="${tab.id}">×</span>
                    `;
                    
                    tabElement.addEventListener('click', () => this.switchTab(tab.id));
                    this.elements.tabBar.appendChild(tabElement);
                });
                
                // Add close button events
                document.querySelectorAll('.tab-close').forEach(closeBtn => {
                    closeBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const tabId = closeBtn.getAttribute('data-tab');
                        this.closeTab(tabId);
                    });
                });
            }
            
            getFaviconForUrl(url) {
                if (url.includes('google.com')) return '🔍';
                if (url.includes('youtube.com')) return '📺';
                if (url.includes('github.com')) return '🐙';
                if (url.includes('wikipedia.org')) return '📚';
                if (url.includes('twitter.com')) return '🐦';
                if (url.includes('facebook.com')) return '📘';
                if (url.includes('reddit.com')) return '🔺';
                return '🌐';
            }
            
            updateTabTitle(tabId, title) {
                this.tabs[tabId].title = title.substring(0, 20) + (title.length > 20 ? '...' : '');
                
                if (tabId === this.currentTabId) {
                    // Update the active tab in the UI
                    const activeTab = document.querySelector(`.tab[data-tab="${tabId}"]`);
                    if (activeTab) {
                        activeTab.innerHTML = `
                            <span>${this.getFaviconForUrl(this.tabs[tabId].url)}</span> 
                            ${this.tabs[tabId].title}
                            <span class="tab-close" data-tab="${tabId}">×</span>
                        `;
                        
                        // Re-add event listener
                        activeTab.addEventListener('click', () => this.switchTab(tabId));
                        activeTab.querySelector('.tab-close').addEventListener('click', (e) => {
                            e.stopPropagation();
                            this.closeTab(tabId);
                        });
                    }
                }
            }
            
            switchTab(tabId) {
                // Deactivate current tab
                this.tabs[this.currentTabId].active = false;
                
                // Activate new tab
                this.currentTabId = tabId;
                this.tabs[tabId].active = true;
                
                // Update UI
                this.updateTabBar();
                
                // Load the tab's content
                if (this.tabs[tabId].history.length > 0) {
                    const url = this.tabs[tabId].history[this.tabs[tabId].currentIndex];
                    this.elements.webBrowser.src = url;
                    this.elements.urlInput.value = url;
                } else {
                    this.elements.webBrowser.src = 'about:blank';
                    this.elements.urlInput.value = '';
                }
                
                this.updateNavigationButtons();
            }
            
            closeTab(tabId) {
                if (Object.keys(this.tabs).length === 1) {
                    // Don't close the last tab
                    return;
                }
                
                delete this.tabs[tabId];
                
                if (tabId === this.currentTabId) {
                    // Switch to another tab
                    const remainingTabs = Object.keys(this.tabs);
                    if (remainingTabs.length > 0) {
                        this.currentTabId = remainingTabs[0];
                        this.tabs[this.currentTabId].active = true;
                    }
                }
                
                this.updateTabBar();
                
                // If we closed the current tab, load the new current tab
                if (tabId === this.currentTabId) {
                    const url = this.tabs[this.currentTabId].history[this.tabs[this.currentTabId].currentIndex] || 'about:blank';
                    this.elements.webBrowser.src = url;
                    this.elements.urlInput.value = url;
                    this.updateNavigationButtons();
                }
            }
            
            // AI Features
            async summarizeCurrentPage() {
                this.showAIInsight('Summarizing page content...', 'info');
                
                try {
                    // In a real implementation, this would use an AI service
                    // For now, we'll simulate the response
                    const summary = await this.simulateAIOperation('summarize');
                    
                    this.showAIInsight(summary, 'summary');
                } catch (error) {
                    this.showAIInsight(`Error summarizing page: ${error.message}`, 'error');
                }
            }
            
            async translateCurrentPage() {
                this.showAIInsight('Translating page content...', 'info');
                
                try {
                    const translation = await this.simulateAIOperation('translate');
                    
                    this.showAIInsight(translation, 'translation');
                } catch (error) {
                    this.showAIInsight(`Error translating page: ${error.message}`, 'error');
                }
            }
            
            async extractInformation() {
                this.showAIInsight('Extracting key information...', 'info');
                
                try {
                    const extraction = await this.simulateAIOperation('extract');
                    
                    this.showAIInsight(extraction, 'extraction');
                } catch (error) {
                    this.showAIInsight(`Error extracting information: ${error.message}`, 'error');
                }
            }
            
            async askAIAssistant() {
                const question = prompt('Ask the AI Assistant:');
                if (!question) return;
                
                this.showAIInsight(`AI thinking about: "${question}"`, 'info');
                
                try {
                    const response = await this.simulateAIOperation('answer', question);
                    
                    this.showAIInsight(response, 'answer');
                } catch (error) {
                    this.showAIInsight(`Error getting AI response: ${error.message}`, 'error');
                }
            }
            
            async simulateAIOperation(operation, query = '') {
                // Simulate AI processing delay
                await new Promise(resolve => setTimeout(resolve, 1500));
                
                const responses = {
                    summarize: `This page discusses web technologies and modern browser capabilities. Key topics include HTML5, CSS3, JavaScript ES6+, and web security. The content emphasizes user experience and performance optimization.`,
                    translate: `Translated content would appear here. This is a simulation of translation functionality that would connect to a real translation API in production.`,
                    extract: `Key entities extracted: Organizations (W3C, WHATWG), Technologies (HTML5, CSS3, JavaScript), Concepts (web standards, browser compatibility). Important dates: 1990 (first web browser), 1995 (Netscape Navigator), 2008 (Chrome debut).`,
                    answer: `Based on the current page content and your query "${query}", here's a helpful response. In a real implementation, this would connect to an AI service for accurate answers.`
                };
                
                return responses[operation] || 'Operation completed successfully.';
            }
            
            showAIInsight(content, type = 'info') {
                this.elements.aiInsightsPanel.style.display = 'block';
                
                const insightTypes = {
                    info: { icon: 'ℹ️', title: 'Information', color: 'var(--primary)' },
                    summary: { icon: '📝', title: 'Summary', color: 'var(--success)' },
                    translation: { icon: '🌐', title: 'Translation', color: 'var(--secondary)' },
                    extraction: { icon: '🔍', title: 'Extraction', color: 'var(--warning)' },
                    answer: { icon: '🤖', title: 'AI Answer', color: 'var(--primary)' },
                    error: { icon: '❌', title: 'Error', color: 'var(--error)' }
                };
                
                const insightType = insightTypes[type] || insightTypes.info;
                
                this.elements.insightsContent.innerHTML = `
                    <div class="insight-item">
                        <div class="insight-title" style="color: ${insightType.color}">
                            <span>${insightType.icon}</span> ${insightType.title}
                        </div>
                        <div class="insight-content">${content}</div>
                    </div>
                `;
            }
            
            saveBookmark() {
                const currentUrl = this.elements.urlInput.value;
                const title = this.tabs[this.currentTabId].title;
                
                if (!currentUrl || currentUrl === 'about:blank') {
                    this.showError('Cannot bookmark blank page');
                    return;
                }
                
                const bookmark = {
                    url: currentUrl,
                    title: title,
                    timestamp: new Date().toISOString()
                };
                
                // Check if already bookmarked
                const existingIndex = this.bookmarks.findIndex(b => b.url === currentUrl);
                if (existingIndex === -1) {
                    this.bookmarks.unshift(bookmark);
                    // Keep only last 100 bookmarks
                    if (this.bookmarks.length > 100) {
                        this.bookmarks = this.bookmarks.slice(0, 100);
                    }
                    localStorage.setItem('hazoom_bookmarks', JSON.stringify(this.bookmarks));
                    this.showAIInsight(`Bookmarked: ${title}`, 'info');
                } else {
                    this.showAIInsight(`Already bookmarked: ${title}`, 'info');
                }
            }
            
            showError(message) {
                this.showAIInsight(message, 'error');
            }
        }

        // Initialize the navigator when the page loads
        document.addEventListener('DOMContentLoaded', () => {
            window.navigatorInstance = new AdvancedNavigator();
            
            // Check for MCP integration
            if (window.parent && window.parent.mcp) {
                console.log('🔗 Connected to parent MCP Context Router');
                window.navigatorInstance.mcp = window.parent.mcp;
            } else {
                // Try to load MCP if not available
                const mcpScript = document.createElement('script');
                mcpScript.src = '../core/mcp_context_router.js';
                document.head.appendChild(mcpScript);
                
                mcpScript.onload = () => {
                    if (window.mcp) {
                        window.navigatorInstance.mcp = window.mcp;
                        console.log('🧬 Initialized local MCP Context Router');
                    }
                };
            }
        });
    </script>
</body>
</html>
