<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Settings - HAZOOM OS</title>
    <link rel="stylesheet" href="../hazoom-os.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: auto;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .header {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(59, 130, 246, 0.2);
        }
        .title {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #94a3b8;
        }
        .provider-section {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
        }
        .provider-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        .provider-icon {
            font-size: 32px;
        }
        .provider-name {
            font-size: 20px;
            font-weight: 600;
            color: #e2e8f0;
        }
        .provider-status {
            margin-left: auto;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .provider-status.connected {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }
        .provider-status.disconnected {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        .form-group {
            margin-bottom: 20px;
        }
        .label {
            display: block;
            margin-bottom: 8px;
            color: #94a3b8;
            font-size: 14px;
        }
        .input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 8px;
            color: #e2e8f0;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
        }
        .input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.2);
        }
        .select {
            width: 100%;
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 8px;
            color: #e2e8f0;
            font-size: 14px;
        }
        .button {
            padding: 10px 20px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .button:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 15px rgba(59, 130, 246, 0.3);
        }
        .button.secondary {
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(59, 130, 246, 0.3);
        }
        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .models-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }
        .model-tag {
            padding: 8px 12px;
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 6px;
            font-size: 12px;
            color: #3b82f6;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title">🔑 API Settings</div>
            <div class="subtitle">Configure your AI provider connections</div>
        </div>
        
        <div class="provider-section">
            <div class="provider-header">
                <div class="provider-icon">🤖</div>
                <div class="provider-name">OpenAI</div>
                <div class="provider-status disconnected">Not Connected</div>
            </div>
            <div class="form-group">
                <label class="label">API Key</label>
                <input type="password" class="input" placeholder="sk-...">
            </div>
            <div class="form-group">
                <label class="label">Default Model</label>
                <select class="select">
                    <option>GPT-4 Turbo</option>
                    <option>GPT-4</option>
                    <option>GPT-3.5 Turbo</option>
                </select>
            </div>
            <div class="buttons">
                <button class="button">Save & Connect</button>
                <button class="button secondary">Test Connection</button>
            </div>
        </div>
        
        <div class="provider-section">
            <div class="provider-header">
                <div class="provider-icon">🧠</div>
                <div class="provider-name">Anthropic</div>
                <div class="provider-status disconnected">Not Connected</div>
            </div>
            <div class="form-group">
                <label class="label">API Key</label>
                <input type="password" class="input" placeholder="sk-ant-...">
            </div>
            <div class="form-group">
                <label class="label">Default Model</label>
                <select class="select">
                    <option>Claude 3 Opus</option>
                    <option>Claude 3 Sonnet</option>
                    <option>Claude 3 Haiku</option>
                </select>
            </div>
            <div class="buttons">
                <button class="button">Save & Connect</button>
                <button class="button secondary">Test Connection</button>
            </div>
        </div>
        
        <div class="provider-section">
            <div class="provider-header">
                <div class="provider-icon">🔬</div>
                <div class="provider-name">Google</div>
                <div class="provider-status disconnected">Not Connected</div>
            </div>
            <div class="form-group">
                <label class="label">API Key</label>
                <input type="password" class="input" placeholder="AIza...">
            </div>
            <div class="form-group">
                <label class="label">Default Model</label>
                <select class="select">
                    <option>Gemini Pro</option>
                    <option>Gemini Ultra</option>
                </select>
            </div>
            <div class="buttons">
                <button class="button">Save & Connect</button>
                <button class="button secondary">Test Connection</button>
            </div>
        </div>
        
        <div class="provider-section">
            <div class="provider-header">
                <div class="provider-icon">💻</div>
                <div class="provider-name">Local (Ollama)</div>
                <div class="provider-status connected">Connected</div>
            </div>
            <div class="form-group">
                <label class="label">Ollama URL</label>
                <input type="text" class="input" value="http://localhost:11434">
            </div>
            <div class="form-group">
                <label class="label">Available Models</label>
                <div class="models-list">
                    <div class="model-tag">llama2</div>
                    <div class="model-tag">mistral</div>
                    <div class="model-tag">phi</div>
                    <div class="model-tag">qwen2.5</div>
                    <div class="model-tag">qwen2.5-coder</div>
                    <div class="model-tag">minimax</div>
                    <div class="model-tag">glm</div>
                </div>
            </div>
            <div class="buttons">
                <button class="button">Refresh Models</button>
                <button class="button secondary">Test Connection</button>
            </div>
        </div>
    </div>
</body>
</html>
