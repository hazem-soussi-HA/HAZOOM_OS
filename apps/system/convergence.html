<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Convergence — HAZOOM OS Value Benchmark</title>
<style>
  :root{
    --bg:#04060c; --panel:rgba(255,255,255,.028); --line:rgba(255,255,255,.07);
    --text:#e8f6ff; --dim:#7f95ab; --accent:#00e8ff; --good:#3ddc97; --warn:#ffc857; --bad:#ff6b6b;
    --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font:14px/1.6 system-ui,-apple-system,Segoe UI,sans-serif;padding:28px 22px 60px}
  .wrap{max-width:1080px;margin:0 auto}
  header{margin-bottom:26px;border-bottom:1px solid var(--line);padding-bottom:18px}
  h1{font-size:1.5rem;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
  h1 .hz-glyph{width:22px;height:22px;color:var(--accent);flex:0 0 22px}
  .sub{color:var(--dim);font-size:.82rem;margin-top:6px}
  .sub b{color:var(--accent);font-weight:600}
  h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.14em;color:var(--dim);margin:30px 0 12px;font-weight:600}

  /* headline: what is real right now */
  .hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:8px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px 16px}
  .stat .n{font:700 1.9rem/1 var(--mono);letter-spacing:-.02em}
  .stat .l{font-size:.7rem;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;margin-top:7px}
  .stat.ok .n{color:var(--good)} .stat.warn .n{color:var(--warn)} .stat.bad .n{color:var(--bad)}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px}
  .row{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04)}
  .row:last-child{border:0}
  .row .k{color:var(--dim);font-size:.84rem}
  .row .v{font:600 .88rem var(--mono);text-align:right;word-break:break-word}
  .v.ok{color:var(--good)} .v.warn{color:var(--warn)} .v.bad{color:var(--bad)} .v.dim{color:var(--dim)}

  /* bar meters */
  .meter{margin:9px 0}
  .meter .top{display:flex;justify-content:space-between;font-size:.8rem;margin-bottom:5px}
  .meter .lab{color:var(--dim)} .meter .num{font:600 .8rem var(--mono)}
  .bar{height:5px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--good));transition:width .5s ease}
  .bar.warn i{background:linear-gradient(90deg,var(--warn),var(--bad))}

  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .chip{font:600 .7rem var(--mono);padding:4px 9px;border-radius:20px;border:1px solid var(--line);color:var(--dim);background:rgba(255,255,255,.03)}
  .chip.live{color:var(--good);border-color:rgba(61,220,151,.4);background:rgba(61,220,151,.08)}
  .chip.active{color:#04060c;background:var(--accent);border-color:var(--accent)}
  .chip.down{color:var(--bad);border-color:rgba(255,107,107,.35);background:rgba(255,107,107,.07)}

  .note{font-size:.78rem;color:var(--dim);border-left:2px solid var(--line);padding-left:11px;margin-top:11px;line-height:1.55}
  code{font:.78rem var(--mono);background:rgba(255,255,255,.06);padding:1px 5px;border-radius:4px;color:var(--accent)}
  a{color:var(--accent)}
  .foot{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);font-size:.74rem;color:var(--dim)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1><svg class="hz-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2"/><circle cx="12" cy="4" r="1.6"/><circle cx="12" cy="20" r="1.6"/><circle cx="4" cy="12" r="1.6"/><circle cx="20" cy="12" r="1.6"/><path d="M12 6v4M12 14v4M6 12h4M14 12h4"/></svg> Convergence</h1>
  <div class="sub">HAZOOM OS value benchmark &mdash; every number measured live at <b id="ts">…</b>. Nothing here is asserted from a stored claim.</div>
</header>

<div id="out"><div class="card"><div class="row"><span class="k">measuring the live system…</span></div></div></div>

</div>
<script src="/core/icons.js"></script>
<script>
(async function(){
  const out = document.getElementById('out');
  const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  // The shell session token, if the desktop has one, so the benchmark is live.
  function token(){
    try{
      const raw = localStorage.getItem('hazoom_session') || localStorage.getItem('hz_token');
      if(raw) return raw.replace(/^"|"$/g,'');
    }catch(e){}
    return null;
  }

  function meter(label, val, cap, warnBelow){
    const pct = Math.max(0, Math.min(100, Math.round(val / cap * 100)));
    const warn = warnBelow != null && val < warnBelow;
    return `<div class="meter">
      <div class="top"><span class="lab">${esc(label)}</span><span class="num">${esc(val)} / ${esc(cap)}</span></div>
      <div class="bar${warn?' warn':''}"><i style="width:${pct}%"></i></div>
    </div>`;
  }
  const stat = (n, l, cls) => `<div class="stat ${cls||''}"><div class="n">${esc(n)}</div><div class="l">${esc(l)}</div></div>`;
  const row = (k, v, cls) => `<div class="row"><span class="k">${esc(k)}</span><span class="v ${cls||''}">${v}</span></div>`;

  let d, sf;
  try{
    const t = token();
    const h = t ? { headers:{ Authorization:'Bearer '+t } } : {};
    const [r1, r2] = await Promise.all([
      fetch('/api/benchmark', h),
      fetch('/api/surface', h)
    ]);
    if(!r1.ok) throw new Error('benchmark HTTP '+r1.status);
    d = await r1.json();
    sf = r2.ok ? await r2.json() : null;
  }catch(e){
    out.innerHTML = `<div class="card">${row('benchmark unavailable', esc(e.message)+' — log in through the desktop shell and reload', 'bad')}</div>`;
    return;
  }

  document.getElementById('ts').textContent = new Date(d.generatedAt).toLocaleTimeString();

  const s = d.score, k = d.kernel, i = d.intelligence, f = d.surface;
  const svcUp = f.services.up, svcTotal = f.services.configured;
  const xp = (d.siblings||[]).find(x => x.id === 'xp') || {};

  out.innerHTML = `
  <h2>What is real right now</h2>
  <div class="hero">
    ${stat(k.bootsInQemu ? 'BOOTS' : 'NO KERNEL', 'kernel', k.bootsInQemu?'ok':'bad')}
    ${stat(i.modelsInstalled, 'local models', i.modelsInstalled?'ok':'bad')}
    ${stat(svcUp + '/' + svcTotal, 'services up', svcUp===svcTotal?'ok':(svcUp?'warn':'bad'))}
    ${stat(sf ? sf.integrity + '%' : '—', 'promises kept', sf ? (sf.integrity===100?'ok':'warn') : '')}
    ${stat(sf ? sf.runningIntegrity + '%' : '—', 'apps usable now', sf ? (sf.runningIntegrity>=70?'ok':'warn') : '')}
    ${stat(f.nonLoopbackApps.length === 0 ? '100%' : 'LEAK', 'loopback-only', f.nonLoopbackApps.length===0?'ok':'bad')}
  </div>

  <h2>1 &middot; Kernel &mdash; is it a real OS?</h2>
  <div class="card">
    ${row('C kernel', esc(k.cKernel.lines) + ' lines in ' + k.cKernel.files + ' files')}
    ${row('subsystems', k.cKernel.subsystems.map(x=>'<code>'+x+'</code>').join(' '))}
    ${row('Pascal modules', esc(k.pascalModules.files) + ' files, ' + esc(k.pascalModules.lines) + ' lines')}
    ${row('last build', k.lastBuild ? esc(k.lastBuild.bytes.toLocaleString()) + ' bytes &middot; ' + esc(new Date(k.lastBuild.builtAt).toLocaleString()) : 'never built on this machine', k.lastBuild?'ok':'bad')}
    ${meter('kernel depth', k.cKernel.lines, 2500, 2000)}
    <div class="note">${esc(k.note)} This is measured from the binary on disk, not from a claim in a README. A kernel that has never linked scores zero here.</div>
  </div>

  <h2>2 &middot; Intelligence &mdash; can it think?</h2>
  <div class="card">
    ${row('active model', i.activeModel ? '<code>' + esc(i.activeModel) + '</code>' : 'none resolved', i.available?'ok':'bad')}
    ${row('available', i.available ? 'yes' : 'no &mdash; no responsive local model', i.available?'ok':'bad')}
    ${row('warm', esc(i.warm) + (i.warmMs!=null ? ' &middot; ' + i.warmMs + 'ms' : ''), i.warm==='ready'?'ok':'warn')}
    ${row('installed models', esc(i.modelsInstalled))}
    <div class="chips">${(i.models||[]).map(m=>'<span class="chip'+(m===i.activeModel?' active':'')+'">'+esc(m)+'</span>').join('')}</div>
    ${meter('intelligence depth', i.modelsInstalled, 12, 1)}
    <div class="note">${esc(i.note)}</div>
  </div>

  <h2>3 &middot; Surface &mdash; what is reachable</h2>
  <div class="card">
    ${row('apps registered', esc(f.totalApps) + ' across ' + f.categories.length + ' categories')}
    ${row('served by the OS itself', esc(f.fileApps) + ' file-based, ' + (f.loopbackApps - f.fileApps) + ' on loopback ports')}
    ${row('pointing off-machine', f.nonLoopbackApps.length ? f.nonLoopbackApps.map(esc).join('<br>') : 'none &mdash; every app resolves to this machine', f.nonLoopbackApps.length?'bad':'ok')}
    ${row('service icons', esc(f.icons.files) + ' tiles')}
    <div class="note">A relative path like <code>apps/ai-apps/x.html</code> is served by the OS on loopback, so it counts as local. Only a genuinely remote host counts as an egress risk.</div>
  </div>

  <h2>Services &mdash; probed, not declared</h2>
  <div class="card">
    ${f.services.detail.map(x => row(x.name, 'port ' + x.port + ' &middot; ' + (x.up ? 'UP' : 'DOWN'), x.up?'ok':'bad')).join('')}
    ${meter('service availability', svcUp, svcTotal || 1, svcTotal)}
    <div class="note">Every port above was opened at ${esc(new Date(d.generatedAt).toLocaleTimeString())}. A service that is down is reported down.</div>
  </div>

  <h2>The lineage &mdash; one OS, and what came before it</h2>
  <div class="card">
    ${row('HAZOOM OS &mdash; the product', esc(d.repo.trackedFiles.toLocaleString()) + ' tracked files, ' + d.repo.commits + ' commits', 'ok')}
    ${row('head', '<code>' + esc(d.repo.head) + '</code>')}
    ${row('HAZOOM XP &mdash; separate work', xp.present ? esc((xp.codeLines||0).toLocaleString()) + ' lines, ' + xp.commits + ' commits, 44 apps' : 'not reachable from this machine', xp.present?'ok':'dim')}
    ${row('XP licence', xp.license ? '<code>' + esc(xp.license) + '</code> &mdash; ' + esc(xp.relation || '') : '&mdash;')}
    ${row('superseded drafts', (d.history.archived || []).length + ' archived, read-only, nothing deleted', 'ok')}
    <div class="note">${esc(d.history.note)} Full reasoning in <code>docs/MIGRATION-XP.md</code> &mdash; including why no XP source was copied into this repository.</div>
  </div>

  ${sf ? `
  <h2>Surface &mdash; every promise, checked against the machine</h2>
  <div class="card">
    ${row('registry entries', esc(sf.total))}
    ${row('promises kept', sf.integrity + '% &mdash; entry points that resolve to something real', sf.integrity===100?'ok':'bad')}
    ${row('usable right now', sf.runningIntegrity + '%', sf.runningIntegrity>=70?'ok':'warn')}
    ${meter('promise integrity', sf.tally.live + sf.tally.present, sf.total, sf.total)}
    ${meter('usable right now', sf.tally.live, sf.total, sf.total)}
    <div class="note">A promise is kept if the app resolves to a file the OS serves or a port that answers.
    ${sf.broken.length ? `<b style="color:var(--bad)">${sf.broken.length} broken &mdash; these are real bugs:</b><br>` + sf.broken.map(a=>esc(a.name) + ' &mdash; ' + esc(a.reason)).join('<br>') : 'Nothing is broken.'}</div>
  </div>

  ${sf.notRunning.length ? `
  <h2>Built, not running &mdash; ${sf.notRunning.length}</h2>
  <div class="card">
    <div class="note" style="border:0;padding:0 0 10px 0">This is the honest middle category, and it is the one that matters most.
    <b>Half-built is not worthless.</b> Each of these has real code on disk and is one launch away from running &mdash;
    calling them "broken" is how a large body of work starts to feel like a lie.</div>
    ${sf.notRunning.map(a=>row(esc(a.name), esc(a.reason||'present'), 'warn')).join('')}
  </div>` : ''}` : ''}

  <h2>Learning &mdash; is the policy actually learning?</h2>
  ${(() => {
    const L = d.learning;
    if (!L || !L.present) return `<div class="card">${row('learner', 'not present', 'bad')}</div>`;
    if (L.error) return `<div class="card">${row('learner error', esc(L.error), 'bad')}</div>`;
    const since = L.recentReward;
    const before = L.avgReward;
    return `<div class="card">
    ${row('mode', esc(L.mode))}
    ${row('decisions', esc(L.totalDecisions.toLocaleString()) + ' &middot; ' + esc(L.statesExplored) + ' states, ' + esc(L.tabularUpdates.toLocaleString()) + ' tabular updates')}
    ${row('reward, now', '<span class="' + (since > before ? 'ok' : 'warn') + '">' + since + '</span> &nbsp;vs lifetime average ' + before)}
    ${row('total reward', esc(L.totalReward))}
    ${row('dqn', esc(L.dqnSteps.toLocaleString()) + ' steps &middot; loss ' + esc(L.dqnLoss))}
    ${row('actions', esc(L.actionsAvailable) + ' &mdash; executed for real, with rate limits and rollback')}
    <div class="note">${esc(L.note)} A policy handed a constant reward has no gradient to follow and cannot learn,
    however many transitions it accumulates &mdash; so the recent figure is the one that proves anything, not the lifetime average.</div>
  </div>`;
  })()}

  <div class="foot">
    Convergence score is deliberately conservative: only what is proven counts.
    A number here is measured from disk, git, the model registry or a live port probe at the moment you loaded this page.
  </div>`;
})();
</script>
</body>
</html>
