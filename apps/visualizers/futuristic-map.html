<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futuristic World Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Courier New', monospace;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(100,0,255,0.3) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(0,255,255,0.2) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(255,0,255,0.15) 0%, transparent 50%),
                linear-gradient(135deg, #0a0a2e 0%, #1a1a3e 30%, #0d0d1a 100%);
            min-height: 100vh;
            overflow: hidden;
            color: #0ff;
        }
        #futuristic-map {
            height: 100vh;
            width: 100%;
            position: relative;
        }
        .futuristic-header {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #ff0;
            font-size: 28px;
            text-shadow: 0 0 20px #ff0, 0 0 40px #ff0;
            z-index: 1000;
            text-align: center;
            letter-spacing: 3px;
            animation: glow 2s ease-in-out infinite alternate;
        }
        @keyframes glow {
            from { text-shadow: 0 0 10px #ff0, 0 0 20px #ff0; }
            to { text-shadow: 0 0 30px #ff0, 0 0 60px #ff0, 0 0 90px #ff0; }
        }
        .futuristic-panel {
            position: absolute;
            bottom: 30px;
            left: 30px;
            background: rgba(0,0,0,0.7);
            border: 1px solid #0ff;
            border-radius: 10px;
            padding: 20px;
            color: #0ff;
            z-index: 1000;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 30px rgba(0,255,255,0.3);
        }
        .system-futuristic {
            background: radial-gradient(circle, #ff0 0%, #f80 50%, #f00 100%);
            width: 14px;
            height: 14px;
            border-radius: 50%;
            box-shadow: 0 0 15px #ff0, 0 0 30px #f80;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.8; }
        }
        .laser-line {
            position: absolute;
            height: 2px;
            background: linear-gradient(90deg, transparent, #ff0, transparent);
            animation: laserMove 3s linear infinite;
            z-index: 1;
            pointer-events: none;
        }
        @keyframes laserMove {
            0% { left: -100%; top: 20%; }
            100% { left: 100%; top: 80%; }
        }
        .futuristic-controls {
            position: absolute;
            top: 100px;
            right: 20px;
            z-index: 1000;
        }
        .futuristic-btn {
            background: rgba(0,255,255,0.1);
            border: 1px solid #0ff;
            color: #0ff;
            padding: 8px 15px;
            margin: 5px;
            cursor: pointer;
            border-radius: 5px;
            font-family: inherit;
            font-size: 11px;
            transition: all 0.3s;
        }
        .futuristic-btn:hover {
            background: rgba(0,255,255,0.3);
            box-shadow: 0 0 20px rgba(0,255,255,0.5);
        }
    </style>
</head>
<body>
    <div id="futuristic-map">
        <div class="futuristic-header">⚡ FUTURISTIC WORLD MAP ⚡</div>
        <div class="laser-line"></div>
        <div class="futuristic-panel">
            <h3 style="color:#ff0; margin-bottom:10px;">🌌 SYSTEM STATUS</h3>
            <p>🌍 Active Systems: <span id="active-systems">0</span></p>
            <p>⚡ Power Grid: <span id="power-level">0</span>%</p>
            <p>🛰️ Satellites: <span id="satellites">0</span></p>
            <p>🔮 Quantum Link: <span id="quantum-status">ACTIVE</span></p>
        </div>
        <div class="futuristic-controls">
            <button class="futuristic-btn" onclick="toggleScan()">SCAN</button>
            <button class="futuristic-btn" onclick="boostPower()">BOOST</button>
            <button class="futuristic-btn" onclick="showAll()">ALL</button>
        </div>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const futuristicMap = L.map('futuristic-map', {
            center: [0, 0],
            zoom: 2,
            minZoom: 1,
            maxZoom: 10,
            fadeAnimation: true
        });

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '',
            opacity: 0.6
        }).addTo(futuristicMap);

        const futuristicSystems = [
            {name: "Neo-Tokyo", coords: [35.7, 139.7], power: 95, type: "mega-city"},
            {name: "New Berlin", coords: [52.5, 13.4], power: 88, type: "arcology"},
            {name: "Cyber-Paris", coords: [48.9, 2.3], power: 82, type: "technopolis"},
            {name: "Silicon Valley", coords: [37.4, -122.1], power: 91, type: "data-hub"},
            {name: "Mega-London", coords: [51.5, -0.1], power: 85, type: "corpo-city"},
            {name: "Neo-Moscow", coords: [55.8, 37.6], power: 78, type: "federal-district"},
            {name: "Solaris-9", coords: [15.3, -45.7], power: 72, type: "orbital-station"},
            {name: "Quantum-Haven", coords: [-33.9, 18.4], power: 65, type: "research-facility"},
            {name: "Void-Station", coords: [0, 0], power: 55, type: "deep-space"},
            {name: "Eclipse-City", coords: [-12.0, -77.0], power: 48, type: "shadow-zone"},
            {name: "Nova-Prime", coords: [34.1, -118.2], power: 89, type: "alpha-colony"},
            {name: "Zenith-7", coords: [41.9, 12.5], power: 76, type: "zenith-tower"}
        ];

        const systemMarkers = [];

        futuristicSystems.forEach((system, index) => {
            const icon = L.divIcon({
                className: 'system-futuristic',
                iconSize: [14, 14],
                iconAnchor: [7, 7]
            });
            
            const marker = L.marker(system.coords, { icon, zIndexOffset: 1000 })
                .addTo(futuristicMap)
                .bindPopup(`<b style="color:#ff0">${system.name}</b><br>Type: ${system.type}<br>Power: ${system.power}%`);
            
            systemMarkers.push(marker);

            marker.on('mouseover', function() {
                this.openPopup();
                this._icon.style.filter = 'brightness(1.5)';
            });
            
            marker.on('mouseout', function() {
                this._icon.style.filter = 'brightness(1)';
            });
        });

        document.getElementById('active-systems').textContent = futuristicSystems.length;
        document.getElementById('power-level').textContent = 
            futuristicSystems.reduce((sum, s) => sum + s.power, 0) / futuristicSystems.length;
        document.getElementById('satellites').textContent = futuristicSystems.length * 3;

        let scanMode = false;
        function toggleScan() {
            scanMode = !scanMode;
            if (scanMode) {
                document.querySelectorAll('.system-marker').forEach(m => m.style.animation = 'pulse 0.5s infinite');
            } else {
                document.querySelectorAll('.system-marker').forEach(m => m.style.animation = '');
            }
        }

        function boostPower() {
            futuristicSystems.forEach(s => s.power = Math.min(100, s.power + 5));
            document.getElementById('power-level').textContent = 
                futuristicSystems.reduce((sum, s) => sum + s.power, 0) / futuristicSystems.length;
        }

        function showAll() {
            futuristicMap.fitBounds(futuristicSystems.map(s => s.coords));
        }

        setInterval(() => {
            document.querySelectorAll('.system-marker').forEach(m => {
                m.style.opacity = Math.random();
            });
        }, 2000);
    </script>
</body>
</html>
