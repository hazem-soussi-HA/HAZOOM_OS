<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Human Energy Construct — HAZOOM Visualizer</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div id="app">
        <header class="header">
            <h1>Human Energy Construct</h1>
            <div class="status" id="status">Initializing...</div>
        </header>

        <main class="main-content">
            <div id="canvas-container"></div>

            <aside class="control-panel">
                <section class="layer-controls">
                    <h2>Energy Layers</h2>
                    <label class="toggle">
                        <input type="checkbox" id="toggle-aura" checked>
                        <span class="slider"></span>
                        Aura Field
                    </label>
                    <label class="toggle">
                        <input type="checkbox" id="toggle-nervous" checked>
                        <span class="slider"></span>
                        Nervous System
                    </label>
                    <label class="toggle">
                        <input type="checkbox" id="toggle-heart" checked>
                        <span class="slider"></span>
                        Heart Coherence
                    </label>
                    <label class="toggle">
                        <input type="checkbox" id="toggle-intention" checked>
                        <span class="slider"></span>
                        Intention Field
                    </label>
                    <label class="toggle">
                        <input type="checkbox" id="toggle-telepathy">
                        <span class="slider"></span>
                        Telepathic Resonance
                    </label>
                </section>

                <section class="intention-control">
                    <h2>Intention Input</h2>
                    <textarea id="intention-text" placeholder="Enter intention..."></textarea>
                    <button id="apply-intention" class="btn-primary">Apply Intention</button>
                    <div id="intention-feedback"></div>
                </section>

                <section class="info-panel">
                    <h2>Construct Status</h2>
                    <div id="status-details"></div>
                </section>
            </aside>
        </main>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "./vendor/three.module.js",
            "three/addons/": "./vendor/three/addons/"
        }
    }
    </script>
    <script type="module" src="./app.js"></script>
</body>
</html>
