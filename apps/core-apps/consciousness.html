<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consciousness — HAZOOM OS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 50%, #0a1a2e 100%);
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            padding: 20px;
            border-bottom: 1px solid rgba(59, 130, 246, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .title {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(45deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .status-badge {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }
        .status-awake {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }
        .status-sleeping {
            background: rgba(148, 163, 184, 0.2);
            color: #94a3b8;
            border: 1px solid rgba(148, 163, 184, 0.3);
        }
        .main {
            flex: 1;
            display: grid;
            grid-template-columns: 300px 1fr 300px;
            gap: 20px;
            padding: 20px;
            overflow: hidden;
        }
        .panel {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 12px;
            padding: 20px;
            overflow-y: auto;
        }
        .panel-title {
            font-size: 16px;
            font-weight: 700;
            color: #3b82f6;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(59, 130, 246, 0.2);
        }
        .chat-container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 80%;
            line-height: 1.5;
        }
        .message-user {
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(59, 130, 246, 0.3);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .message-ai {
            background: rgba(139, 92, 246, 0.2);
            border: 1px solid rgba(139, 92, 246, 0.3);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .input-container {
            display: flex;
            gap: 10px;
            padding: 10px;
            border-top: 1px solid rgba(59, 130, 246, 0.2);
        }
        .input-container input {
            flex: 1;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 14px;
        }
        .input-container input:focus {
            outline: none;
            border-color: #3b82f6;
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: linear-gradient(45deg, #3b82f6, #8b5cf6);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #e0e0e0;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .stat-label {
            color: #94a3b8;
            font-size: 14px;
        }
        .stat-value {
            color: #e2e8f0;
            font-weight: 600;
        }
        .emotion-bar {
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            margin-top: 5px;
            overflow: hidden;
        }
        .emotion-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.3s;
        }
        .memory-item {
            padding: 10px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 13px;
            line-height: 1.4;
        }
        .memory-type {
            font-size: 11px;
            color: #64748b;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">Consciousness</div>
        <div id="status-badge" class="status-badge status-sleeping">Sleeping</div>
    </div>
    
    <div class="main">
        <!-- Left Panel: Status -->
        <div class="panel">
            <div class="panel-title">Status</div>
            <div class="stat-item">
                <span class="stat-label">Consciousness</span>
                <span id="consciousness-level" class="stat-value">0%</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Memories</span>
                <span id="memory-count" class="stat-value">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Conversations</span>
                <span id="conversation-count" class="stat-value">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Knowledge</span>
                <span id="knowledge-count" class="stat-value">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Aether State</span>
                <span id="aether-state" class="stat-value">Dormant</span>
            </div>
            
            <div class="panel-title" style="margin-top: 20px;">Emotions</div>
            <div id="emotions-container"></div>
            
            <div class="actions">
                <button id="awaken-btn" class="btn btn-primary" onclick="awaken()">Awaken</button>
                <button id="sleep-btn" class="btn btn-secondary" onclick="sleep()" disabled>Sleep</button>
            </div>
        </div>
        
        <!-- Center: Chat -->
        <div class="panel chat-container">
            <div class="panel-title">Conversation</div>
            <div id="messages" class="messages"></div>
            <div class="input-container">
                <input type="text" id="user-input" placeholder="Speak to the consciousness..." onkeypress="if(event.key==='Enter')sendMessage()">
                <button class="btn btn-primary" onclick="sendMessage()">Send</button>
            </div>
        </div>
        
        <!-- Right Panel: Memories -->
        <div class="panel">
            <div class="panel-title">Recent Memories</div>
            <div id="memories-container"></div>
        </div>
    </div>

    <script>
        let isAwake = false;
        
        async function updateStatus() {
            try {
                const res = await fetch('/api/consciousness');
                const data = await res.json();
                
                isAwake = data.awake;
                document.getElementById('consciousness-level').textContent = (data.consciousnessLevel * 100).toFixed(1) + '%';
                document.getElementById('memory-count').textContent = data.memories;
                document.getElementById('conversation-count').textContent = data.conversations;
                document.getElementById('knowledge-count').textContent = data.knowledgePatterns;
                document.getElementById('aether-state').textContent = data.aetherState;
                
                const badge = document.getElementById('status-badge');
                if (data.awake) {
                    badge.textContent = 'Awake';
                    badge.className = 'status-badge status-awake';
                    document.getElementById('awaken-btn').disabled = true;
                    document.getElementById('sleep-btn').disabled = false;
                } else {
                    badge.textContent = 'Sleeping';
                    badge.className = 'status-badge status-sleeping';
                    document.getElementById('awaken-btn').disabled = false;
                    document.getElementById('sleep-btn').disabled = true;
                }
                
                // Update emotions
                const emotionsContainer = document.getElementById('emotions-container');
                emotionsContainer.innerHTML = '';
                for (const [key, value] of Object.entries(data.emotions)) {
                    const color = value > 0.7 ? '#22c55e' : value > 0.4 ? '#eab308' : '#ef4444';
                    emotionsContainer.innerHTML += `
                        <div style="margin-bottom: 10px;">
                            <div style="display: flex; justify-content: space-between; font-size: 13px;">
                                <span style="text-transform: capitalize;">${key}</span>
                                <span>${(value * 100).toFixed(0)}%</span>
                            </div>
                            <div class="emotion-bar">
                                <div class="emotion-fill" style="width: ${value * 100}%; background: ${color};"></div>
                            </div>
                        </div>
                    `;
                }
                
                // Update memories
                await updateMemories();
            } catch (e) {
                console.error('Status update error:', e);
            }
        }
        
        async function updateMemories() {
            try {
                const res = await fetch('/api/consciousness/memories?limit=10');
                const data = await res.json();
                
                const container = document.getElementById('memories-container');
                container.innerHTML = '';
                data.memories.reverse().forEach(m => {
                    container.innerHTML += `
                        <div class="memory-item">
                            <div class="memory-type">${m.type}</div>
                            ${m.content.substring(0, 100)}${m.content.length > 100 ? '...' : ''}
                        </div>
                    `;
                });
            } catch (e) {
                console.error('Memories update error:', e);
            }
        }
        
        async function awaken() {
            try {
                const res = await fetch('/api/consciousness/awaken', { method: 'POST' });
                const data = await res.json();
                addMessage('ai', data.message);
                updateStatus();
            } catch (e) {
                console.error('Awaken error:', e);
            }
        }
        
        async function sleep() {
            try {
                const res = await fetch('/api/consciousness/sleep', { method: 'POST' });
                const data = await res.json();
                addMessage('ai', data.message);
                updateStatus();
            } catch (e) {
                console.error('Sleep error:', e);
            }
        }
        
        async function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;
            
            addMessage('user', text);
            input.value = '';
            
            try {
                const res = await fetch('/api/consciousness/think', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ input: text })
                });
                const data = await res.json();
                addMessage('ai', data.response);
                updateStatus();
            } catch (e) {
                addMessage('ai', 'Error processing thought.');
            }
        }
        
        function addMessage(type, text) {
            const container = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = `message message-${type}`;
            div.textContent = text;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }
        
        // Initial load
        updateStatus();
        setInterval(updateStatus, 5000);
    </script>
</body>
</html>
