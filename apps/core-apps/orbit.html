<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orbit — HAZOOM OS</title>
<style>
:root{
  --bg:#0a0c10; --bg2:#0e1117; --p1:#141821; --p2:#1a1f2a; --p3:#222836;
  --line:#242a36; --line2:#2f3646;
  --fg:#e8ecf2; --dim:#8b95a6; --dim2:#5b6474;
  --cy:#22d3ee; --cy-d:#0e7490; --or:#fb923c; --gr:#34d399; --am:#fbbf24;
  --rd:#f87171; --vi:#a78bfa; --bl:#60a5fa;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
  --rail:248px; --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.55 var(--sans);overflow:hidden;
     -webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:var(--cy);text-decoration:none}
.hidden{display:none!important}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--p3);border-radius:9px}
::-webkit-scrollbar-thumb:hover{background:var(--line2)}
::-webkit-scrollbar-track{background:transparent}

/* ── shell ─────────────────────────────────────────── */
#app{display:grid;grid-template-columns:var(--rail) 1fr;height:100vh;
     transition:grid-template-columns .32s var(--ease)}
#app.narrow{--rail:0px}

/* ── rail: vertical tabs ────────────────────────────── */
#rail{background:var(--bg2);border-right:1px solid var(--line);overflow:hidden;
      display:flex;flex-direction:column;width:248px}
#rail.collapsed{width:0;border:0}
#app.narrow #rail{border:0}
.rt{padding:12px 12px 8px;display:flex;align-items:center;gap:9px;flex:0 0 auto}
.rt .logo{width:26px;height:26px;border-radius:8px;flex:0 0 auto;
          background:linear-gradient(135deg,var(--or),var(--cy));display:grid;place-items:center;
          color:#0a0c10;font:700 12px var(--mono)}
.rt b{font:600 13.5px var(--sans);letter-spacing:-.01em}
.rt .sp{flex:1}
.iconbtn{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--dim);
         transition:.15s}
.iconbtn:hover{background:var(--p2);color:var(--fg)}
#tabs{flex:1;overflow-y:auto;padding:0 8px 8px}
.tab{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:9px;cursor:pointer;
     color:var(--dim);transition:.15s;position:relative;margin-bottom:2px}
.tab:hover{background:var(--p1);color:var(--fg)}
.tab.on{background:var(--p2);color:var(--fg)}
.tab.on::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);
                width:2.5px;height:17px;background:var(--cy);border-radius:3px}
.tab .fav{width:15px;height:15px;border-radius:4px;flex:0 0 auto;display:grid;place-items:center;
          font:10px var(--mono);background:var(--p3);color:var(--dim2)}
.tab.on .fav{background:var(--cy-d);color:#cffafe}
.tab .t{flex:1;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab .x{width:17px;height:17px;border-radius:5px;display:grid;place-items:center;opacity:0;
       color:var(--dim2);font-size:13px;transition:.12s}
.tab:hover .x{opacity:1}
.tab .x:hover{background:var(--p3);color:var(--rd)}
.spaces{padding:8px 12px;border-top:1px solid var(--line);flex:0 0 auto}
.spaces .lbl{font:9.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--dim2);
             margin-bottom:7px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:20px;
      background:var(--p1);border:1px solid var(--line);font:10.5px var(--mono);color:var(--dim);
      margin:0 4px 4px 0;cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--line2);color:var(--fg)}
.chip.on{background:rgba(34,211,238,.1);border-color:var(--cy-d);color:var(--cy)}

/* ── main ──────────────────────────────────────────── */
#main{display:flex;flex-direction:column;overflow:hidden;position:relative}

/* top bar: floating pill */
#top{flex:0 0 auto;padding:11px 16px 8px;display:flex;align-items:center;gap:10px}
#top .sp{width:14px;height:14px;flex:0 0 auto;cursor:pointer;color:var(--dim);
         display:grid;place-items:center;border-radius:5px;transition:.15s}
#top .sp:hover{background:var(--p1);color:var(--fg)}
.nav{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--dim);
     transition:.15s;flex:0 0 auto}
.nav:hover:not(:disabled){background:var(--p1);color:var(--fg)}
.nav:disabled{opacity:.25;cursor:default}
#omni{flex:1;display:flex;align-items:center;gap:9px;height:38px;padding:0 13px;
      background:var(--p1);border:1px solid var(--line);border-radius:19px;transition:.2s var(--ease);
      max-width:720px;margin:0 auto}
#omni:hover{border-color:var(--line2)}
#omni:focus-within{border-color:var(--cy-d);background:var(--bg2);
                   box-shadow:0 0 0 4px rgba(34,211,238,.08),0 6px 24px rgba(0,0,0,.4)}
#omni .lock{color:var(--gr);font-size:12px}
#omni .scheme{font:11.5px var(--mono);color:var(--cy);flex:0 0 auto}
#url{flex:1;background:none;border:0;outline:none;font-size:13.5px}
#url::placeholder{color:var(--dim2)}
.kbd{font:10.5px var(--mono);color:var(--dim2);background:var(--p2);border:1px solid var(--line);
     padding:2px 6px;border-radius:5px;white-space:nowrap}

/* ── view ──────────────────────────────────────────── */
#view{flex:1;overflow-y:auto;padding:0 0 46px}
.page{max-width:900px;margin:0 auto;padding:26px 30px}
.page.wide{max-width:1180px}
h1{font-size:29px;letter-spacing:-.022em;font-weight:680;margin-bottom:5px}
h2{font-size:15px;margin:26px 0 11px;font-weight:600;letter-spacing:-.01em}
.lede{color:var(--dim);font-size:15px;margin-bottom:4px}
.mut{color:var(--dim2);font-size:12.5px}
.hero{background:linear-gradient(135deg,rgba(34,211,238,.06),rgba(251,146,60,.05));
      border:1px solid var(--line);border-radius:14px;padding:24px 26px;margin-bottom:22px}
.grid{display:grid;gap:11px;grid-template-columns:repeat(auto-fit,minmax(232px,1fr))}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:15px 16px;
      transition:.18s var(--ease)}
.card.clk{cursor:pointer}
.card.clk:hover{border-color:var(--line2);transform:translateY(-2px);
               box-shadow:0 10px 30px rgba(0,0,0,.35)}
.card .k{font:10px var(--mono);letter-spacing:.15em;text-transform:uppercase;color:var(--dim2)}
.card .v{font:22px/1.2 var(--mono);margin:8px 0 2px}
.card .s{font-size:12.5px;color:var(--dim)}
.mono{font-family:var(--mono)}
.bar{height:5px;background:var(--p2);border-radius:4px;overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--cy),var(--vi))}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:4px}
th{text-align:left;font:10px var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--dim2);
   padding:8px 10px;border-bottom:1px solid var(--line);font-weight:500}
td{padding:8px 10px;border-bottom:1px solid #171c25}
tr:last-child td{border:0}
.pill{font:10.5px var(--mono);padding:2.5px 8px;border-radius:20px;background:var(--p2);
      border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.pill.g{color:var(--gr);border-color:#1a3b32;background:#0d1a17}
.pill.a{color:var(--am);border-color:#3b3118;background:#1a1610}
.pill.r{color:var(--rd);border-color:#3d1f1f;background:#1a1010}
.pill.c{color:var(--cy);border-color:#16404a;background:#0a1a1e}

/* ── AI sidebar ────────────────────────────────────── */
#ai{position:absolute;top:0;right:0;bottom:0;width:376px;background:var(--bg2);
    border-left:1px solid var(--line);display:flex;flex-direction:column;z-index:40;
    transform:translateX(100%);transition:transform .34s var(--ease)}
#ai.on{transform:none}
#ai .ah{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
#ai .ah b{font:600 13px var(--sans)}
#ai .log{flex:1;overflow-y:auto;padding:15px 16px;display:flex;flex-direction:column;gap:11px}
.msg{max-width:88%;padding:10px 13px;border-radius:13px;font-size:13.5px;line-height:1.6;
     white-space:pre-wrap;word-break:break-word}
.msg.u{align-self:flex-end;background:linear-gradient(135deg,var(--cy-d),#0b5c72);color:#e0fbff;
         border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--p1);border:1px solid var(--line);color:var(--fg);
         border-bottom-left-radius:4px}
.msg.e{align-self:flex-start;color:var(--rd);font:11.5px var(--mono);background:#1a1010;
        border:1px solid #3d1f1f}
#ai .aib{padding:12px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:flex-end}
#ai textarea{flex:1;background:var(--p1);border:1px solid var(--line);border-radius:11px;
             padding:9px 12px;resize:none;outline:none;font-size:13.5px;max-height:120px;
             font-family:var(--sans)}
#ai textarea:focus{border-color:var(--cy-d)}

/* ── command palette ───────────────────────────────── */
#pal{position:fixed;inset:0;z-index:100;background:rgba(5,7,10,.62);
     backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
     display:flex;justify-content:center;align-items:flex-start;padding-top:14vh}
#palbox{width:min(640px,92vw);background:var(--bg2);border:1px solid var(--line2);
        border-radius:16px;box-shadow:0 30px 90px rgba(0,0,0,.65);overflow:hidden;
        animation:pop .2s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(-10px) scale(.985)}to{opacity:1;transform:none}}
#palin{width:100%;background:none;border:0;outline:none;padding:17px 19px;font-size:16px;
       border-bottom:1px solid var(--line)}
#palin::placeholder{color:var(--dim2)}
#pall{max-height:min(430px,54vh);overflow-y:auto;padding:7px}
.pi{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;cursor:pointer}
.pi.on{background:var(--p2)}
.pi .ic{width:26px;height:26px;border-radius:7px;background:var(--p3);display:grid;place-items:center;
        font:11px var(--mono);color:var(--dim);flex:0 0 auto}
.pi.on .ic{background:var(--cy-d);color:#cffafe}
.pi .tx{flex:1;min-width:0}
.pi .tx b{display:block;font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;
          text-overflow:ellipsis}
.pi .tx span{font-size:11.5px;color:var(--dim2);font-family:var(--mono);
             white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.pi mark{background:rgba(251,191,36,.26);color:var(--am);border-radius:2px}
#palf{padding:8px 14px;border-top:1px solid var(--line);display:flex;gap:14px;
      font:10.5px var(--mono);color:var(--dim2)}

/* ── reader ────────────────────────────────────────── */
#reader{max-width:680px;margin:0 auto;padding:34px 30px;font-size:17px;line-height:1.78}
#reader h1{font-size:34px;margin-bottom:14px}
#reader p{margin-bottom:1.15em;color:#cfd6e0}

/* ── status ────────────────────────────────────────── */
#status{flex:0 0 auto;height:29px;display:flex;align-items:center;gap:14px;padding:0 16px;
        border-top:1px solid var(--line);background:var(--bg2);font:11px var(--mono);color:var(--dim2)}
#status .s{display:flex;align-items:center;gap:6px}
.led{width:6px;height:6px;border-radius:50%;background:var(--gr);box-shadow:0 0 7px var(--gr)}
.led.off{background:var(--rd);box-shadow:0 0 7px var(--rd)}
#status .sp{flex:1}
#toast{position:fixed;bottom:44px;left:50%;transform:translateX(-50%) translateY(14px);
       background:var(--p2);border:1px solid var(--line2);border-radius:11px;padding:10px 17px;
       font-size:13px;opacity:0;pointer-events:none;transition:.28s var(--ease);z-index:120}
#toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>

<div id="app">
  <!-- rail -->
  <aside id="rail">
    <div class="rt">
      <div class="logo">H</div><b>Orbit</b><div class="sp"></div>
      <button class="iconbtn" id="newTab" title="New tab (⌘T)">+</button>
    </div>
    <div id="tabs"></div>
    <div class="spaces">
      <div class="lbl">spaces</div>
      <span class="chip on" data-space="all">All</span>
      <span class="chip" data-space="system">System</span>
      <span class="chip" data-space="create">Create</span>
      <span class="chip" data-space="research">Research</span>
    </div>
  </aside>

  <div id="main">
    <div id="top">
      <div class="sp" id="toggleRail" title="Toggle sidebar (⌘\)">&#9776;</div>
      <button class="nav" id="back" title="Back">&#8592;</button>
      <button class="nav" id="fwd" title="Forward">&#8594;</button>
      <button class="nav" id="reload" title="Reload">&#8635;</button>
      <div id="omni">
        <span class="lock" id="lock">&#128274;</span>
        <span class="scheme hidden" id="scheme">mind://</span>
        <input id="url" spellcheck="false" placeholder="Search, or type a mind:// domain" autocomplete="off">
        <span class="kbd" id="kbdHint">&#8984;K</span>
      </div>
      <button class="nav" id="aiToggle" title="AI sidebar">&#9670;</button>
    </div>
    <div id="view"></div>
    <div id="status">
      <span class="s"><i class="led" id="led"></i><span id="sApi">api</span></span>
      <span class="s" id="sVer">v—</span>
      <span class="s" id="sUp">up—</span>
      <span class="s" id="sMem">mem —</span>
      <span class="s" id="sProc">proc —</span>
      <span class="s" id="sOll">ollama —</span>
      <span class="sp"></span>
      <span class="s" id="sSpace">space: all</span>
      <span class="s">reader <b id="sReader" style="color:var(--dim)">off</b></span>
    </div>
  </div>

  <!-- AI sidebar -->
  <aside id="ai">
    <div class="ah">
      <span style="color:var(--cy)">&#9670;</span><b>Orbit AI</b>
      <span class="pill" id="aiState">checking</span>
      <div class="sp" style="flex:1"></div>
      <button class="iconbtn" id="aiClose">&#10005;</button>
    </div>
    <div class="log" id="aiLog"></div>
    <div class="aib">
      <textarea id="aiIn" rows="1" placeholder="Ask about this system…"></textarea>
      <button class="nav" id="aiSend" title="Send">&#10148;</button>
    </div>
  </aside>
</div>

<!-- command palette -->
<div id="pal" class="hidden">
  <div id="palbox">
    <input id="palin" placeholder="Type a command, a mind:// domain, or an app…" autocomplete="off" spellcheck="false">
    <div id="pall"></div>
    <div id="palf">
      <span>&#8593;&#8595; navigate</span><span>&#9166; run</span><span>esc close</span>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════
   ORBIT — a browser for the HAZOOM OS.
   Single file. No build step, no external requests, no framework.
   Reads the live kernel over /api/* rather than mocking it.
   ═══════════════════════════════════════════════════════════════ */

const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtBytes = b => { if(!b && b!==0) return '—';
  const u=['B','KB','MB','GB','TB']; let i=0,v=b; while(v>=1024&&i<u.length-1){v/=1024;i++;} return v.toFixed(v<10&&i>0?1:0)+' '+u[i]; };
const dur = s => { if(!s && s!==0) return '—'; const d=Math.floor(s/1000);
  return d<60?d+'s':d<3600?Math.floor(d/60)+'m '+(d%60)+'s':Math.floor(d/3600)+'h '+Math.floor(d%3600/60)+'m'; };

let TOKEN = null;
async function auth(){
  try{
    const r = await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username:'hazem',password:'hazem'})});
    const d = await r.json(); TOKEN = d.token || d.accessToken || null;
  }catch(e){}
  return TOKEN;
}
async function api(path, opts={}){
  const h = Object.assign({}, opts.headers||{});
  if(TOKEN) h.Authorization = 'Bearer ' + TOKEN;
  if(opts.body && !h['Content-Type']) h['Content-Type'] = 'application/json';
  const r = await fetch(path, Object.assign({}, opts, {headers:h}));
  if(!r.ok){ let m=r.statusText; try{ const j=await r.json(); m=j?.error?.message||j?.error||m; }catch(e){} throw new Error(m); }
  return r.json();
}

/* ── mind:// domains ───────────────────────────────── */
const MINDS = [
  { s:'mind://home',      t:'Home',            ico:'⌂', g:'Home',      cat:'System' },
  { s:'mind://kernel',    t:'Kernel',          ico:'⚙', g:'System',     cat:'System' },
  { s:'mind://memory',    t:'Memory',          ico:'▤', g:'System',     cat:'System' },
  { s:'mind://processes', t:'Processes',       ico:'▣', g:'System',     cat:'System' },
  { s:'mind://services',  t:'Services',        ico:'◈', g:'System',     cat:'System' },
  { s:'mind://intelligence', t:'Intelligence', ico:'◆', g:'System',     cat:'System' },
  { s:'mind://pascal',    t:'Pascal',          ico:'Ψ', g:'System',     cat:'System' },
  { s:'mind://studio',    t:'Transistor Studio',ico:'♫',g:'Create',     cat:'Create', href:'/apps/tools/transistor-studio.html' },
  { s:'mind://dj',        t:'DJ Engine',       ico:'♪', g:'Create',     cat:'Create' },
  { s:'mind://browser',   t:'Browsers',        ico:'◐', g:'Research',   cat:'Research' },
  { s:'mind://about',     t:'About',           ico:'i', g:'System',     cat:'System' },
];
const ACTIONS = [
  { t:'New tab',              k:'tab.new',   kbd:'⌘T', run:()=>newTab() },
  { t:'Close tab',            k:'tab.close', kbd:'⌘W', run:()=>closeTab(cur().id) },
  { t:'Toggle sidebar',       k:'view.rail', kbd:'⌘\\',run:()=>toggleRail() },
  { t:'Toggle AI sidebar',    k:'view.ai',   kbd:'⌘I', run:()=>$('#ai').classList.toggle('on') },
  { t:'Toggle reader mode',   k:'view.reader',kbd:'⌘R',run:toggleReader },
  { t:'Reload',               k:'nav.reload',kbd:'⌘⇧R',run:()=>go(cur().url,true) },
  { t:'Go home',              k:'go.home',   kbd:'⌘1', run:()=>go('mind://home') },
  { t:'Open Transistor Studio',k:'app.synth',kbd:'',   run:()=>openApp('apps/tools/transistor-studio.html','Transistor Studio') },
  { t:'Open showcase',        k:'app.show',  kbd:'',   run:()=>openApp('/showcase','Showcase') },
];

/* ── tabs ──────────────────────────────────────────── */
let tabs = [], activeId = null, space = 'all', hist = [], hidx = -1, readerOn = false;
const uid = () => 't' + Math.random().toString(36).slice(2,9);

function cur(){ return tabs.find(t=>t.id===activeId) || tabs[0]; }
function newTab(url='mind://home'){ const t={id:uid(),url,title:'New tab',fav:'◐',space:'all',back:[],fwd:[]};
  tabs.push(t); activeId=t.id; render(); go(url); }
function closeTab(id){ const i=tabs.findIndex(t=>t.id===id); if(i<0)return;
  tabs.splice(i,1); if(!tabs.length) return newTab();
  if(activeId===id) activeId = tabs[Math.max(0,i-1)].id; render(); go(cur().url,true); }
function render(){
  const list = space==='all' ? tabs : tabs.filter(t=>t.space===space);
  $('#tabs').innerHTML = '';
  list.forEach(t=>{
    const d=document.createElement('div');
    d.className='tab'+(t.id===activeId?' on':'');
    d.innerHTML=`<span class="fav">${esc(t.fav)}</span><span class="t">${esc(t.title)}</span>
                 <span class="x" data-id="${t.id}">✕</span>`;
    d.onclick=e=>{ if(e.target.classList.contains('x')) return; activeId=t.id; render(); go(t.url,true); };
    d.querySelector('.x').onclick=e=>{e.stopPropagation();closeTab(t.id);};
    $('#tabs').appendChild(d);
  });
  $('#back').disabled = !cur()?.back.length; $('#fwd').disabled = !cur()?.fwd.length;
}

/* ── navigation ────────────────────────────────────── */
function normalise(raw){
  let s = (raw||'').trim();
  if(!s) return 'mind://home';
  if(/^mind:\/\//i.test(s)) return s.toLowerCase().replace(/\/+$/,'') || 'mind://home';
  if(/^https?:\/\//i.test(s)) return s;
  if(/^[\w-]+(\.[\w-]+)+([/?#].*)?$/.test(s)) return 'https://' + s;
  return 'mind://search?q=' + encodeURIComponent(s);
}
function go(raw, noHist){
  const t = cur(); if(!t) return;
  const url = normalise(raw);
  if(!noHist && t.url!==url){ t.back.push(t.url); t.fwd=[]; }
  t.url = url;
  $('#url').value = url.startsWith('mind://') ? url.replace('mind://','') : url;
  $('#scheme').classList.toggle('hidden', !url.startsWith('mind://'));
  $('#lock').innerHTML = url.startsWith('mind://') ? '&#9670;' : '&#128274;';
  $('#lock').style.color = url.startsWith('mind://') ? 'var(--cy)' : 'var(--gr)';

const cache = {};
async function get(k, path){ if(cache[k] && Date.now()-cache[k].t < 4000) return cache[k].v;

async function draw(){
  const u = cur().url;
  if(u.startsWith('app://')) return;
  if(u.startsWith('https://')) return webView(u);
  const [scheme,rest] = u.replace('mind://','').split(/[?#]/);
  const args = Object.fromEntries((u.split('?')[1]||'').split('&').filter(Boolean).map(s=>{const [k,v]=s.split('=');return[k,v];}));
  const V = $('#view');
  V.classList.remove('hidden');
  // Do NOT touch #reader here — it only exists once toggleReader() has built
  // it. Referencing it during a normal draw() threw on every navigation,
  // which aborted the render before any content was written.
  setReader(false);
  try{
    if(scheme==='home')       return cur().title='Home', V.innerHTML = await viewHome();
    if(scheme==='kernel')     return cur().title='Kernel', cur().fav='⚙', V.innerHTML = await viewKernel();
    if(scheme==='memory')     return cur().title='Memory', cur().fav='▤', V.innerHTML = await viewMemory();
    if(scheme==='processes')  return cur().title='Processes', cur().fav='▣', V.innerHTML = await viewProcs();

    if(scheme==='intelligence')return cur().title='Intelligence', cur().fav='◆', V.innerHTML = await viewIntel();
    if(scheme==='pascal')     return cur().title='Pascal', cur().fav='Ψ', V.innerHTML = await viewPascal();
    if(scheme==='studio')     return openApp('apps/tools/transistor-studio.html','Transistor Studio');
    if(scheme==='dj')         return cur().title='DJ Engine', cur().fav='♪', V.innerHTML = viewDJ();
    if(scheme==='browser')    return cur().title='Browsers', cur().fav='◐', V.innerHTML = viewBrowsers();
    if(scheme==='about')      return cur().title='About', cur().fav='i', V.innerHTML = viewAbout();
    if(scheme==='search')     return cur().title='Search', cur().fav='⌕', V.innerHTML = viewSearch(args.q||'');
    V.innerHTML = page(`<h1>404</h1><p class="lede">No mind domain <code class="mono">${esc(scheme)}</code>.</p>
      <p class="mut">Press <span class="kbd">⌘K</span> for the domain list.</p>`);

    V.innerHTML = page(`<h1>Unavailable</h1><p class="lede">${esc(e.message)}</p>

  }
  render();
}

function webView(url){
  const V = $('#view');
  // Framing a site directly fails almost everywhere: Google, GitHub and most
  // others send X-Frame-Options / frame-ancestors. Orbit goes through the
  // kernel's own fetch proxy instead — core/web_fetch.js retrieves the page
  // server-side, core/html_sanitizer.js strips scripts, and the result comes
  // back same-origin so it can be framed at all.
  const proxied = '/api/web/page?url=' + encodeURIComponent(url);
  V.innerHTML = `
    <div id="wbar" style="display:flex;align-items:center;gap:10px;padding:7px 14px;
         border-bottom:1px solid var(--line);font:11px var(--mono);color:var(--dim2)">
      <span style="color:var(--cy)">◐</span>
      <span>via kernel proxy</span>
      <span style="color:var(--line2)">·</span>
      <span>${esc(url.replace(/^https?:\/\//,''))}</span>
      <span style="flex:1"></span>
      <span id="wstat">loading…</span>
    </div>
    <iframe id="wframe" src="${esc(proxied)}" sandbox="allow-same-origin allow-popups"
      referrerpolicy="no-referrer"
      style="width:100%;height:calc(100% - 30px);border:0;background:#fff"></iframe>`;
  const fr = $('#wframe');
  fr.addEventListener('load', ()=>{
    const s = $('#wstat');
    if(s) s.textContent = 'loaded';
    try{
      const d = fr.contentDocument;
      const tt = d?.title;
      if(tt){ cur().title = tt.slice(0,60); render(); }
    }catch(e){ /* cross-origin: the proxy keeps it same-origin, but be safe */ }
  });
  fr.addEventListener('error', ()=>{ const s=$('#wstat'); if(s) s.textContent='failed to load'; });
  cur().title = new URL(url).hostname; cur().fav = '◍'; render();
}

function toggleReader(){
  const t = cur(); if(!t) return;
  if(readerOn) return setReader(false);
  const f = $('#view iframe');
  if(!f || !f.contentDocument) return toast('Reader mode needs an embedded page');
  try{
    const d = f.contentDocument;
    const art = d.querySelector('article, main, [role=main]') || d.body;
    const h1 = art.querySelector('h1')?.textContent || cur().title;
    const txt = [...art.querySelectorAll('p,h2,h3,li')].map(e=>e.textContent.trim())
      .filter(x=>x.length>40).join('\n\n');
    if(txt.length < 200) return toast('Not enough article text');
    $('#view').innerHTML = `<div id="reader"><h1>${esc(h1)}</h1>${txt.split('\n\n').map(p=>`<p>${esc(p)}</p>`).join('')}</div>`;
    setReader(true); toast('Reader mode on');
  }catch(e){ toast('Blocked by cross-origin'); }
}

let pItems=[], pSel=0;
function fuzzy(q, s){
  q=q.toLowerCase(); s=s.toLowerCase();
  if(!q) return 0;
  const i=s.indexOf(q); if(i>=0) return 100 - i*2 - (s.length-q.length)*0.1;
  let qi=0, sc=0;
  for(let i=0;i<s.length&&qi<q.length;i++) if(s[i]===q[qi]){qi++;sc+=3;}
  return qi===q.length ? sc : -1;
}
function mark(text,q){
  if(!q) return esc(text);
  const i=text.toLowerCase().indexOf(q.toLowerCase());
  if(i<0) return esc(text);
  return esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+q.length))+'</mark>'+esc(text.slice(i+q.length));
}
function palItems(q){
  const out=[];
  MINDS.forEach(m=>{ const s=fuzzy(q,m.t); if(s>=0) out.push({ico:m.ico, t:mark(m.t,q), s:mark(m.s,q), sc:s+40, run:()=>go(m.s)}); });
  ACTIONS.forEach(a=>{ const s=fuzzy(q,a.t); if(s>=0) out.push({ico:'⌘', t:mark(a.t,q), s:a.kbd||'action', sc:s+20, run:a.run}); });
  if(q) out.push({ico:'↵', t:`Go to <b>${esc(q)}</b>`, s:normalise(q), sc:1, run:()=>go(q)});
  out.push({ico:'◐', t:'Reload the current view', s:'nav', sc:fuzzy(q,'reload the current view')+5, run:()=>go(cur().url,true)});
  return out.sort((a,b)=>b.sc-a.sc).slice(0,40);
}

function palDraw(q){

/* ── keys ──────────────────────────────────────────── */
addEventListener('keydown', e=>{
  const mod = e.metaKey || e.ctrlKey;
  if(mod && e.key.toLowerCase()==='k'){ e.preventDefault(); $('#pal').classList.contains('hidden')?openPal():closePal(); return; }
  if(e.key==='Escape'){ closePal(); $('#ai').classList.remove('on'); return; }
  if(!$('#pal').classList.contains('hidden')){
    if(e.key==='ArrowDown'){ e.preventDefault(); pSel=Math.min(pSel+1,pItems.length-1); palPaint($('#palin').value); return; }
    if(e.key==='ArrowUp'){ e.preventDefault(); pSel=Math.max(pSel-1,0); palPaint($('#palin').value); return; }
    if(e.key==='Enter'){ e.preventDefault(); const it=pItems[pSel]; if(it){closePal(); it.run();} return; }
  }
  if(mod && e.key.toLowerCase()==='t'){ e.preventDefault(); newTab(); return; }
  if(mod && e.key.toLowerCase()==='w'){ e.preventDefault(); closeTab(activeId); return; }
  if(mod && e.key.toLowerCase()==='r'){ e.preventDefault(); toggleReader(); return; }
  if(mod && e.key.toLowerCase()==='i'){ e.preventDefault(); $('#ai').classList.toggle('on'); aiHealth(); return; }
  if(mod && e.key==='\\'){ e.preventDefault(); toggleRail(); return; }
  if(mod && e.key==='1'){ e.preventDefault(); go('mind://home'); return; }
  if(e.key==='F5'){ e.preventDefault(); go(cur().url,true); return; }
  if(e.altKey && e.key==='ArrowLeft'){ e.preventDefault(); back(); return; }
  if(e.altKey && e.key==='ArrowRight'){ e.preventDefault(); fwd(); return; }
});

/* ── boot ──────────────────────────────────────────── */
$('#url').addEventListener('keydown', e=>{ if(e.key==='Enter'){ $('#url').blur(); go(e.target.value); } });
$('#palin').addEventListener('input', e=>palDraw(e.target.value));
$('#back').onclick=back; $('#fwd').onclick=fwd; $('#reload').onclick=()=>go(cur().url,true);
const toggleRail=()=>{ $('#app').classList.toggle('narrow'); $('#rail').classList.toggle('collapsed'); };
$('#toggleRail').onclick=toggleRail;
$('#newTab').onclick=()=>newTab();
$('#aiToggle').onclick=()=>{ $('#ai').classList.toggle('on'); aiHealth(); };
$('#aiClose').onclick=()=>$('#ai').classList.remove('on');
$('#aiSend').onclick=()=>{ const v=$('#aiIn'); ask(v.value); v.value=''; };
$('#aiIn').addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault();
  ask(e.target.value); e.target.value=''; e.target.style.height='auto'; } });
$('#aiIn').addEventListener('input',e=>{ e.target.style.height='auto';
  e.target.style.height=Math.min(120,e.target.scrollHeight)+'px'; });
$$('.chip').forEach(c=>c.onclick=()=>{ $$('.chip').forEach(x=>x.classList.remove('on'));
  c.classList.add('on'); space=c.dataset.space; $('#sSpace').textContent='space: '+space; render(); });
$('#pal').onclick=e=>{ if(e.target.id==='pal') closePal(); };

(async function(){
  await auth();
  newTab('mind://home');
  tick(); setInterval(tick, 5000);
  setInterval(()=>{ if(!$('#view').querySelector('iframe')) draw(); }, 6000);
  aiHealth();
  aMsg('Ask about this system. I read the live kernel — try “how much memory is free” or “what is running”.','a');
})();
</script>
</body>
</html>
