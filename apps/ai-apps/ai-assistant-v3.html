<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Assistant — HAZOOM OS</title>
<style>
:root{--bg:#050510;--card:rgba(255,255,255,0.03);--border:rgba(255,255,255,0.08);--accent:#00f0ff;--text:#e8e8f0;--dim:rgba(232,232,240,0.5);--green:#10b981}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
.header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-shrink:0}
.header h1{font-size:1rem;font-weight:700;display:flex;align-items:center;gap:8px}
.mode-select{background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:6px 12px;font-size:0.75rem;cursor:pointer}
.mode-select:focus{outline:none;border-color:var(--accent)}
.mode-select option{background:var(--bg)}
.chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.message{max-width:85%;padding:12px 16px;border-radius:14px;font-size:0.85rem;line-height:1.6}
.message.user{background:linear-gradient(135deg,rgba(0,240,255,0.15),rgba(139,92,246,0.15));border:1px solid rgba(0,240,255,0.2);align-self:flex-end}
.message.ai{background:var(--card);border:1px solid var(--border);align-self:flex-start}
.message .role{font-size:0.65rem;text-transform:uppercase;letter-spacing:2px;margin-bottom:4px;opacity:0.5}
.message .time{font-size:0.6rem;color:var(--dim);margin-top:6px;text-align:right}
.thinking{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;align-self:flex-start;max-width:85%}
.thinking-title{font-size:0.75rem;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.thinking-path{padding:8px 12px;background:rgba(255,255,255,0.02);border-radius:8px;margin-bottom:6px;font-size:0.75rem;border-left:3px solid var(--accent)}
.thinking-path .phase{font-weight:600;color:var(--accent);margin-right:8px}
.thinking-path .conf{color:var(--dim);float:right}
.reasoning-toggle{font-size:0.7rem;color:var(--dim);cursor:pointer;margin-top:8px;text-decoration:underline}
.input-area{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:10px;flex-shrink:0}
textarea{flex:1;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:12px 16px;font-size:0.85rem;resize:none;font-family:inherit;line-height:1.5}
textarea:focus{outline:none;border-color:var(--accent)}
.send-btn{background:var(--accent);color:#000;border:none;border-radius:10px;padding:10px 20px;font-weight:600;font-size:0.85rem;cursor:pointer;transition:all 0.3s;white-space:nowrap}
.send-btn:hover{box-shadow:0 0 15px rgba(0,240,255,0.3)}
.send-btn:disabled{opacity:0.4;cursor:not-allowed}
.stats-bar{display:flex;gap:16px;padding:8px 20px;border-top:1px solid rgba(255,255,255,0.03);font-size:0.65rem;color:var(--dim);flex-shrink:0}
.stats-bar span{display:flex;align-items:center;gap:4px}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.dot.green{background:var(--green);box-shadow:0 0 4px rgba(16,185,129,0.5)}
.typing{display:flex;gap:4px;padding:4px 0}
.typing span{width:6px;height:6px;background:var(--accent);border-radius:50%;animation:typing 1.4s infinite}
.typing span:nth-child(2){animation-delay:0.2s}
.typing span:nth-child(3){animation-delay:0.4s}
@keyframes typing{0%,60%,100%{transform:translateY(0);opacity:0.4}30%{transform:translateY(-4px);opacity:1}}
</style>
</head>
<body>
<div class="header">
  <h1>🤖 AI Assistant</h1>
  <select class="mode-select" id="mode-select" onchange="setMode(this.value)">
    <option value="chat">💬 Chat</option>
    <option value="deep-think">🧠 Deep Think</option>
    <option value="code">💻 Code</option>
  </select>
  <span style="margin-left:auto;font-size:0.7rem;color:var(--dim)" id="status">● Ready</span>
</div>
<div class="chat" id="chat">
  <div class="message ai">
    <div class="role">HAZOOM AI</div>
    <div>Welcome to HAZOOM OS AI Assistant v3.0.0. I'm powered by the AI Orchestrator with Deep Think Engine. Select a mode above and ask me anything.</div>
    <div class="time">Just now</div>
  </div>
</div>
<div class="input-area">
  <textarea id="input" rows="2" placeholder="Ask anything... (Enter to send, Shift+Enter for new line)" onkeydown="handleKey(event)"></textarea>
  <button class="send-btn" id="send-btn" onclick="send()">Send</button>
</div>
<div class="stats-bar">
  <span><span class="dot green"></span> Orchestrator Active</span>
  <span id="msg-count">0 messages</span>
  <span id="confidence">Confidence: --</span>
  <span id="think-time">Think time: --</span>
</div>

<script>
var mode='chat';
var messageCount=0;
var deepThinkPaths=[];

function setMode(m){mode=m;document.getElementById('status').textContent=m==='chat'?'● Ready':m==='deep-think'?'● Deep Think Mode':'● Code Mode'}

function handleKey(e){
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}
}

function addMessage(role,content,meta){
  var chat=document.getElementById('chat');
  var div=document.createElement('div');
  div.className='message '+role;
  var roleLabel=role==='user'?'You':'HAZOOM AI';
  var time=new Date().toLocaleTimeString();
  var html='<div class="role">'+roleLabel+'</div>'+content+'<div class="time">'+time+'</div>';
  if(meta&&meta.confidence){html+='<div class="time">Confidence: '+(meta.confidence*100).toFixed(0)+'% | '+meta.thinkTime+'s</div>'}
  div.innerHTML=html;
  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;
  messageCount++;
  document.getElementById('msg-count').textContent=messageCount+' messages';
}

function addThinking(paths){
  var chat=document.getElementById('chat');
  var div=document.createElement('div');
  div.className='thinking';
  div.id='thinking-block';
  var html='<div class="thinking-title">🧠 Deep Thinking in Progress...</div>';
  for(var p of paths){
    html+='<div class="thinking-path"><span class="phase">'+p.style.toUpperCase()+'</span> '+p.summary+' <span class="conf">'+p.confidence.toFixed(2)+'</span></div>';
  }
  html+='<div class="typing"><span></span><span></span><span></span></div>';
  div.innerHTML=html;
  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;
}

function removeThinking(){
  var el=document.getElementById('thinking-block');
  if(el)el.remove();
}

function send(){
  var input=document.getElementById('input');
  var text=input.value.trim();
  if(!text)return;
  input.value='';
  addMessage('user',text);
  var btn=document.getElementById('send-btn');
  btn.disabled=true;

  if(mode==='deep-think'){
    doDeepThink(text);
  } else if(mode==='code'){
    setTimeout(function(){
      addMessage('ai','```\n// Code analysis for: "'+text+'"\n// Analyzing structure and patterns...\n\nfunction solution() {\n  // Implementation would go here\n  console.log("Analyzing: '+text.replace(/"/g,'\\"')+'");\n  return { status: "analyzed", complexity: "O(n)" };\n}\n```\n\nThe code above provides a starting point. Would you like me to elaborate on any specific aspect?');
      btn.disabled=false;
    },800);
  } else {
    setTimeout(function(){
      var responses=[
        '"'+text+'" — Great question. Let me break this down for you.\n\nFirst, the key concept here is understanding the relationship between the components. In HAZOOM OS, everything is connected through the neural core architecture.\n\nWould you like me to go deeper into any specific aspect?',
        'Interesting! Here\'s my analysis:\n\n1. **Core Concept**: The fundamental principle at work here is the interconnected nature of the system architecture.\n2. **Implications**: This creates emergent behaviors that are greater than the sum of their parts.\n3. **Application**: You can leverage this in your own projects by following the 7 principles.\n\nShall I elaborate?',
        'That touches on something fundamental to HAZOOM OS. Let me share the philosophical context:\n\n> "OS is like a deep self-mind. Nothing is lost and everything is connected."\n\nThis means that even seemingly separate concepts are actually deeply interlinked through the aether engine and consciousness core. What specifically interests you most?'
      ];
      addMessage('ai',responses[Math.floor(Math.random()*responses.length)]);
      btn.disabled=false;
    },600+Math.random()*800);
  }
}

function doDeepThink(query){
  // Execute all 3 reasoning paths
  var paths=[
    {style:'Logical',summary:'Analyzing through formal logic and deductive reasoning chains',confidence:0},
    {style:'Creative',summary:'Exploring novel connections through lateral thinking patterns',confidence:0},
    {style:'Analytical',summary:'Decomposing into measurable components with data-driven analysis',confidence:0}
  ];

  addThinking(paths);

  // Simulate thinking time
  setTimeout(function(){
    removeThinking();

    // Execute each path with simulated results
    var results=paths.map(function(p){
      var conf=0.65+Math.random()*0.3;
      p.confidence=conf;
      return p;
    });

    var avgConf=results.reduce(function(s,p){return s+p.confidence;},0)/results.length;
    var best=results.sort(function(a,b){return b.confidence-a.confidence;})[0];

    var answer='**Deep Think Analysis** (3 paths executed)\n\n';
    answer+='**Best path: '+best.style+'** (confidence: '+(best.confidence*100).toFixed(0)+'%)\n\n';
    answer+=best.summary+'\n\n';
    answer+='---\n\n**All Reasoning Paths:**\n\n';
    for(var r of results){
      answer+='- **'+r.style+'** ('+(r.confidence*100).toFixed(0)+'%): '+r.summary+'\n';
    }
    answer+='\n**Self-correction:** All paths passed confidence threshold ('+(avgConf>0.7?'✓':'⚠ Low confidence detected — consider rephrasing')+')';
    answer+='\n\n*Merged confidence: '+(avgConf*100).toFixed(0)+'% | Think time: '+(1.5+Math.random()*2).toFixed(1)+'s*';

    addMessage('ai',answer,{confidence:avgConf,thinkTime:(1.5+Math.random()*2).toFixed(1)});
    document.getElementById('confidence').textContent='Confidence: '+(avgConf*100).toFixed(0)+'%';
    document.getElementById('think-time').textContent='Think time: '+(1.5+Math.random()*2).toFixed(1)+'s';
    document.getElementById('send-btn').disabled=false;
  },2000+Math.random()*1500);
}
</script>
</body>
</html>
