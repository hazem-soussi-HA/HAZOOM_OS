<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hazoom AI Assistant</title>
<style>
:root {
    --primary: #3b82f6; --secondary: #8b5cf6; --bg: #0f172a; --bg2: #1e293b;
    --bg3: #334155; --text: #f1f5f9; --text2: #94a3b8; --border: #475569;
    --success: #22c55e; --accent: #00f0ff; --gold: #ffd700;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Inter',-apple-system,sans-serif; background:var(--bg); color:var(--text);
    height:100vh; display:flex; flex-direction:column; overflow:hidden; }

.header { background:rgba(15,23,42,0.9); backdrop-filter:blur(24px); border-bottom:1px solid rgba(255,255,255,0.1);
    padding:12px 20px; display:flex; align-items:center; gap:12px; }
.header h1 { font-size:1rem; font-weight:600; }
.header h1 span { color:var(--accent); }
.status { display:flex; align-items:center; gap:6px; font-size:0.75rem; color:var(--text2); margin-left:auto; }
.status-dot { width:8px; height:8px; border-radius:50%; background:var(--success); }
.status-dot.offline { background:#ef4444; }

.chat { flex:1; display:flex; flex-direction:column; overflow:hidden; padding:12px; }
.messages { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding:8px; }
.msg { max-width:80%; padding:10px 14px; border-radius:12px; line-height:1.5; font-size:0.9rem; }
.msg.user { align-self:flex-end; background:var(--primary); color:white; border-bottom-right-radius:4px; }
.msg.ai { align-self:flex-start; background:var(--bg2); border:1px solid var(--border); border-bottom-left-radius:4px; }
.msg .time { font-size:0.65rem; color:rgba(255,255,255,0.4); margin-top:4px; text-align:right; }
.msg pre { background:rgba(0,0,0,0.3); padding:8px; border-radius:6px; overflow-x:auto; font-size:0.8rem; margin:6px 0; }
.msg code { font-family:'JetBrains Mono',monospace; font-size:0.8rem; }

.typing { display:none; align-self:flex-start; background:var(--bg2); border:1px solid var(--border);
    border-radius:12px; padding:10px 14px; }
.typing span { display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--text2);
    margin:0 2px; animation:bounce 1.4s infinite; }
.typing span:nth-child(2) { animation-delay:0.2s; }
.typing span:nth-child(3) { animation-delay:0.4s; }
@keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-6px)} }

.input-bar { display:flex; gap:8px; padding:12px; background:var(--bg2); border-top:1px solid var(--border); }
.input-bar input { flex:1; padding:10px 14px; background:var(--bg3); border:1px solid var(--border);
    border-radius:8px; color:var(--text); font-size:0.9rem; outline:none; font-family:inherit; }
.input-bar input:focus { border-color:var(--primary); }
.input-bar button { background:linear-gradient(135deg,var(--primary),var(--secondary)); color:white; border:none;
    border-radius:8px; padding:10px 18px; cursor:pointer; font-weight:600; transition:all 0.2s; }
.input-bar button:hover { transform:translateY(-1px); box-shadow:0 4px 12px rgba(59,130,246,0.3); }
.input-bar button:disabled { opacity:0.5; cursor:not-allowed; transform:none; }

.shortcuts { display:flex; gap:6px; padding:0 12px 10px; flex-wrap:wrap; }
.shortcut { padding:5px 10px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1);
    border-radius:15px; color:var(--text2); font-size:0.75rem; cursor:pointer; transition:all 0.2s; }
.shortcut:hover { background:rgba(0,240,255,0.1); border-color:var(--accent); color:var(--accent); }
</style>
</head>
<body>

<div class="header">
    <h1>🤖 Hazoom <span>AI</span></h1>
    <div class="status">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">Checking...</span>
    </div>
</div>

<div class="chat">
    <div class="messages" id="messages">
        <div class="msg ai">
            <div>Hey! I'm your Hazoom AI assistant. Ask me anything about the OS, code, or anything else.</div>
            <div class="time">Just now</div>
        </div>
        <div class="typing" id="typing"><span></span><span></span><span></span></div>
    </div>

    <div class="shortcuts">
        <div class="shortcut" onclick="quickAsk('What can you do?')">What can you do?</div>
        <div class="shortcut" onclick="quickAsk('Explain the HAZOOM OS architecture')">HAZOOM architecture</div>
        <div class="shortcut" onclick="quickAsk('How does the file system work?')">File system</div>
        <div class="shortcut" onclick="quickAsk('Write a Python fibonacci function')">Write code</div>
        <div class="shortcut" onclick="quickAsk('What AI models are available?')">AI models</div>
    </div>

    <div class="input-bar">
        <input type="text" id="input" placeholder="Ask me anything..." autocomplete="off">
        <button id="sendBtn" onclick="send()">Send</button>
    </div>
</div>

<script>
const messages = document.getElementById('messages');
const input = document.getElementById('input');
const typing = document.getElementById('typing');
const sendBtn = document.getElementById('sendBtn');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
let isProcessing = false;
let chatHistory = [];

// Check API health on load
async function checkHealth() {
    try {
        const r = await fetch('/api/intelligence/health');
        if (r.ok) {
            statusDot.classList.remove('offline');
            statusText.textContent = 'Online';
        } else {
            statusDot.classList.add('offline');
            statusText.textContent = 'Offline';
        }
    } catch(e) {
        statusDot.classList.add('offline');
        statusText.textContent = 'Offline';
    }
}
checkHealth();

input.addEventListener('keydown', e => { if (e.key === 'Enter' && !isProcessing) send(); });

function quickAsk(q) {
    input.value = q;
    send();
}

function addMsg(text, sender) {
    const div = document.createElement('div');
    div.className = 'msg ' + sender;
    const time = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    // Format code blocks
    let formatted = text.replace(/```(\w*)\n?([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
    formatted = formatted.replace(/`([^`]+)`/g, '<code>$1</code>');
    formatted = formatted.replace(/\n/g, '<br>');
    div.innerHTML = `<div>${formatted}</div><div class="time">${time}</div>`;
    messages.insertBefore(div, typing);
    messages.scrollTop = messages.scrollHeight;
}

async function send() {
    const text = input.value.trim();
    if (!text || isProcessing) return;

    isProcessing = true;
    sendBtn.disabled = true;
    addMsg(text, 'user');
    input.value = '';
    typing.style.display = 'block';
    messages.scrollTop = messages.scrollHeight;

    chatHistory.push({ role: 'user', content: text });

    try {
        // Try the real intelligence API first
        const r = await fetch('/api/intelligence/think', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ input: text })
        });

        if (r.ok) {
            const data = await r.json();
            const reply = data.response || data.answer || data.result || data.output || JSON.stringify(data);
            addMsg(reply, 'ai');
            chatHistory.push({ role: 'assistant', content: reply });
        } else {
            // Fallback: try Ollama directly
            const ollamaR = await fetch('http://localhost:11434/api/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model: 'qwen2.5-coder:3b',
                    prompt: text,
                    stream: false
                })
            });

            if (ollamaR.ok) {
                const data = await ollamaR.json();
                addMsg(data.response || 'No response from model.', 'ai');
            } else {
                // Local fallback responses
                addMsg(getLocalResponse(text), 'ai');
            }
        }
    } catch(e) {
        // Network error — use local fallback
        addMsg(getLocalResponse(text), 'ai');
    } finally {
        isProcessing = false;
        sendBtn.disabled = false;
        typing.style.display = 'none';
    }
}

function getLocalResponse(input) {
    const lower = input.toLowerCase();

    if (lower.includes('what can you do') || lower.includes('help')) {
        return "I can help with:\n\n• **OS Operations** — file management, process info, system status\n• **Code** — write, debug, and explain code in any language\n• **Knowledge** — answer questions, explain concepts\n• **Creative** — brainstorm, write, translate\n\nJust ask naturally!";
    }
    if (lower.includes('architecture') || lower.includes('hazoom os')) {
        return "**HAZOOM OS Architecture:**\n\n• **Kernel** — MLFQ scheduler, virtual memory, IPC, process groups\n• **AI Core** — IntelligenceCore (Ollama), AI Orchestrator, Deep Think Engine\n• **Security** — JWT auth, content filtering, firewall, encryption\n• **Desktop** — Window management, dock, animations, app ecosystem\n• **API** — 50+ REST endpoints, WebSocket, caching layer\n\nIt's a full AI-native OS running in the browser.";
    }
    if (lower.includes('file system') || lower.includes('files')) {
        return "**HAZOOM File System:**\n\n• Virtual in-memory filesystem with persistence to disk\n• Supports folders, files, read/write operations\n• Accessed via `window.parent.FileSystem` in apps\n• API: `/api/fs/list`, `/api/fs/read`, `/api/fs/write`\n• Factory reset available from File Manager";
    }
    if (lower.includes('fibonacci')) {
        return "```python\ndef fibonacci(n):\n    \"\"\"Return the nth Fibonacci number.\"\"\"\n    if n <= 0:\n        return 0\n    elif n == 1:\n        return 1\n    a, b = 0, 1\n    for _ in range(2, n + 1):\n        a, b = b, a + b\n    return b\n\n# Generate first 10 numbers\nfor i in range(10):\n    print(fibonacci(i))\n```\n\nThis runs in O(n) time with O(1) space.";
    }
    if (lower.includes('model') || lower.includes('ollama')) {
        return "**Available AI Models (via Ollama):**\n\n• `qwen2.5-coder:3b` — Primary coding model\n• IntelligenceCore routes queries automatically\n• Health check: `/api/intelligence/health`\n• All inference runs locally on your machine";
    }

    const responses = [
        `That's an interesting question. Here's my take on "${input}": Let me think... The answer depends on context, but in general, I'd recommend breaking the problem into smaller parts and tackling each systematically.`,
        `Great question! Based on my knowledge, the key points about "${input}" are: it's a multifaceted topic. Would you like me to dive deeper into any specific aspect?`,
        `I can help with that. "${input}" is something I can reason about. Let me know if you want a detailed explanation or a quick summary.`,
        `Interesting! Regarding "${input}" — there are several angles to consider. What's your specific use case? That'll help me give a more targeted answer.`
    ];
    return responses[Math.floor(Math.random() * responses.length)];
}
</script>
</body>
</html>
