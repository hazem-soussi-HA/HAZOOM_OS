<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hazem Co-Pilot - HAZOOM OS</title>
    <link rel="stylesheet" href="../hazoom-os.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a);
            border-radius: 16px;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(59, 130, 246, 0.2);
        }
        .logo {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .status {
            display: flex;
            gap: 8px;
            align-items: center;
            font-size: 14px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 2s infinite;
        }
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: rgba(15, 23, 42, 0.1);
            border-radius: 12px;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        .message {
            margin-bottom: 15px;
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 80%;
            line-height: 1.6;
        }
        .message.user {
            background: rgba(59, 130, 246, 0.2);
            margin-left: auto;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }
        .message.assistant {
            background: rgba(139, 92, 246, 0.2);
            border: 1px solid rgba(139, 92, 246, 0.3);
        }
        .input-area {
            padding: 15px;
            border-top: 1px solid rgba(59, 130, 246, 0.2);
            display: flex;
            gap: 10px;
        }
        .input {
            flex: 1;
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
        }
        .input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.2);
        }
        .button {
            padding: 12px 24px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }
        .button:hover {
            background: var(--primary-dark);
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">🚀 Hazem Co-Pilot</div>
            <div class="status">
                <div class="status-dot"></div>
                <span id="mcpStatus">Initializing MCP...</span>
            </div>
        </div>
        
        <div class="chat-container">
            <div class="messages" id="messages">
                <div class="message assistant">
                    Hello! I'm your AI co-pilot. How can I help you today?
                </div>
            </div>
            
            <div class="input-area">
                <input type="text" class="input" id="messageInput" placeholder="Type your message...">
                <button class="button" onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>
    
    <script>
        // Initialize MCP Context Router
        let mcpRouter = null;
        let mcpInitialized = false;

        async function initMCP() {
            // Try to load MCP router from parent
            if (window.parent && window.parent.mcp) {
                mcpRouter = window.parent.mcp;
                document.getElementById('mcpStatus').textContent = '✅ MCP Active';
                mcpInitialized = true;
                console.log('✅ [Co-Pilot] MCP Context Router connected');
            } else {
                // Try to load local MCP router
                try {
                    const mcpScript = document.createElement('script');
                    mcpScript.src = '../core/mcp_context_router.js';
                    document.head.appendChild(mcpScript);
                    
                    // Wait for script to load
                    await new Promise(resolve => mcpScript.onload = resolve);
                    
                    if (window.MCPContextRouter) {
                        mcpRouter = new window.MCPContextRouter();
                        document.getElementById('mcpStatus').textContent = '✅ MCP Active';
                        mcpInitialized = true;
                        console.log('✅ [Co-Pilot] MCP Context Router loaded locally');
                    }
                } catch (error) {
                    document.getElementById('mcpStatus').textContent = '⚠️ MCP Unavailable';
                    console.warn('⚠️ [Co-Pilot] MCP Context Router not available');
                }
            }
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            const messagesContainer = document.getElementById('messages');
            
            const userMessage = document.createElement('div');
            userMessage.className = 'message user';
            userMessage.textContent = message;
            messagesContainer.appendChild(userMessage);
            
            input.value = '';
            
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            // Gather MCP context if available
            let contextInfo = '';
            if (mcpInitialized && mcpRouter) {
                try {
                    const context = await mcpRouter.nanoSearch(message);
                    contextInfo = `\n\n[Context Sources: ${context.sources.join(', ')}]`;
                    console.log('🧬 [Co-Pilot] MCP Context:', context);
                } catch (error) {
                    console.warn('⚠️ [Co-Pilot] MCP context error:', error);
                }
            }
            
            setTimeout(() => {
                const assistantMessage = document.createElement('div');
                assistantMessage.className = 'message assistant';
                
                let response = `I received: ${message}`;
                if (mcpInitialized) {
                    response += `\n\n🧬 MCP-Powered: Using context from Memory, FileSystem, and AI models.`;
                }
                
                assistantMessage.textContent = response;
                messagesContainer.appendChild(assistantMessage);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }, 1000);
        }
        
        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Initialize on load
        window.addEventListener('load', initMCP);
    </script>
</body>
</html>
