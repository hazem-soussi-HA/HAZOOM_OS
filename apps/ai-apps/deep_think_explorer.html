<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Think Portal</title>
    <link rel="stylesheet" href="../styles/hazoom-os.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --glass-bg: rgba(15, 23, 42, 0.6);
            --glass-border: rgba(255, 255, 255, 0.1);
            --neon-blue: #00f3ff;
            --neon-purple: #bc13fe;
            --success: #00ff9d;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: 'Outfit', sans-serif;
            color: white;
            background: transparent;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.5s ease-out;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 20px;
        }

        .header h1 {
            margin: 0;
            font-weight: 700;
            font-size: 24px;
            background: linear-gradient(to right, var(--neon-blue), var(--neon-purple));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            position: relative;
        }

        input {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 15px 20px;
            border-radius: 12px;
            font-family: 'Outfit', sans-serif;
            font-size: 16px;
            width: 100%;
            transition: all 0.3s ease;
            outline: none;
        }

        input:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
        }

        button.think-btn {
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            border: none;
            color: white;
            padding: 0 30px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        button.think-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(188, 19, 254, 0.4);
        }

        .visualization-area {
            flex: 1;
            display: flex;
            gap: 20px;
            overflow: hidden;
            position: relative;
        }

        .steps-container {
            flex: 1;
            overflow-y: auto;
            padding-right: 10px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .step-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 15px;
            animation: slideIn 0.3s ease-out;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .step-card:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateX(5px);
        }

        .step-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 100%;
            background: var(--neon-blue);
        }

        .step-card.creative::before {
            background: var(--neon-purple);
        }

        .step-card.analytical::before {
            background: var(--success);
        }

        .step-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .step-content {
            font-size: 15px;
            line-height: 1.5;
        }

        .confidence-meter {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
        }

        .meter-bar {
            flex: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        .meter-fill {
            height: 100%;
            background: var(--success);
            width: 0%;
            transition: width 1s ease-out;
        }

        .stats-panel {
            width: 300px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: var(--neon-blue);
            font-family: 'JetBrains Mono', monospace;
        }

        .stat-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
        }

        .thinking-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .thinking-indicator.active {
            opacity: 1;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid transparent;
            border-top-color: var(--neon-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .spinner::before {
            content: '';
            position: absolute;
            top: 5px;
            left: 5px;
            right: 5px;
            bottom: 5px;
            border: 3px solid transparent;
            border-top-color: var(--neon-purple);
            border-radius: 50%;
            animation: spin 2s linear infinite reverse;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes slideIn {
            from {
                transform: translateY(20px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>🧠 Deep Think <span style="font-weight: 300; opacity: 0.7;">Portal</span></h1>
            <div style="font-size: 12px; color: rgba(255,255,255,0.5);">v1.0.0 (Symphony)</div>
        </div>

        <div class="search-box">
            <input type="text" id="queryInput"
                placeholder="Enter a concept to analyze (e.g., 'Perceptron', 'Attention Mechanism')..."
                autocomplete="off">
            <button class="think-btn" onclick="startDeepThink()">
                <span>⚡ Deep Think</span>
            </button>
        </div>

        <div class="visualization-area">
            <div class="steps-container" id="stepsContainer">
                <div class="step-card"
                    style="text-align: center; border: 1px dashed rgba(255,255,255,0.2); background: transparent;">
                    <div class="step-content" style="color: rgba(255,255,255,0.5);">
                        Enter a query above to start the Deep Think process.
                    </div>
                </div>
            </div>

            <div class="stats-panel">
                <div class="stat-item">
                    <div class="stat-value" id="modelLabel" style="font-size: 15px;">—</div>
                    <div class="stat-label">Active Model</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="tokenCount">0</div>
                    <div class="stat-label">Tokens Streamed</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="timeTaken">0.0s</div>
                    <div class="stat-label">Compute Time</div>
                </div>
                <div style="margin-top: auto; padding: 15px; background: rgba(255,255,255,0.05); border-radius: 8px;">
                    <div class="stat-label" style="text-align: left; margin-bottom: 5px;">Active Mode</div>
                    <div style="color: var(--neon-blue); font-weight: 600;">Symphony Parallel</div>
                </div>
            </div>

            <div class="thinking-indicator" id="loader">
                <div class="spinner"></div>
                <div style="font-family: 'JetBrains Mono'; color: var(--neon-blue);">REASONING...</div>
            </div>
        </div>
    </div>

    <!-- Import Engine -->

    <script>
        const stepsContainer = document.getElementById('stepsContainer');
        const loader = document.getElementById('loader');
        const queryInput = document.getElementById('queryInput');
        const TOKEN_KEY = 'hazoom_intel_token';
        const USER_KEY = 'hazoom_intel_user';
        const USER_PASS = 'hazoom-local';

        // Allow Enter key
        queryInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') startDeepThink();
        });

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, c => (
                { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
            ));
        }

        function authHeaders(token) {
            return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token };
        }

        // Reasoning is a privileged, metered capability, so it requires a session
        // token. Reuse the stored one, or provision a local loopback identity.
        async function ensureToken() {
            const existing = localStorage.getItem(TOKEN_KEY);
            if (existing) return existing;
            const username = localStorage.getItem(USER_KEY) || 'reasoner';
            let res = await fetch('/api/v1/auth/register', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password: USER_PASS })
            });
            if (!res.ok && res.status !== 409) throw new Error('Cannot provision local reasoning session');
            res = await fetch('/api/v1/auth/login', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password: USER_PASS })
            });
            if (!res.ok) throw new Error('Local reasoning session refused');
            const data = await res.json();
            if (!data.token) throw new Error('No session token issued');
            localStorage.setItem(TOKEN_KEY, data.token);
            localStorage.setItem(USER_KEY, username);
            return data.token;
        }

        async function showModel() {
            try {
                const res = await fetch('/api/v1/intelligence/health');
                const data = await res.json();
                document.getElementById('modelLabel').textContent = data.model || (data.status === 'online' ? 'local' : 'offline');
            } catch (e) {
                document.getElementById('modelLabel').textContent = 'unreachable';
            }
        }
        showModel();

        function resetStats() {
            document.getElementById('modelLabel').textContent = '…';
            document.getElementById('tokenCount').innerText = '0';
            document.getElementById('timeTaken').innerText = '0.0s';
        }

        function renderAnswer(text, model, offline) {
            stepsContainer.innerHTML = '';
            const div = document.createElement('div');
            div.className = 'step-card';
            div.innerHTML = `
                <div class="step-header">
                    <span>${offline ? 'UNAVAILABLE' : 'REASONING RESULT'}</span>
                    <span>${escapeHtml(model || '')}</span>
                </div>
                <div class="step-content">${escapeHtml(text)}</div>
            `;
            stepsContainer.appendChild(div);
        }

        async function startDeepThink() {
            const query = queryInput.value.trim();
            if (!query) return;

            stepsContainer.innerHTML = '';
            loader.classList.add('active');
            resetStats();
            const started = performance.now();

            try {
                const token = await ensureToken();
                const res = await fetch('/api/v1/intelligence/stream', {
                    method: 'POST',
                    headers: authHeaders(token),
                    body: JSON.stringify({ prompt: query })
                });

                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.error || `Reasoning failed (HTTP ${res.status})`);
                }

                // Stream tokens straight from the real model into the transcript.
                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                let full = '';
                let model = null;
                let offline = false;
                let tokens = 0;
                let live = document.createElement('div');
                live.className = 'step-card';
                stepsContainer.appendChild(live);

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    let idx;
                    while ((idx = buffer.indexOf('\n\n')) >= 0) {
                        const raw = buffer.slice(0, idx);
                        buffer = buffer.slice(idx + 2);
                        const typeLine = raw.match(/^event: (.+)$/m);
                        const dataLine = raw.match(/^data: (.+)$/m);
                        if (!typeLine || !dataLine) continue;
                        let evt;
                        try { evt = JSON.parse(dataLine[1]); } catch (e) { continue; }
                        if (typeLine[1] === 'token') {
                            full += evt.token || '';
                            tokens++;
                            live.innerHTML = `<div class="step-content">${escapeHtml(full)}</div>`;
                            document.getElementById('tokenCount').innerText = String(tokens);
                            stepsContainer.scrollTop = stepsContainer.scrollHeight;
                        } else if (typeLine[1] === 'done') {
                            model = evt.model;
                            offline = evt.offline === true;
                            if (model) document.getElementById('modelLabel').textContent = model;
                        }
                    }
                }

                if (full.trim()) renderAnswer(full.trim(), model, offline);
                else renderAnswer('The model returned an empty response.', model, true);
            } catch (e) {
                renderAnswer(e.message, null, true);
            } finally {
                document.getElementById('timeTaken').innerText = ((performance.now() - started) / 1000).toFixed(1) + 's';
                loader.classList.remove('active');
            }
        }

        // Auto-run if perceptron is in URL? No, keep it clean.
        // Pre-fill input for demo
        setTimeout(() => {
            if (!queryInput.value) {
                queryInput.placeholder = "Try typing 'Attention is all you need'...";
            }
        }, 2000);
    </script>
</body>

</html>
