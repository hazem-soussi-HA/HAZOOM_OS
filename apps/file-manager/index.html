<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAZOOM OS File Manager</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #030712;
  color: #e2e8f0;
  font-family: 'Segoe UI', system-ui, sans-serif;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
#header {
  background: #0a0f1e;
  padding: 10px 16px;
  border-bottom: 1px solid #00f0ff33;
  display: flex;
  align-items: center;
  gap: 12px;
}
#header .title { color: #00f0ff; font-size: 16px; font-weight: bold; }
#breadcrumb {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 13px;
  overflow-x: auto;
}
#breadcrumb .crumb {
  color: #00f0ff;
  cursor: pointer;
  padding: 2px 6px;
  border-radius: 4px;
  white-space: nowrap;
}
#breadcrumb .crumb:hover { background: #00f0ff22; }
#breadcrumb .sep { color: #475569; margin: 0 2px; }
#main {
  flex: 1;
  display: flex;
  overflow: hidden;
}
#file-list {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
}
.file-item {
  display: flex;
  align-items: center;
  padding: 8px 12px;
  border-radius: 6px;
  cursor: pointer;
  transition: background 0.15s;
  gap: 10px;
}
.file-item:hover { background: #00f0ff11; border: 1px solid #00f0ff33; }
.file-item .icon { font-size: 18px; width: 24px; text-align: center; }
.file-item .name { flex: 1; font-size: 14px; color: #e2e8f0; }
.file-item .size { font-size: 12px; color: #94a3b8; min-width: 70px; text-align: right; }
.file-item .date { font-size: 12px; color: #64748b; min-width: 120px; text-align: right; }
.file-item.dir .name { color: #00f0ff; }
.file-item.file .name { color: #e2e8f0; }
#preview-panel {
  width: 45%;
  border-left: 1px solid #00f0ff33;
  background: #0a0f1e;
  display: none;
  flex-direction: column;
}
#preview-panel.active { display: flex; }
#preview-header {
  padding: 10px 14px;
  border-bottom: 1px solid #00f0ff22;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
#preview-header .filename { color: #00f0ff; font-size: 13px; font-weight: bold; }
#preview-close { background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 18px; }
#preview-content {
  flex: 1;
  overflow-y: auto;
  padding: 14px;
  font-family: 'Courier New', monospace;
  font-size: 13px;
  line-height: 1.5;
  color: #10b981;
  white-space: pre-wrap;
  word-break: break-word;
}
#loading { text-align: center; padding: 40px; color: #94a3b8; }
</style>
</head>
<body>
<div id="header">
  <span class="title">File Manager</span>
  <div id="breadcrumb"></div>
</div>
<div id="main">
  <div id="file-list"><div id="loading">Loading...</div></div>
  <div id="preview-panel">
    <div id="preview-header">
      <span class="filename" id="preview-filename"></span>
      <button id="preview-close">&times;</button>
    </div>
    <div id="preview-content"></div>
  </div>
</div>
<script>
const API = window.location.origin + '/api';
let currentPath = '/home/hazem';

async function loadDirectory(path) {
  const list = document.getElementById('file-list');
  list.innerHTML = '<div id="loading">Loading...</div>';
  try {
    const res = await fetch(API + '/fs/list?path=' + encodeURIComponent(path));
    if (!res.ok) { list.innerHTML = '<div id="loading">Error: HTTP ' + res.status + '</div>'; return; }
    const data = await res.json();
    currentPath = path;
    renderBreadcrumb(path);
    renderFileList(data, path);
  } catch(e) {
    list.innerHTML = '<div id="loading">Error: ' + e.message + '</div>';
  }
}

function renderBreadcrumb(path) {
  const bc = document.getElementById('breadcrumb');
  const parts = path.split('/').filter(Boolean);
  let html = '';
  let accum = '';
  html += '<span class="crumb" data-path="/">/</span>';
  parts.forEach((p, i) => {
    accum += '/' + p;
    html += '<span class="sep">/</span>';
    html += '<span class="crumb" data-path="' + accum + '">' + p + '</span>';
  });
  bc.innerHTML = html;
  bc.querySelectorAll('.crumb').forEach(c => {
    c.onclick = () => loadDirectory(c.dataset.path);
  });
}

function renderFileList(items, path) {
  const list = document.getElementById('file-list');
  if (!Array.isArray(items) || items.length === 0) { list.innerHTML = '<div id="loading">Empty directory</div>'; return; }
  const sorted = items.sort((a, b) => {
    const aDir = a.type === 'dir' || a.isDirectory ? 0 : 1;
    const bDir = b.type === 'dir' || b.isDirectory ? 0 : 1;
    if (aDir !== bDir) return aDir - bDir;
    return (a.name || '').localeCompare(b.name || '');
  });
  list.innerHTML = sorted.map(item => {
    const isDir = item.type === 'dir' || item.isDirectory;
    const icon = isDir ? '📁' : '📄';
    const size = item.size ? formatSize(item.size) : '';
    const date = item.modified || item.mtime || '';
    return `<div class="file-item ${isDir ? 'dir' : 'file'}" data-name="${escapeAttr(item.name || '')}" data-dir="${isDir ? 1 : 0}">
      <span class="icon">${icon}</span>
      <span class="name">${item.name}</span>
      <span class="size">${size}</span>
      <span class="date">${date}</span>
    </div>`;
  }).join('');
  list.querySelectorAll('.file-item').forEach(el => {
    el.onclick = () => {
      const name = el.dataset.name;
      const isDir = el.dataset.dir === '1';
      const fullPath = path.replace(/\/$/, '') + '/' + name;
      if (isDir) loadDirectory(fullPath);
      else loadFile(fullPath);
    };
  });
}

async function loadFile(path) {
  const panel = document.getElementById('preview-panel');
  const content = document.getElementById('preview-content');
  const filename = document.getElementById('preview-filename');
  filename.textContent = path.split('/').pop();
  content.textContent = 'Loading file content...';
  panel.classList.add('active');
  try {
    const res = await fetch(API + '/fs/read?path=' + encodeURIComponent(path));
    if (!res.ok) { content.textContent = 'Error: HTTP ' + res.status; return; }
    const text = await res.text();
    content.textContent = text;
  } catch(e) {
    content.textContent = 'Error: ' + e.message;
  }
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  if (bytes < 1073741824) return (bytes / 1048576).toFixed(1) + ' MB';
  return (bytes / 1073741824).toFixed(1) + ' GB';
}

function escapeAttr(s) { return s.replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }

document.getElementById('preview-close').onclick = () => {
  document.getElementById('preview-panel').classList.remove('active');
};

loadDirectory(currentPath);
</script>
</body>
</html>
