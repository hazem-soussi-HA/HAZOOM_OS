name: HAZOOM OS CI/CD Pipeline
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  K8S_NAMESPACE: hazoom-os

jobs:
  # ========================================
  # JOB 1: Code Quality & Security
  # ========================================
  quality:
    name: Code Quality & Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint JavaScript
        run: |
          npx eslint server.js core/ kernel/ apps/ --ext .js || true

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

      - name: Verify API endpoints
        run: |
          node server.js &
          sleep 3
          curl -sf http://localhost:3000/health || exit 1
          curl -sf http://localhost:3000/api/status || exit 1
          curl -sf http://localhost:3000/api/qlearner/status || exit 1
          curl -sf http://localhost:3000/api/system/metrics || exit 1
          pkill -f "node server.js" || true

  # ========================================
  # JOB 2: Build Docker Image
  # ========================================
  build:
    name: Build & Push Container
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========================================
  # JOB 3: Deploy to Test Environment
  # ========================================
  deploy-test:
    name: Deploy to Test (LXC)
    needs: build
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to LXC container
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TEST_HOST }}
          username: ${{ secrets.TEST_USER }}
          key: ${{ secrets.TEST_SSH_KEY }}
          port: ${{ secrets.TEST_PORT }}
          script: |
            cd /opt/hazoom-os
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:develop
            docker-compose -f docker-compose.test.yml down
            docker-compose -f docker-compose.test.yml up -d
            sleep 5
            curl -sf http://localhost:3000/health || exit 1
            echo "Test deployment successful"

  # ========================================
  # JOB 4: Deploy to Production (Charmed K8s)
  # ========================================
  deploy-prod:
    name: Deploy to Production (Charmed Kubernetes)
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup MicroK8s
        uses: balchua/microk8s-actions@v0.3
        with:
          channel: 1.28/stable
          addons: ["dns", "storage", "ingress", "helm3"]

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Setup Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.14.0'

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Deploy to Kubernetes
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          kubectl config use-context hazoom-prod
          kubectl set image deployment/hazoom-os-app \
            app=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }} \
            -n hazoom-os
          kubectl rollout status deployment/hazoom-os-app -n hazoom-os --timeout=300s
          echo "Production deployment successful"

  # ========================================
  # JOB 5: Update DNS (Cloudflare)
  # ========================================
  update-dns:
    name: Update DNS Records
    needs: deploy-prod
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Update Cloudflare DNS
        uses: reitermarkus/cloudflare-dns-action@v1
        with:
          zone: ${{ secrets.CF_ZONE_ID }}
          token: ${{ secrets.CF_API_TOKEN }}
          name: hazoom.peaceful.world
          type: A
          content: ${{ secrets.PROD_HOST }}
          proxied: true

      - name: Verify DNS propagation
        run: |
          sleep 30
          for i in 1 2 3 4 5; do
            dig +short hazoom.peaceful.world | head -1 && exit 0
            sleep 10
          done
          echo "DNS propagation timeout"

  # ========================================
  # JOB 6: Post-Deploy Smoke Test
  # ========================================
  smoke-test:
    name: Production Smoke Test
    needs: [deploy-prod, update-dns]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Run smoke tests
        run: |
          BASE=https://hazoom.peaceful.world
          curl -sf $BASE/health || exit 1
          curl -sf $BASE/api/status || exit 1
          curl -sf $BASE/api/qlearner/status || exit 1
          curl -sf $BASE/api/consciousness || exit 1
          curl -sf $BASE/api/system/metrics || exit 1
          echo "All smoke tests passed"
