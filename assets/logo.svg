<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <!-- Outer ring -->
  <circle cx="256" cy="256" r="240" stroke="url(#g1)" stroke-width="4" fill="none" opacity="0.3"/>

  <!-- Inner orbit ring -->
  <circle cx="256" cy="256" r="180" stroke="url(#g2)" stroke-width="2" fill="none" opacity="0.2"/>

  <!-- Core hexagon -->
  <polygon points="256,100 361,151 361,253 256,304 151,253 151,151"
    fill="url(#g1)" opacity="0.15" stroke="url(#g1)" stroke-width="3"/>

  <!-- Inner hexagon (the H) -->
  <polygon points="256,130 340,172 340,256 256,298 172,256 172,172"
    fill="url(#g1)" opacity="0.08" stroke="url(#g2)" stroke-width="2"/>

  <!-- Center "H" letterform -->
  <g transform="translate(256,214)">
    <rect x="-48" y="-60" width="16" height="120" rx="4" fill="url(#g1)" opacity="0.9"/>
    <rect x="32" y="-60" width="16" height="120" rx="4" fill="url(#g1)" opacity="0.9"/>
    <rect x="-48" y="-10" width="96" height="16" rx="4" fill="url(#g3)" opacity="0.8"/>
  </g>

  <!-- Orbital dots -->
  <circle cx="256" cy="76" r="6" fill="url(#g2)" opacity="0.8"/>
  <circle cx="256" cy="436" r="6" fill="url(#g2)" opacity="0.8"/>
  <circle cx="76" cy="256" r="6" fill="url(#g3)" opacity="0.8"/>
  <circle cx="436" cy="256" r="6" fill="url(#g3)" opacity="0.8"/>

  <!-- Small decorative dots on inner orbit -->
  <circle cx="256" cy="76" r="3" fill="url(#g2)" opacity="0.4"/>
  <circle cx="367" cy="130" r="3" fill="url(#g1)" opacity="0.4"/>
  <circle cx="420" cy="256" r="3" fill="url(#g1)" opacity="0.4"/>
  <circle cx="367" cy="382" r="3" fill="url(#g1)" opacity="0.4"/>
  <circle cx="256" cy="436" r="3" fill="url(#g2)" opacity="0.4"/>
  <circle cx="145" cy="382" r="3" fill="url(#g1)" opacity="0.4"/>
  <circle cx="92" cy="256" r="3" fill="url(#g1)" opacity="0.4"/>
  <circle cx="145" cy="130" r="3" fill="url(#g1)" opacity="0.4"/>
</svg>
