<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f0ff"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#ffd700"/>
    </linearGradient>
    <linearGradient id="logoGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f0ff;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0.1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer glow ring -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#logoGrad)" stroke-width="1" opacity="0.15"/>
  <circle cx="100" cy="100" r="80" fill="none" stroke="url(#logoGrad)" stroke-width="1.5" opacity="0.25"/>

  <!-- Hexagon outer -->
  <polygon points="100,12 175,55 175,145 100,188 25,145 25,55"
           fill="none" stroke="url(#logoGrad)" stroke-width="3" opacity="0.6"
           filter="url(#glow)"/>

  <!-- Hexagon inner -->
  <polygon points="100,30 155,62.5 155,137.5 100,170 45,137.5 45,62.5"
           fill="none" stroke="#00f0ff" stroke-width="1.5" opacity="0.35"/>

  <!-- Hexagon core fill -->
  <polygon points="100,30 155,62.5 155,137.5 100,170 45,137.5 45,62.5"
           fill="url(#logoGrad2)"/>

  <!-- Letter H -->
  <text x="100" y="115" text-anchor="middle" font-size="72" font-weight="900"
        font-family="Inter, system-ui, -apple-system, sans-serif"
        fill="url(#logoGrad)" filter="url(#glowStrong)">H</text>

  <!-- Small accent dots -->
  <circle cx="100" cy="22" r="2" fill="#00f0ff" opacity="0.5"/>
  <circle cx="100" cy="178" r="2" fill="#ffd700" opacity="0.5"/>
</svg>
