<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="420" height="420" role="img" aria-label="Silhouette">
  <title>Silhouette</title>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.30"/>
      <stop offset="0.6" stop-color="#a78bfa" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <style>
    @keyframes breathe { 0%,100% { transform: scale(1); opacity:.55 } 50% { transform: scale(1.035); opacity:.9 } }
    @keyframes ripple {
      0%   { transform: scale(1);    opacity:.5 }
      100% { transform: scale(1.85); opacity:0 }
    }
    @keyframes scan { 0% { transform: translateY(0) } 100% { transform: translateY(300px) } }
    @keyframes spin  { to { transform: rotate(360deg) } }
    @keyframes bar   { 0%,100% { transform: scaleY(.32) } 50% { transform: scaleY(1) } }
    .breath { transform-origin: 210px 200px; animation: breathe 5.5s ease-in-out infinite; }
    .rip    { transform-origin: 210px 200px; animation: ripple 4.4s ease-out infinite }
    .rip2   { transform-origin: 210px 200px; animation: ripple 4.4s ease-out infinite; animation-delay: 2.2s }
    .rip3   { transform-origin: 210px 200px; animation: ripple 4.4s ease-out infinite; animation-delay: 1.1s }
    .scan   { animation: scan 6s linear infinite; filter: url(#soft) }
    .spin   { transform-origin: 210px 200px; animation: spin 44s linear infinite }
    .spin-r { transform-origin: 210px 200px; animation: spin 30s linear infinite reverse }
    .b      { transform-box: fill-box; transform-origin: center bottom; animation: bar 1.15s ease-in-out infinite }
  </style>

  <rect width="420" height="420" fill="#07090c"/>

  <!-- ambient ripples: the thing that answers -->
  <circle class="rip"  cx="210" cy="200" r="120" fill="none" stroke="#22d3ee" stroke-width="1.2"/>
  <circle class="rip2" cx="210" cy="200" r="120" fill="none" stroke="#a78bfa" stroke-width="1.2"/>
  <circle class="rip3" cx="210" cy="200" r="120" fill="none" stroke="#fb923c" stroke-width="1.2"/>

  <circle cx="210" cy="200" r="150" fill="url(#core)"/>

  <!-- rotating ticks: process ticks that never reach a listener -->
  <g class="spin" opacity="0.5">
    <circle cx="210" cy="200" r="168" fill="none" stroke="url(#edge)" stroke-width="1"
            stroke-dasharray="2 26"/>
  </g>
  <g class="spin-r" opacity="0.35">
    <circle cx="210" cy="200" r="150" fill="none" stroke="url(#edge)" stroke-width="1"
            stroke-dasharray="1 34"/>
  </g>

  <!-- the silhouette itself -->
  <g class="breath">
    <path d="M210 92
             C246 92 268 122 268 168
             C268 196 258 214 258 232
             C258 244 266 252 274 258
             L146 258
             C154 252 162 244 162 232
             C162 214 152 196 152 168
             C152 122 174 92 210 92 Z"
          fill="url(#edge)" opacity="0.16"/>
    <path d="M210 92
             C246 92 268 122 268 168
             C268 196 258 214 258 232
             C258 244 266 252 274 258
             L146 258
             C154 252 162 244 162 232
             C162 214 152 196 152 168
             C152 122 174 92 210 92 Z"
          fill="none" stroke="url(#edge)" stroke-width="1.6"/>
    <circle cx="210" cy="162" r="3.2" fill="#22d3ee"/>
  </g>

  <!-- scanline sweep -->
  <rect class="scan" x="60" y="120" width="300" height="2" fill="#22d3ee" opacity="0.5"/>

  <!-- voice bars: this is the part that speaks -->
  <g transform="translate(160 296)" fill="url(#edge)">
    <rect class="b" x="0"   y="-14" width="5" height="14" rx="2.5" style="animation-delay:0s"/>
    <rect class="b" x="12"  y="-26" width="5" height="26" rx="2.5" style="animation-delay:.1s"/>
    <rect class="b" x="24"  y="-38" width="5" height="38" rx="2.5" style="animation-delay:.2s"/>
    <rect class="b" x="36"  y="-20" width="5" height="20" rx="2.5" style="animation-delay:.3s"/>
    <rect class="b" x="48"  y="-32" width="5" height="32" rx="2.5" style="animation-delay:.4s"/>
    <rect class="b" x="60"  y="-16" width="5" height="16" rx="2.5" style="animation-delay:.5s"/>
    <rect class="b" x="72"  y="-28" width="5" height="28" rx="2.5" style="animation-delay:.6s"/>
    <rect class="b" x="84"  y="-12" width="5" height="12" rx="2.5" style="animation-delay:.7s"/>
  </g>

  <text x="210" y="352" text-anchor="middle" font-family="ui-monospace,Menlo,monospace"
        font-size="10.5" letter-spacing="4.5" fill="#5b6474">SILHOUETTE</text>
</svg>
