# HAZOOM OS — Kubeconfig Template
# Fill in the values below with your actual cluster credentials
# Then base64 encode it and add as GitHub Secret: KUBECONFIG

apiVersion: v1
clusters:
  - cluster:
      # Replace with your cluster's API server URL
      server: https://<YOUR-K8S-API-SERVER>:6443
      # Replace with your cluster's CA certificate (base64 encoded)
      certificate-authority-data: <BASE64-ENCODED-CA-CERT>
    name: hazoom-prod

contexts:
  - context:
      cluster: hazoom-prod
      namespace: hazoom-os
      user: hazoom-admin
    name: hazoom-prod

current-context: hazoom-prod

kind: Config

users:
  - name: hazoom-admin
    user:
      # Option 1: Client certificate authentication
      client-certificate-data: <BASE64-ENCODED-CLIENT-CERT>
      client-key-data: <BASE64-ENCODED-CLIENT-KEY>
      # Option 2: Token authentication (uncomment below, comment above)
      # token: <YOUR-SERVICE-ACCOUNT-TOKEN>

---
# HOW TO GENERATE THIS FILE:
#
# Option A: From an existing Charmed K8s cluster
#   juju scp kubernetes-master/0:config ~/.kube/config
#   cat ~/.kube/config | base64 -w 0
#   → Paste into GitHub Secret: KUBECONFIG
#
# Option B: From MicroK8s
#   microk8s config > ~/.kube/config
#   cat ~/.kube/config | base64 -w 0
#   → Paste into GitHub Secret: KUBECONFIG
#
# Option C: From kubectl (any cluster)
#   kubectl config view --raw | base64 -w 0
#   → Paste into GitHub Secret: KUBECONFIG
#
# Option D: Service Account token (for CI/CD)
#   kubectl create serviceaccount hazoom-deployer -n hazoom-os
#   kubectl create clusterrolebinding hazoom-deployer \
#     --clusterrole=admin --serviceaccount=hazoom-os:hazoom-deployer
#   SECRET=$(kubectl get sa hazoom-deployer -n hazoom-os -o jsonpath='{.secrets[0].name}')
#   TOKEN=$(kubectl get secret $SECRET -n hazoom-os -o jsonpath='{.data.token}' | base64 -d)
#   → Use token in the user section above
