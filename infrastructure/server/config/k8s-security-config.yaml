# Kubernetes Security Configuration for World Map
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: map-https-policy
  namespace: map-security
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - ports:
    - protocol: TCP
      port: 8443
    from:
    - namespaceSelector:
        matchLabels:
          name: map-security
    - podSelector:
        matchLabels:
          app: trusted-client
